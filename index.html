#chatHeader{padding-top:calc(.75rem + env(safe-area-inset-top,0px))!important;box-shadow:0 6px 24px rgba(0,0,0,.18);position:relative;z-index:5}
#status{letter-spacing:.02em;transition:color .3s ease,opacity .3s ease}

#composer{background:rgba(255,255,255,.78)!important;-webkit-backdrop-filter:blur(16px) saturate(1.5);backdrop-filter:blur(16px) saturate(1.5);border-top:1px solid rgba(0,0,0,.05);padding-bottom:calc(.5rem + env(safe-area-inset-bottom,0px))!important}
#composer #message{background:#fff;border:1px solid rgba(0,0,0,.08)!important;box-shadow:0 2px 10px rgba(0,0,0,.05);transition:box-shadow .2s ease,border-color .2s ease}
#composer #message:focus{border-color:color-mix(in srgb,var(--accent) 55%,transparent)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent),0 4px 16px rgba(0,0,0,.08)}

button{transition:transform .15s cubic-bezier(.2,.8,.2,1),box-shadow .2s ease,filter .2s ease}
button:active:not(:disabled){transform:scale(.94)}
#send:not(:disabled):hover{filter:brightness(1.06)}

#messages{scroll-behavior:smooth;scrollbar-width:thin;scrollbar-color:rgba(0,0,0,.18) transparent}
.bubble{transition:box-shadow .25s ease,background .35s ease,transform .2s ease}
.bubble .msg-meta,.msg-spacer{font-variant-numeric:tabular-nums;letter-spacing:.02em}
.date-sep{-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 2px 10px rgba(0,0,0,.08);letter-spacing:.04em}

#messages:empty::before{content:"This Chat box only Design \2728\A For You";white-space:pre-line;text-align:center;margin:auto;padding:0 32px;font-size:13px;line-height:1.7;color:rgba(0,0,0,.42)}

#menu,.modal>div{-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);box-shadow:0 18px 50px rgba(0,0,0,.28)}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style id="premium-v2">
body{font-family:"Manrope","Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(circle at 20% 10%,color-mix(in srgb,var(--accent) 10%,#f3f4f6),#eceef2)}

#chatHeader,#local,#incoming h2,#login h1{animation:none!important}
#connect:after,#login:before,#login:after{display:none!important}

#login{background:#fff;padding:0;justify-content:flex-start}
.login-hero{flex:1 1 auto;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:calc(28px + env(safe-area-inset-top,0px)) 28px 56px;color:#fff;background:linear-gradient(165deg,var(--header-from),var(--header-mid))}
.login-mark{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;margin-bottom:18px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);flex-shrink:0}
#login h1{margin:0;text-align:left;font-size:32px;font-weight:800;line-height:1.1;letter-spacing:-.03em;background:none;-webkit-background-clip:border-box;background-clip:border-box;color:#fff;-webkit-text-fill-color:#fff}
#login h1:before{content:none}
.login-hero p{margin:10px 0 0;max-width:30ch;font-size:15px;line-height:1.5;color:rgba(255,255,255,.8)}
.login-sheet{flex-shrink:0;background:#fff;border-radius:28px 28px 0 0;margin-top:-28px;padding:28px 24px calc(24px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(15,23,42,.14)}
.login-sheet label{display:block;margin:0 0 6px 2px;font-size:13px;font-weight:600;color:#475569}
#login input{width:100%;height:52px;margin-bottom:16px;padding:0 16px;border-radius:14px;border:1px solid #e2e8f0;background:#f8fafc;color:#0f172a}
#login input::placeholder{color:#94a3b8}
#login input:focus{outline:none;transform:none;background:#fff;border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 16%,transparent)}
#connect{display:flex;align-items:center;justify-content:center;width:100%;height:52px;padding:0;border:0;border-radius:16px;font-size:16px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--header-mid),var(--header-to));box-shadow:0 10px 24px color-mix(in srgb,var(--header-mid) 32%,transparent)}
#connect:hover{transform:none}
#loginStatus{margin-top:14px;font-size:13px;color:#64748b}
@media (max-height:560px){.login-hero p{display:none}}

#chatHeader{padding-left:12px;padding-right:12px}
#chatHeader>div:last-child{gap:8px}
#dpBtn{width:42px;height:42px;box-shadow:0 0 0 2px rgba(255,255,255,.28)}
#partnerName{font-size:16px;font-weight:700;letter-spacing:-.01em}
#status{font-size:12px;opacity:.85}
#scrollBottom,#menuBtn{width:38px;height:38px;padding:0;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22)}
#scrollBottom{overflow:visible!important}
#scrollBottom .rui-ripple{display:none}
#menu{width:13rem;border-radius:16px;overflow:hidden}
#menu button{padding:14px 16px;font-size:14.5px;border-color:rgba(15,23,42,.06)}

#messages{scrollbar-color:color-mix(in srgb,var(--accent) 35%,transparent) transparent}
#messages::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--accent) 30%,transparent)}
#messages .bubble{border:0;border-radius:18px;padding-left:12px;padding-right:12px;font-size:15px;line-height:1.42;box-shadow:0 1px 2px rgba(15,23,42,.10)!important}
#messages .bubble:hover{transform:none}
#messages .bubble.sent{border-bottom-right-radius:6px}
#messages .bubble.received{border-bottom-left-radius:6px}
#messages .bubble>.msg-meta.abs{right:12px}
.bubble img,.bubble video{border-radius:12px}
.date-sep{background:rgba(255,255,255,.78);color:#475569;font-weight:600;font-size:11.5px;letter-spacing:0;box-shadow:0 1px 3px rgba(15,23,42,.08)}
#messages>button{color:var(--accent)!important;border-color:color-mix(in srgb,var(--accent) 30%,transparent)!important}
.select-row{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.msg-check.checked{background:var(--accent);border-color:var(--accent)}
#replyBox{border-left-color:var(--accent);border-radius:14px}
#replyBox .text-teal-700{color:var(--accent)}
.reply-preview{border-left-color:var(--accent)!important;border-radius:8px}

#composer{gap:8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px))!important}
#composer #message{field-sizing:content;min-height:44px;max-height:120px;padding:11px 16px;border-radius:24px;line-height:1.35;border-color:rgba(15,23,42,.10)!important}
#emojiBtn{width:42px;height:42px;background:transparent;box-shadow:none}
#send{width:44px;height:44px}
#emojiTray{padding:8px 12px;background:rgba(255,255,255,.92);gap:4px}
#emojiTray button{width:40px;height:40px;border-radius:12px}
#emojiTray button:active{background:#f1f5f9}

#actions{align-items:flex-end}
#actions>div{width:calc(100% - 20px);max-width:420px;margin:0 10px calc(10px + env(safe-area-inset-bottom,0px));border-radius:22px;animation:sheetUp .3s var(--ease)}
#actions>div button{padding:15px 20px;font-size:15.5px;border-color:rgba(15,23,42,.06)}
#themeModal>div,#colors>div{border-radius:22px}
#downloadBtn{background:var(--accent)}
#dpViewerChange{background:var(--accent)!important}

#local{border-radius:16px}
#callName,#caller{font-weight:700;letter-spacing:-.01em}
#callName{font-size:20px}
#callState{font-size:14px;opacity:.75}
@keyframes sheetUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.send-error{margin-top:2px;font-size:12px;font-weight:600;text-decoration:underline;cursor:pointer}
</style>

<script>
(function () {
  try {
    if (typeof requestAnimationFrame !== "function") return;
    var frames = 0, start = null;
    function tick(now) {
      if (start === null) start = now;
      frames++;
      if (now - start < 700) {
        requestAnimationFrame(tick);
      } else {
        var fps = frames / ((now - start) / 1000);
        if (fps < 45) {
          document.documentElement.classList.add("lite");
          console.info("Lite rendering mode on (~" + Math.round(fps) + " fps measured)");
        }
      }
    }
    requestAnimationFrame(tick);
  } catch (e) { /* never block the app over a perf probe */ }
})();
</script>

function linkifyText(text) {
  const frag = document.createDocumentFragment();
  const re = /(https?:\/\/[^\s<]+|www\.[^\s<]+)/gi;
  let last = 0, m;
  while ((m = re.exec(text)) !== null) {
    frag.append(document.createTextNode(text.slice(last, m.index)));
    let raw = m[0], trailing = "";
    while (/[.,!?;:)\]}]$/.test(raw)) {
      trailing = raw.slice(-1) + trailing;
      raw = raw.slice(0, -1);
    }
    const a = document.createElement("a");
    a.className = "linkified";
    a.textContent = raw;
    a.href = raw.startsWith("www.") ? "https://" + raw : raw;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.onclick = e => {
      e.preventDefault();
      const url = a.href;
      if (/Android/i.test(navigator.userAgent)) {
        try {
          const u = new URL(url);
          window.location.href =
            "intent://" + u.host + u.pathname + u.search + u.hash +
            "#Intent;scheme=" + u.protocol.replace(":", "") +
            ";package=com.android.chrome;end";
          return;
        } catch (_) {}
      }
      window.open(url, "_blank", "noopener,noreferrer");
    };
    frag.append(a);
    if (trailing) frag.append(document.createTextNode(trailing));
    last = m.index + m[0].length;
  }
  frag.append(document.createTextNode(text.slice(last)));
  return frag;
}

  localMessages.forEach((m, id) => {
    if (!a.some(x => x.id === id)) a.push(m);
  });

  a.sort((x, y) => {
    const tx = Number(x.timestamp) || 0;
    const ty = Number(y.timestamp) || 0;
    return tx - ty;
  });

  const sig = a.map(m => [m.id, m.status, m.sendError, m.isEdited, m.isDeleted, (m.text || "").length, (m.image || "").length,
    JSON.stringify(m.deletedFor || ""), JSON.stringify(m.reactions || "")].join("|")).join("\n");
  if (fromListener && sig === lastRenderSig) return;
  lastRenderSig = sig;

  earliestLoadedTs = a.length ? (Number(a[0].timestamp) || null) : null;

  const box = $("messages");
  const wasNearBottom =
    box.scrollHeight - box.scrollTop - box.clientHeight < 120;

  a.forEach(m => {
    if (m.senderId === myId || m.isDeleted || seenMessageIds.has(m.id)) return;
    seenMessageIds.add(m.id);
    if (renderedOnce) {
      if (!wasNearBottom) unreadCount++;
      playNotifySound();
    }
  });
  if (wasNearBottom) unreadCount = 0;
  renderedOnce = true;
  updateUnreadBadge();

  const frag = document.createDocumentFragment();
  const toMarkRead = [], toMarkDelivered = [];
  let lastDateKey = "";

  if (a.length && !noMoreOlder) {
    const loadBtn = document.createElement("button");
    loadBtn.type = "button";
    loadBtn.disabled = loadingOlder;
    loadBtn.textContent = loadingOlder ? "Loading…" : "⬆ Load earlier messages";
    loadBtn.className =
      "self-center text-xs font-semibold text-teal-700 bg-white/85 border border-teal-700/25 " +
      "rounded-full px-3 py-1.5 my-1 shadow-sm hover:bg-teal-50 active:scale-95 transition disabled:opacity-60";
    loadBtn.onclick = loadOlderMessages;
    frag.append(loadBtn);
  }

  a.forEach(m => {
    if (document.hidden || m.isDeleted) return; // not looking = not seen
    const df = Array.isArray(m.deletedFor) ? m.deletedFor : [];
    const seen = m.senderId !== myId || m.status === "read";
    if (!seen) return;
    if (df.includes(myId) && !df.includes(partnerId)) return; // already cleared for me
    seenToPurge.set(m.id, df.includes(partnerId));
  });

  a.forEach(m => {
    const deletedFor = Array.isArray(m.deletedFor) ? m.deletedFor : [];
    if (deletedFor.includes(myId) || localHiddenMessages.has(m.id)) return;

    const msgTime = Number(m.timestamp);
    if (Number.isFinite(msgTime) && msgTime > 0) {
      const d = new Date(msgTime);
      const dateKey = d.toDateString();
      if (dateKey !== lastDateKey) {
        lastDateKey = dateKey;
        const today = new Date().toDateString();
        const yest = new Date(Date.now() - 86400000).toDateString();
        const label = dateKey === today ? "Today" : dateKey === yest ? "Yesterday" :
          d.toLocaleDateString("en-US", { day: "numeric", month: "short", year: "numeric" });
        const sep = document.createElement("div");
        sep.className = "date-sep";
        sep.textContent = label;
        frag.append(sep);
      }
    }

    const r = document.createElement("div");
    const isPicked = selectedIds.has(m.id);
    r.className = "flex p-1 " + (m.senderId === myId ? "justify-end" : "justify-start") + (isPicked ? " select-row" : "");
    r.style.willChange = "transform,opacity";
    r.dataset.mid = m.id;

    const b = document.createElement("div");
    const isNewBubble = firstPaintDone && !animatedIds.has(m.id);
    animatedIds.add(m.id);
    b.className =
      "bubble " +
      (m.senderId === myId ? "sent" : "received") +
      " shadow-sm cursor-pointer" + (isNewBubble ? " enter" : "");
    b.dataset.mid = m.id;

    if (m.replyTo) {
      const rep = document.createElement("div");
      rep.className =
        "reply-preview bg-black/5 border-l-4 border-teal-700 p-1.5 mb-1.5 text-xs rounded-md text-gray-700";
      rep.textContent = m.replyTo.text || "media";
      rep.title = "Reply to message";
      b.appendChild(rep);
    }

    if (m.isDeleted) {
      b.textContent =
        m.senderId === myId
          ? "You deleted this message"
          : "This message was deleted";
      b.className += " italic text-gray-400";
    } else if (m.mediaUrl || m.image) {
      const mediaUrl = m.mediaUrl || m.image;
      const mediaType = m.mediaType || (m.image ? "image/*" : "");
      if (mediaType.startsWith("video/")) {
        const video = document.createElement("video");
        video.src = mediaUrl;
        video.controls = true;
        video.playsInline = true;
        video.preload = "metadata";
        video.className = "max-w-xs max-h-80 rounded mb-1";
        b.appendChild(video);
      } else if (mediaType.startsWith("audio/")) {
        const audio = document.createElement("audio");
        audio.src = mediaUrl;
        audio.controls = true;
        audio.preload = "metadata";
        audio.className = "w-full max-w-xs mb-1";
        b.appendChild(audio);
      } else {
        const img = document.createElement("img");
        img.src = mediaUrl;
        img.className = "max-w-xs rounded mb-1 cursor-pointer";
        img.loading = "lazy";
        img.decoding = "async";
        img.onclick = e => {
          e.stopPropagation();
          if (selectMode) { toggleMessageSelect(m.id); return; }
          $("previewImg").src = mediaUrl;
          $("previewImg").classList.remove("hidden");
          $("previewVideo").classList.add("hidden");
          $("previewAudio").classList.add("hidden");
          $("downloadBtn").href = mediaUrl;
          $("downloadBtn").download = m.fileName || "image";
          $("mediaModal").classList.remove("hidden");
        };
        b.appendChild(img);
      }
      if (m.text) {
        const txt = document.createElement("p");
        txt.textContent = m.text;
        b.appendChild(txt);
      }
    } else {
      const txt = document.createElement("div");
      txt.replaceChildren(linkifyText(m.text || ""));
      b.appendChild(txt);
    }

    const f = document.createElement("small");
    f.className =
      "msg-meta text-gray-500 whitespace-nowrap text-[10px]";

    const time = Number(m.timestamp);
    const timeText = Number.isFinite(time) && time > 0
      ? new Date(time).toLocaleTimeString("en-US", {
          hour: "numeric",
          minute: "2-digit",
          hour12: true
        })
      : "";

    f.innerHTML =
      timeText +
      (m.senderId === myId
        ? (m.status === "read"
            ? "<span class='tick-wrap text-blue-600'>" + TICK_DOUBLE + "</span>"
            : m.status === "delivered"
            ? "<span class='tick-wrap'>" + TICK_DOUBLE + "</span>"
            : "<span class='tick-wrap'>" + TICK_SINGLE + "</span>")
        : "");

    if (m.sendError) {
      const err = document.createElement("div");
      err.className = "send-error";
      err.textContent = "Not sent. Tap to retry";
      err.onclick = e => { e.stopPropagation(); retrySend(m.id); };
      b.appendChild(err);
    }

    if (m.image && !m.text) {
      b.append(f);
    } else {
      const last = b.lastElementChild;
      if (last) {
        const sp = f.cloneNode(true);
        sp.className = "msg-spacer";
        sp.setAttribute("aria-hidden", "true");
        last.appendChild(sp);
        f.classList.add("abs");
        b.appendChild(f);
      } else b.append(f);
    }

    if (m.reactions && Object.keys(m.reactions).length && !m.isDeleted) {
      const groups = {};
      for (const uid_ in m.reactions) {
        const em = m.reactions[uid_];
        (groups[em] = groups[em] || []).push(uid_);
      }
      const row = document.createElement("div");
      row.className = "absolute -bottom-3 right-2 flex gap-1";
      Object.entries(groups).forEach(([em, uids]) => {
        const pill = document.createElement("button");
        pill.type = "button";
        pill.className =
          "bg-white border rounded-full px-1.5 text-[11px] shadow flex items-center gap-0.5" +
          (uids.includes(myId) ? " border-teal-600" : " border-gray-200");
        pill.textContent = em + (uids.length > 1 ? " " + uids.length : "");
        pill.onclick = e => {
          e.stopPropagation();
          toggleReaction(m, em);
        };
        row.appendChild(pill);
      });
      b.appendChild(row);
    }

    const check = document.createElement("span");
    check.className = "msg-check" + (isPicked ? " checked" : "");
    check.setAttribute("aria-hidden", "true");
    b.appendChild(check);

    attachHeartDoubleTap(b, m);

    let sx = 0, sy = 0;
    b.ontouchstart = e => {
      if (!e.touches[0]) return;
      sx = e.touches[0].clientX;
      sy = e.touches[0].clientY;
    };

    b.ontouchend = e => {
      if (selectMode) return;
      if (!e.changedTouches[0]) return;
      const dx = e.changedTouches[0].clientX - sx;
      const dy = e.changedTouches[0].clientY - sy;

      if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy)) {
        e.preventDefault();
        e.stopPropagation();
        showReplyBubble(m);
        b.dataset.swipeReply = "1";
        setTimeout(() => delete b.dataset.swipeReply, 350);
      }
    };

    let longPressTimer = null;
    let longPressTriggered = false;
    let pressStartX = 0, pressStartY = 0;

    const openMessageActions = () => {
      selected = m;
      $("actions").classList.remove("hidden");
      $("deleteAll").classList.toggle("hidden", m.senderId !== myId || m.isDeleted);
      $("edit").classList.toggle("hidden", !(m.senderId === myId && !m.isDeleted && !m.image));
    };

    const cancelLongPress = () => {
      if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
    };

    b.addEventListener("pointerdown", e => {
      if (selectMode) return;
      if (e.target.closest("a, img, button")) return;
      longPressTriggered = false;
      pressStartX = e.clientX; pressStartY = e.clientY;
      cancelLongPress();
      longPressTimer = setTimeout(() => {
        longPressTimer = null;
        longPressTriggered = true;
        if (navigator.vibrate) navigator.vibrate(30);
        openMessageActions();
      }, 550);
    });

    b.addEventListener("pointermove", e => {
      if (Math.hypot(e.clientX - pressStartX, e.clientY - pressStartY) > 12) cancelLongPress();
    });
    b.addEventListener("pointerup", e => {
      cancelLongPress();
      if (longPressTriggered) { e.preventDefault(); e.stopPropagation(); }
    });
    b.addEventListener("pointercancel", cancelLongPress);
    b.addEventListener("contextmenu", e => { e.preventDefault(); e.stopPropagation(); });

    b.onclick = e => {
      if (selectMode) {
        e.preventDefault();
        e.stopPropagation();
        toggleMessageSelect(m.id);
        return;
      }
      if (e.target.closest("a, img, button")) return;
      if (b.dataset.swipeReply === "1" || longPressTriggered) {
        longPressTriggered = false;
        return;
      }
    };

    r.append(b);
    frag.append(r);

    if (
      m.senderId !== myId &&
      m.status !== "read" &&
      !m.isDeleted
    ) {
      if (!document.hidden) toMarkRead.push(m.id);
      else if (m.status !== "delivered") toMarkDelivered.push(m.id);
    }

  });

  box.replaceChildren(frag);
  firstPaintDone = true;

  if (toMarkRead.length) {
    rtMulti(Object.fromEntries(toMarkRead.map(id => [msgPath(id) + "/status", "read"]))).catch(() => {});
  }
  if (toMarkDelivered.length) {
    rtMulti(Object.fromEntries(toMarkDelivered.map(id => [msgPath(id) + "/status", "delivered"]))).catch(() => {});
  }

  if ((wasNearBottom || box.scrollTop === 0) && !suppressBottomScroll) {
    requestAnimationFrame(() => {
      box.scrollTop = box.scrollHeight;
      requestAnimationFrame(() => { box.scrollTop = box.scrollHeight; });
    });
  }
}

const seenToPurge = new Map(); // messageId -> did the partner already clear it?
let purging = false;

async function clearMessages(entries) {
  const build = list => Object.fromEntries(list.map(([id, done]) =>
    done ? [msgPath(id), null] : [msgPath(id) + "/deletedFor/" + enc(myId), true]));
  try {
    for (let i = 0; i < entries.length; i += 400) await rtMulti(build(entries.slice(i, i + 400)));
  } catch (e) {
    await Promise.allSettled(entries.map(en => rtMulti(build([en]))));
  }
}

const pendingKey = () => "pendingClear_" + myId + "_" + room;
function savePending() {
  if (!room || !seenToPurge.size) return;
  try { localStorage.setItem(pendingKey(), JSON.stringify([...seenToPurge])); } catch {}
}
function clearPending() { try { localStorage.removeItem(pendingKey()); } catch {} }

async function purgeSeen() {
  if (!room || purging || !seenToPurge.size) return;
  purging = true;
  const entries = [...seenToPurge];
  try {
    await clearMessages(entries);
    entries.forEach(([id]) => { seenToPurge.delete(id); olderMessages.delete(id); });
    clearPending();
  } catch (e) {
    console.warn("Auto-clear failed (will retry on next open):", e);
  } finally {
    purging = false;
  }
}

async function sweepSeen() {
  try {
    const raw = localStorage.getItem(pendingKey());
    if (raw) {
      const saved = JSON.parse(raw);
      if (Array.isArray(saved) && saved.length) await clearMessages(saved);
      clearPending();
    }
    const entries = [];
    const all = await rt(() => get(MSGS()));
    const junk = {};
    all.forEach(c => {
      const v = c.val() || {};
      if (v.senderId == null) { junk[msgPath(c.key)] = null; return; } // ghost node
      const df = Object.keys(v.deletedFor || {}).map(dec);
      if (df.includes(partnerId) && df.includes(myId)) entries.push([c.key, true]);
    });
    if (entries.length) await clearMessages(entries);
    if (Object.keys(junk).length) await rtMulti(junk);
  } catch (e) {
    console.warn("Sweep failed:", e);
  }
}

document.addEventListener("visibilitychange", () => {
  if (document.hidden) savePending(); // survives even if the browser kills the tab
  else {
    clearPending();                   // came back: nothing was cleared, keep everything
    if (lastLiveSnap) render(lastLiveSnap);
  }
});
window.addEventListener("pagehide", () => { savePending(); purgeSeen(); });

async function loadOlderMessages() {
  if (loadingOlder || noMoreOlder || !room || earliestLoadedTs == null) return;
  loadingOlder = true;
  const emptySnap = { docs: [], forEach: () => {} };
  render(lastLiveSnap || emptySnap); // repaint the button as "Loading…"
  try {
    const snap = toMsgSnap(await rt(() =>
      get(rquery(MSGS(), orderByChild("timestamp"), endBefore(earliestLoadedTs), limitToLast(PAGE_SIZE)))));
    snap.forEach(d => olderMessages.set(d.id, { id: d.id, ...d.data() }));
    if (snap.size < PAGE_SIZE) noMoreOlder = true;
  } catch (e) {
    console.error("Loading older messages failed", e);
    alert("Could not load older messages. Check your internet connection.");
  } finally {
    loadingOlder = false;
    const box = $("messages");
    const prevScrollHeight = box.scrollHeight;
    const prevScrollTop = box.scrollTop;
    suppressBottomScroll = true;
    render(lastLiveSnap || emptySnap);
    requestAnimationFrame(() => {
      box.scrollTop = prevScrollTop + (box.scrollHeight - prevScrollHeight);
      suppressBottomScroll = false;
    });
  }
}

function retrySend(id) {
  const m = localMessages.get(id);
  if (!m) return;
  delete m.sendError;
  const d = { ...m }; delete d.id;
  render(lastLiveSnap || { docs: [], forEach: () => {} });
  rt(() => set(ref(rtdb, msgPath(id)), clean(d))).then(() => localMessages.delete(id)).catch(() => {
    const x = localMessages.get(id);
    if (x) x.sendError = true;
    render(lastLiveSnap || { docs: [], forEach: () => {} });
  });
}

function focusReplyInput() {
  const input = $("message");
  if (!input || !replyFocusLock) return;
  input.classList.add("reply-lock");
  input.focus({ preventScroll: true });
  clearTimeout(replyFocusTimer);
  replyFocusTimer = setTimeout(() => {
    if (replyFocusLock && document.activeElement !== input) input.focus({ preventScroll: true });
  }, 60);
}

function showReplyBubble(message) {
  replyTo = message;
  $("replyText").textContent = message.text || "media";
  $("replyBox").classList.remove("hidden");
  replyFocusLock = true;
  focusReplyInput();
}

function toggleReaction(m, emoji) {
  if (!room || !myId) return;
  const current = m.reactions?.[myId];
  const value = current === emoji ? null : emoji;
  rtMulti({ [msgPath(m.id) + "/reactions/" + enc(myId)]: value }).catch(e => {
    console.error("Reaction failed", e);
  });
}

function hideReplyBubble() {
  replyFocusLock = false;
  clearTimeout(replyFocusTimer);
  replyFocusTimer = null;
  replyTo = null;
  $("replyBox").classList.add("hidden");
  $("message").classList.remove("reply-lock");
}

async function send(imgData = null) {
  const i = $("message"), text = i.value.trim();
  if ((!text && !imgData) || !uid || !room) return;

  const reply = replyTo ? { id: replyTo.id, text: replyTo.text || "media" } : null;

  i.value = "";
  if (reply) hideReplyBubble();
  requestAnimationFrame(() => i.focus({ preventScroll: true }));
  updateSendState();

  const now = Date.now();
  try {
    if (editing) {
      const editId = editing.id;
      editing = null;

      rtMulti({ [msgPath(editId) + "/text"]: text, [msgPath(editId) + "/isEdited"]: true })
        .catch(e => {
          console.error("Message edit failed", e);
          alert("Message edit failed. Check your internet connection.");
        });
      return;
    }

    const id = "msg_" + now + "_" + Math.random().toString(36).slice(2, 8);
    const d = {
      text: text || "",
      senderId: myId,
      timestamp: now,
      status: "sent",
      deletedFor: [],
      isDeleted: false
    };
    if (imgData) d.image = imgData;
    if (reply) d.replyTo = reply;

    localMessages.set(id, { id, ...d });

    requestAnimationFrame(() => {
      render(lastLiveSnap || { docs: [], forEach: () => {} });
      requestAnimationFrame(() => {
        const box = $("messages");
        box.scrollTop = box.scrollHeight;
      });
    });

    rt(() => set(ref(rtdb, msgPath(id)), clean(d))).then(() => {
      localMessages.delete(id);
      notifyRequest(d.text || (d.image ? "📷 Photo" : ""));
    }).catch(e => {
      console.error("Message send failed", e);
      const m = localMessages.get(id);
      if (m) m.sendError = true;
      render(lastLiveSnap || { docs: [], forEach: () => {} });
    });
  } catch (e) {
    fail("Message send failed", e);
  }
}

function formatLastSeen(ts) {
  const t = Number(ts);
  if (!t || !Number.isFinite(t) || t <= 0) return "Offline";

  const now = Date.now();
  const diffSec = Math.floor((now - t) / 1000);
  if (diffSec < 45) return "last seen just now";

  const d = new Date(t);
  const timeStr = d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit", hour12: true });
  const today = new Date().toDateString();
  const yesterday = new Date(now - 86400000).toDateString();

  if (d.toDateString() === today) return "last seen today at " + timeStr;
  if (d.toDateString() === yesterday) return "last seen yesterday at " + timeStr;

  const sameYear = d.getFullYear() === new Date().getFullYear();
  const dateStr = d.toLocaleDateString("en-US", sameYear
    ? { day: "numeric", month: "short" }
    : { day: "numeric", month: "short", year: "numeric" });
  return "last seen on " + dateStr + " at " + timeStr;
}

let lastPartnerPresence = null;
let lastSeenRefreshTimer = null;
function renderPresence() {
  const d = lastPartnerPresence;
  const isOnline = !!(d && d.online);
  const isTyping = isOnline && !!d.typing;
  $("statusText").textContent = isTyping ? "typing…" : isOnline ? "Online" : formatLastSeen(d && d.lastSeen);
  $("statusDot").className = isTyping ? "typing" : isOnline ? "online" : "";
  fitStatus();
}

function fitStatus() {
  const el = $("statusText");
  if (!el || !el.textContent) return;
  const full = el.textContent;
  if (el.scrollWidth <= el.clientWidth + 1) return;
  const short = full.replace(/^last seen on /, "").replace(/^last seen /, "seen ").replace(" at ", " ");
  el.textContent = short;
  el.title = full;
}
window.addEventListener("resize", () => { try { renderPresence(); } catch (e) {} });

let presenceBound = false;
function presence() {
  const me = PR(myId);
  unPresence?.(); unPresence = null;
  const goOnline = () => update(me, { online: true, lastSeen: serverTimestamp() }).catch(console.warn);
  const goOffline = () => update(me, { online: false, typing: false, lastSeen: serverTimestamp() }).catch(() => {});

  presenceReady.then(() => {
    if (!presenceBound) onValue(ref(rtdb, ".info/connected"), snap => {
      if (snap.val() !== true) return;
      onDisconnect(me).update({ online: false, typing: false, lastSeen: serverTimestamp() })
        .then(goOnline).catch(console.warn);
    });
    unPresence = onValue(PR(partnerId), s => {
      lastPartnerPresence = s.val() || null;
      renderPresence();
    }, e => console.warn("Presence listen failed", e));
  });

  if (!presenceBound) {
    presenceBound = true;
    document.addEventListener("visibilitychange", () => {
      if (myId && !document.hidden) presenceReady.then(goOnline);
    });
    window.addEventListener("pageshow", () => { if (myId) presenceReady.then(goOnline); });
    window.addEventListener("pagehide", () => {
      if (!myId) return;
      typingIsOn = false;
      goOffline();
    });
  }

  clearInterval(lastSeenRefreshTimer);
  lastSeenRefreshTimer = setInterval(renderPresence, 5000);
}

let typingClearTimer = null;
let typingIsOn = false;
function setTyping(isTyping) {
  if (isTyping === typingIsOn) return; // only write when the state actually changes
  typingIsOn = isTyping;
  writePresence({ typing: isTyping }).catch(() => {});
}
function updateSendState() {
  $("send").disabled = !$("message").value.trim() && !editing;
}
$("message").addEventListener("input", () => {
  updateSendState();
  if (!uid || !room) return;
  setTyping(true);
  clearTimeout(typingClearTimer);
  typingClearTimer = setTimeout(() => setTyping(false), 1800);
});
updateSendState();

function setup() {
  myId = $("myId").value.trim().toLowerCase();
  partnerId = $("partnerId").value.trim().toLowerCase();
  if (!valid(myId) || !valid(partnerId) || myId === partnerId) return alert("Valid, different IDs enter karein.");
  localStorage.setItem("whatsapp_my_id", myId);
  room = [myId, partnerId].sort().join("_");
  $("partnerName").textContent = cap(partnerId);
  login.classList.add("hidden");
  chat.classList.remove("hidden");

  const cachedDp = localStorage.getItem("chat-dp-" + myId);
  const showDp = src => {
    $("partnerDp").src = src;
    $("partnerDp").classList.remove("hidden");
    $("dpPlaceholder").classList.add("hidden");
  };
  showDp(cachedDp || DEFAULT_DP);
  presenceReady.then(() => getDoc(P(myId))).then(snap => {
    const dp = snap.data()?.dp;
    if (dp && dp !== cachedDp) {
      showDp(dp);
      localStorage.setItem("chat-dp-" + myId, dp);
    }
  }).catch(() => {});

  rt(() => {
    unChat?.();
    unChat = onValue(
      rquery(MSGS(), orderByChild("timestamp"), limitToLast(PAGE_SIZE)),
      s => {
        const snap = toMsgSnap(s);

function playNotifySound() {

    notifyAudioCtx = notifyAudioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (notifyAudioCtx.state === "suspended") notifyAudioCtx.resume().catch(() => {});
    const t0 = notifyAudioCtx.currentTime;

      osc.type = "sine";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, t0 + i * 0.09);
      gain.gain.linearRampToValueAtTime(0.14, t0 + i * 0.09 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, t0 + i * 0.09 + 0.24);
      osc.connect(gain).connect(notifyAudioCtx.destination);
      osc.start(t0 + i * 0.09);
      osc.stop(t0 + i * 0.09 + 0.26);
    });
  } catch (e) { /* audio not available; ignore silently */ }

let ringCtx = null;
let ringTimer = null;
function playRingChime(kind) {
  try {
    ringCtx = ringCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (ringCtx.state === "suspended") ringCtx.resume().catch(() => {});
    const t0 = ringCtx.currentTime;
    const freqs = kind === "back" ? [440, 494] : [523.25, 659.25];
    freqs.forEach((freq, i) => {
      const osc = ringCtx.createOscillator();
      const gain = ringCtx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      const start = t0 + i * 0.25;
      const peak = kind === "back" ? 0.10 : 0.16;
      gain.gain.setValueAtTime(0, start);
      gain.gain.linearRampToValueAtTime(peak, start + 0.05);
      gain.gain.setValueAtTime(peak, start + 0.4);
      gain.gain.linearRampToValueAtTime(0, start + 0.5);
      osc.connect(gain).connect(ringCtx.destination);
      osc.start(start);
      osc.stop(start + 0.55);
    });
    if (kind === "in" && navigator.vibrate) { try { navigator.vibrate([450, 250]); } catch {} }
  } catch (e) { /* audio not available; ignore silently */ }
}
function startRing(kind) {
  stopRing();
  playRingChime(kind);
  ringTimer = setInterval(() => playRingChime(kind), kind === "back" ? 2600 : 2000);

function formatCallDuration(ms) {
  const total = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(total / 3600);
  const m = Math.floor((total % 3600) / 60);
  const sec = total % 60;
  return h > 0
    ? String(h).padStart(2,"0") + ":" + String(m).padStart(2,"0") + ":" + String(sec).padStart(2,"0")
    : String(m).padStart(2,"0") + ":" + String(sec).padStart(2,"0");
}

function peer(caller, opts = {}) {
  const cfg = opts.relayOnly ? { ...rtc, iceTransportPolicy: "relay" } : rtc;
  pc = new RTCPeerConnection(cfg);
  amCaller = !!caller;

  if (stream) {
    stream.getTracks().forEach(t => pc.addTrack(t, stream));
  }

  const videoSender = pc.getSenders().find(s => s.track?.kind === "video");
  if (videoSender) {
    const params = videoSender.getParameters();
    params.degradationPreference = "balanced";
    if (!params.encodings || !params.encodings.length) params.encodings = [{}];
    const conn = navigator.connection || navigator.webkitConnection || navigator.mozConnection;
    const slow = !!conn && ["slow-2g", "2g", "3g"].includes(conn.effectiveType || "");
    params.encodings[0].maxBitrate = slow ? 300000 : opts.relayOnly ? 900000 : 1500000;
    videoSender.setParameters(params).catch(() => {});
  }

  const audioSender = pc.getSenders().find(s => s.track?.kind === "audio");
  if (audioSender) {
    const aparams = audioSender.getParameters();
    if (!aparams.encodings || !aparams.encodings.length) aparams.encodings = [{}];
    aparams.encodings[0].priority = "high";
    aparams.encodings[0].networkPriority = "high";
    audioSender.setParameters(aparams).catch(() => {});
  }

  let remoteStream = null;

  pc.ontrack = async e => {
    if (!remoteStream) remoteStream = e.streams?.[0] || new MediaStream();

    if (!e.streams?.[0]) {
      const exists = remoteStream.getTracks().some(t => t.id === e.track.id);
      if (!exists) remoteStream.addTrack(e.track);
    }

    $("remote").srcObject = remoteStream;
    $("remote").muted = false;
    $("remote").volume = 1;
    $("callState").textContent = "Connected";
    if (!callConnectedAt) startCallTimer(Date.now());

    try {
      await $("remote").play();
    } catch (err) {
      console.warn("Remote media autoplay was blocked:", err);
      $("callState").textContent = "Tap Speaker to enable audio";
    }
  };

  pc.onicecandidate = e => {
    if (!e.candidate || !callId) return;
    const owner = myId;
    addDoc(
      collection(db, "artifacts", A, "public", "data", "call_candidates", callId, owner),
      e.candidate.toJSON()
    ).catch(console.warn);
  };

  pc.onconnectionstatechange = () => {
    const state = pc?.connectionState;
    if (state === "connected") {
      $("callState").textContent = "Connected";
      stopRing();
      clearTimeout(iceFailTimer);
      iceFailTimer = null;
      $("callAvatarWrap").classList.add("connected");
      if (!callConnectedAt) {
        startCallTimer(Date.now());
        setDoc(D("call_state", callId), { connectedAt: callConnectedAt }, { merge: true }).catch(console.warn);
      }
    } else if (state === "connecting") $("callState").textContent = "Connecting…";
    else if (state === "disconnected") $("callState").textContent = "Reconnecting…";
    else if (state === "failed") $("callState").textContent = "Reconnecting…";
    else if (state === "closed") $("callState").textContent = "Call ended";
  };

  pc.oniceconnectionstatechange = async () => {
    const state = pc?.iceConnectionState;
    console.log("ICE state:", state);
    if (state === "checking") $("callState").textContent = "Connecting…";
    else if (state === "connected" || state === "completed") {
      $("callState").textContent = "Connected";
      stopRing();
      clearTimeout(iceFailTimer);
      iceFailTimer = null;
      $("callAvatarWrap").classList.add("connected");
      await playRemoteAudio();
    } else if (state === "disconnected") {
      $("callState").textContent = "Reconnecting…";
      clearTimeout(iceFailTimer);
      iceFailTimer = setTimeout(() => {
        if (pc && pc.iceConnectionState !== "connected" && pc.iceConnectionState !== "completed") {
          attemptIceRestart();
        }
      }, 3000);
    } else if (state === "failed") {
      $("callState").textContent = "Reconnecting…";
      attemptIceRestart();
      clearTimeout(iceFailTimer);
      iceFailTimer = setTimeout(() => {
        if (!pc || pc.iceConnectionState === "connected" || pc.iceConnectionState === "completed" || callEnded) return;
        if (amCaller && !hardReconnectDone) {
          attemptHardReconnect();
          clearTimeout(iceFailTimer);
          iceFailTimer = setTimeout(() => {
            if (pc && pc.iceConnectionState !== "connected" && pc.iceConnectionState !== "completed" && !callEnded) {
              $("callState").textContent = "Call failed — check your connection";
              finishCall("failed");
            }
          }, 10000);
        } else if (amCaller) {
          $("callState").textContent = "Call failed — check your connection";
          finishCall("failed");
        }
      }, 8000);
    }
  };

  return pc;
}

async function addQueuedCandidates() {
  if (!pc?.remoteDescription) return;
  for (const c of queued.splice(0)) {
    try { await pc.addIceCandidate(c); } catch (e) { console.warn("ICE add failed", e); }
  }
}

function watch(owner) {
  unCandidates?.();
  unCandidates = onSnapshot(
    collection(db, "artifacts", A, "public", "data", "call_candidates", callId, owner),
    async s => {
      for (const x of s.docChanges()) {
        if (x.type !== "added" || !pc) continue;
        try {
          const c = new RTCIceCandidate(x.doc.data());
          if (pc.remoteDescription) await pc.addIceCandidate(c);
          else queued.push(c);
        } catch (e) {
          console.warn("Invalid ICE candidate:", e);
        }
      }
    },
    e => console.warn("ICE signaling error:", e)
  );
}

async function mediaStream(video) {
  if (!window.isSecureContext) {
    showCallError("Calls require HTTPS. Open this site over HTTPS.");
    return null;
  }

  if (!window.RTCPeerConnection) {
    showCallError("WebRTC is not available in this browser/WebView.");
    return null;
  }

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showCallError(
      "This browser/WebView does not allow microphone/camera access. " +
      "Please allow microphone/camera permission for this browser or app, then try again."
    );
    return null;
  }

  const audio = {
    echoCancellation: true,
    noiseSuppression: true,
    autoGainControl: true,
    channelCount: 1,
    sampleRate: { ideal: 48000 },
    sampleSize: { ideal: 16 }
  };

  const videoConstraints = {
    facingMode: { ideal: "user" },
    width: { ideal: 1280, max: 1920 },
    height: { ideal: 720, max: 1080 },
    frameRate: { ideal: 30, max: 30 }
  };

  try {
    return await navigator.mediaDevices.getUserMedia({
      audio,
      video: video ? videoConstraints : false
    });
  } catch (e) {
    console.error("getUserMedia failed:", e);

    if (!video && (e?.name === "OverconstrainedError" || e?.name === "NotReadableError")) {
      try {
        return await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      } catch (e2) {
        e = e2;
      }
    }

    const name = e?.name || "";
    const msg =
      name === "NotAllowedError" || name === "PermissionDeniedError"
        ? "Microphone/Camera permission is blocked. Allow microphone/camera permission for this site in browser/app settings."
        : name === "NotFoundError"
        ? "No microphone/camera was found on this device."
        : name === "NotReadableError"
        ? "The microphone/camera is busy or cannot be opened by this WebView."
        : name === "SecurityError"
        ? "The WebView blocked microphone/camera access for security reasons."
        : name === "AbortError"
        ? "The microphone/camera request was interrupted. Try the call again."
        : "Microphone/Camera permission failed. Please allow camera and microphone access in your browser/app settings.";

    showCallError(msg, e);
    return null;
  }
}

        await addQueuedCandidates();
      } catch (e) {
        showCallError("Could not establish the call.", e);
      }
    });

    watch(partnerId);
  } catch (e) {
    showCallError("Could not start the call.", e);
    reset();
  }
}

async function acceptCall() {
  const d = pending;
  if (!d?.offer || !d?.callId) return;

  callEnded = false;
  callStartedVideo = d.type === "video";
  stream = await mediaStream(d.type === "video");
  if (!stream) return;

  const audioTrack = stream.getAudioTracks()[0];
  if (audioTrack?.applyConstraints) {
    audioTrack.applyConstraints({
      echoCancellation: { ideal: true },
      noiseSuppression: { ideal: true },
      autoGainControl: { ideal: true }
    }).catch(() => {});
  }

  callId = d.callId;
  partnerId = d.caller;

  $("local").srcObject = stream;
  $("local").classList.toggle("hidden", d.type !== "video");
  $("remote").classList.toggle("hidden", d.type !== "video");
  $("audioOnly").classList.toggle("hidden", d.type === "video");
  $("callName").textContent = cap(partnerId);
  $("callState").textContent = "Connecting…";
  stopCallTimer();
  $("speaker").querySelector(".callctrl-label").textContent = "Speaker On";
  speakerOn = true;
  setCallAvatar($("callAvatarImg"), $("callAvatarInitial"), partnerId);
  $("callAvatarWrap").classList.remove("connected");
  call.classList.remove("swapped");
  stopRing();

  incoming.classList.add("hidden");
  chat.classList.add("hidden");
  call.classList.remove("hidden");

  try {
    peer(false);

    await pc.setRemoteDescription(d.offer);
    await addQueuedCandidates();

    const answer = await pc.createAnswer({
      offerToReceiveAudio: true,
      offerToReceiveVideo: d.type === "video"
    });
    await pc.setLocalDescription(answer);

    await setDoc(
      D("call_answers", callId),
      { answer: { type: answer.type, sdp: answer.sdp } }
    );

    await setDoc(D("call_state", callId), { status: "answering" }, { merge: true });
    watchCallState();

    watch(d.caller);

    await deleteDoc(D("active_calls", myId)).catch(() => {});
    pending = null;
  } catch (e) {
    showCallError("Could not accept the call.", e);
    reset();
  }
}

let callWakeLock = null;

async function acquireCallWakeLock() {
  try {
    if ("wakeLock" in navigator && !callWakeLock) {
      callWakeLock = await navigator.wakeLock.request("screen");
      callWakeLock.addEventListener("release", () => { callWakeLock = null; });
    }
  } catch (e) {
    console.warn("Wake Lock unavailable:", e);
  }
}

async function releaseCallWakeLock() {
  try { await callWakeLock?.release(); } catch {}
  callWakeLock = null;
}

async function enableBackgroundCallMode() {
  if (!callId) return;

  stream?.getAudioTracks().forEach(t => { t.enabled = true; });
  if (callStartedVideo) {
    stream?.getVideoTracks().forEach(t => { t.enabled = true; });
  }

  await acquireCallWakeLock();

  if (document.hidden && "Notification" in window && Notification.permission === "granted") {
    try {
      new Notification("Call in progress", {
        body: "Your call is still active. Return to the app to control it.",
        tag: "secure-cloud-active-call",
        renotify: false
      });
    } catch {}
  }
}

function installBackgroundCallHandling() {
  document.addEventListener("visibilitychange", async () => {
    if (!callId || callEnded) return;

    if (document.hidden) {
      await enableBackgroundCallMode();
    } else {
      await acquireCallWakeLock();
      try { await $("remote").play(); } catch {}
    }
  });

  window.addEventListener("pagehide", () => {
  });

  window.addEventListener("beforeunload", e => {
    if (callId && !callEnded) {
      e.preventDefault();
      e.returnValue = "";
    }
  });
}

function notifyRequest(preview) {
  const now = Date.now();

  reqSentAt.set(room, now);
  setDoc(D("chat_requests", reqKey(myId, partnerId)), {

function listenRequests() {
  unRequests?.();
  reqReady = false;
  requests = new Map();
  renderRequests();
  unRequests = onSnapshot(query(C("chat_requests"), where("to", "==", myId)), snap => {
    const next = new Map();
    snap.forEach(d => {
      const v = d.data();
      if (!v || !v.from || v.from === myId) return;
      if (v.from === partnerId) { deleteDoc(d.ref).catch(() => {}); return; } // already chatting with them
      next.set(v.from, v);
    });
    if (reqReady) {
      next.forEach((v, k) => {
        const old = requests.get(k);
        if (!old || Number(v.timestamp) > Number(old.timestamp)) showReqToast(k);
      });
    }
    requests = next;
    reqReady = true;
    renderRequests();
  }, e => console.warn("Requests listener failed", e));
}

function timeAgo(ts) {
  const m = Math.floor((Date.now() - Number(ts || 0)) / 60000);
  if (m < 1) return "just now";
  if (m < 60) return m + " min ago";
  if (m < 1440) return Math.floor(m / 60) + " h ago";
  return Math.floor(m / 1440) + " d ago";
}

function resizeImageDataUrl(dataUrl, maxDim = 256) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      let { width, height } = img;
      if (width > maxDim || height > maxDim) {
        if (width > height) { height = Math.round(height * maxDim / width); width = maxDim; }
        else { width = Math.round(width * maxDim / height); height = maxDim; }
      }
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      canvas.getContext("2d").drawImage(img, 0, 0, width, height);
      resolve(canvas.toDataURL("image/jpeg", 0.82));
    };
    img.onerror = reject;
    img.src = dataUrl;
  });
}

function hexToRgb(hex) {
  hex = (hex || "#efeae2").replace("#", "");
  if (hex.length === 3) hex = hex.split("").map(c => c + c).join("");
  const num = parseInt(hex, 16) || 0;
  return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
}
function shade(hex, percent) {
  const { r, g, b } = hexToRgb(hex);
  const t = percent < 0 ? 0 : 255;
  const p = Math.abs(percent);
  const mix = (c) => Math.round((t - c) * p) + c;
  return `rgb(${mix(r)},${mix(g)},${mix(b)})`;
}
function isLightColor(hex) {
  const { r, g, b } = hexToRgb(hex);
  return (0.299 * r + 0.587 * g + 0.114 * b) > 170;
}

function applyTheme(name, customColor = null) {
  const themes = {
    default: "#efeae2",
    blue: "#dbeafe",
    green: "#dcfce7",
    pink: "#fce7f3",
    purple: "#f3e8ff",
    dark: "#1f2937"
  };
  const bg = customColor || themes[name] || themes.default;
  $("chat").style.background = bg;
  $("chat").dataset.theme = name || "custom";
  $("messages").style.color = name === "dark" ? "#fff" : "";

  let bt = BUBBLE_THEMES[name];
  if (!bt) {
    const base = customColor || themes.default;
    const light = isLightColor(base);
    bt = {
      sentFrom: shade(base, -0.32),
      sentTo: shade(base, -0.05),
      sentColor: "#ffffff",
      tick: shade(base, 0.6),
      recvBg: light ? "#ffffff" : "#f9fafb",
      recvColor: "#1f2937",
      recvBorder: "rgba(15,23,42,.08)"
    };
  }
  const root = document.documentElement.style;
  root.setProperty("--bubble-sent-bg", `linear-gradient(135deg,${bt.sentFrom},${bt.sentTo})`);
  root.setProperty("--accent", bt.sentFrom);
  let tc = document.querySelector('meta[name="theme-color"]');
  if (!tc) { tc = document.createElement("meta"); tc.name = "theme-color"; document.head.appendChild(tc); }
  tc.content = bt.sentFrom; // phone status bar follows the theme
  root.setProperty("--bubble-sent-color", bt.sentColor);
  root.setProperty("--bubble-tick-read", bt.tick);
  root.setProperty("--bubble-received-bg", bt.recvBg);
  root.setProperty("--bubble-received-color", bt.recvColor);
  root.setProperty("--bubble-received-border", bt.recvBorder);

  let ht = HEADER_THEMES[name];
  if (!ht) {
    const base = customColor || themes.default;
    ht = {
      from: shade(base, -0.62), mid: shade(base, -0.42), to: shade(base, -0.50),
      selFrom: shade(base, -0.75), selMid: shade(base, -0.42), selTo: shade(base, -0.65)
    };
  }
  root.setProperty("--header-from", ht.from);
  root.setProperty("--header-mid", ht.mid);
  root.setProperty("--header-to", ht.to);
  root.setProperty("--select-from", ht.selFrom);
  root.setProperty("--select-mid", ht.selMid);
  root.setProperty("--select-to", ht.selTo);

  let st = STATUS_THEMES[name];
  if (!st) {
    const base = customColor || themes.default;
    const dot = shade(base, 0.35);
    st = { dot, glow: dot.startsWith("rgb") ? dot.replace("rgb(", "rgba(").replace(")", ",.55)") : "rgba(74,222,128,.55)" };
  }
  root.setProperty("--status-online", st.dot);
  root.setProperty("--status-online-glow", st.glow);

  localStorage.setItem("chat-theme", JSON.stringify({ name: name || "custom", color: bg }));
  localStorage.removeItem("chat-bg");
}

document.querySelectorAll("[data-bg]").forEach(b => b.onclick = () => { chat.style.background = b.dataset.bg; localStorage.setItem("chat-bg", b.dataset.bg); $("colors").classList.add("hidden"); });
if (localStorage.getItem("chat-bg")) chat.style.background = localStorage.getItem("chat-bg");

$("clearChat").onclick = async () => {
  if (!confirm("Kya aap sach me chat permanent delete karna chahte hain? Yeh data Firebase se dono ke liye hamesha ke liye delete kar dega.")) return;
  try {
    $("menu").classList.add("hidden");

    await rt(() => set(MSGS(), null));

    localMessages.clear();
    localHiddenMessages.clear();
    olderMessages.clear();
    noMoreOlder = true;
    earliestLoadedTs = null;
    localStorage.removeItem("hiddenMessages");
    $("messages").innerHTML = "";
    
  } catch (e) { fail("Clear chat failed", e); }
};

$("closeMedia").onclick = () => {
  $("previewVideo").pause();
  $("previewAudio").pause();
  $("previewImg").classList.remove("hidden");
  $("previewVideo").classList.add("hidden");
  $("previewAudio").classList.add("hidden");
  $("mediaModal").classList.add("hidden");
};
$("cancelReply").onclick = () => { hideReplyBubble(); };
$("closeActions").onclick = () => $("actions").classList.add("hidden");

$("reply").onclick = () => {
  if (selected) showReplyBubble(selected);
  $("actions").classList.add("hidden");
};

$("react").onclick = () => {
  $("actions").classList.add("hidden");
  if (selected) $("reactionPicker").classList.remove("hidden");
};
$("reactionPicker").onclick = e => {
  if (e.target === e.currentTarget) $("reactionPicker").classList.add("hidden");
};
document.querySelectorAll(".react-emoji").forEach(btn => {
  btn.onclick = () => {
    if (selected) toggleReaction(selected, btn.dataset.emoji);
    $("reactionPicker").classList.add("hidden");
  };
});

$("copy").onclick = async () => {
  if (!selected) return;

  const text = selected.text || "";
  if (!text) {
    $("actions").classList.add("hidden");
    return;
  }

  try {
    await navigator.clipboard.writeText(text);
  } catch (e) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try { document.execCommand("copy"); } catch (_) {}
    ta.remove();
  }

  $("actions").classList.add("hidden");
};

$("selectMsg").onclick = () => {
  $("actions").classList.add("hidden");
  if (selected) enterSelectMode(selected.id);
};

$("selectCancel").onclick = () => exitSelectMode();

$("selectAll").onclick = () => {
  document.querySelectorAll("#messages [data-mid]").forEach(el => selectedIds.add(el.dataset.mid));
  updateSelectBar();
  rerenderMessages();
};

$("selectDeleteMe").onclick = async () => {
  if (!selectedIds.size) return;
  const ids = [...selectedIds];
  if (!confirm(`Delete ${ids.length} selected message(s) for you? This only removes them from your side.`)) return;
  try {
    await markDeletedFor(ids);
  } catch (e) {
    fail("Delete selected failed", e);
  }
  exitSelectMode();
};

$("edit").onclick = () => { 
  editing = selected; 
  $("message").value = selected.text || ""; 
  $("message").focus(); 
  $("actions").classList.add("hidden"); 
  updateSendState();
};

$("deleteMe").onclick = async () => { if (selected) await markDeletedFor([selected.id]); $("actions").classList.add("hidden"); };
$("send").addEventListener("click", () => navigator.vibrate?.(8)); // subtle haptic
$("deleteAll").onclick = async () => { if (selected) await rtMulti({ [msgPath(selected.id) + "/isDeleted"]: true, [msgPath(selected.id) + "/text"]: "", [msgPath(selected.id) + "/image"]: "", [msgPath(selected.id) + "/replyTo"]: null }); $("actions").classList.add("hidden"); };

const ua = navigator.userAgent || "";
const inAppBrowser =
  /; wv\)/i.test(ua) ||
  (/Android/i.test(ua) && /Version\/\d+\.\d+/i.test(ua) && /Chrome/i.test(ua));

if (inAppBrowser) {
  console.info("In-app/WebView detected. WebRTC depends on host permission support.");
}

if (!window.isSecureContext) {
  $("loginStatus").textContent = "⚠️ HTTPS is required for calls";
}
if (!window.RTCPeerConnection) {
  console.warn("WebRTC RTCPeerConnection is not available in this browser.");
}
if (!navigator.mediaDevices?.getUserMedia) {
  console.warn("getUserMedia is not available in this browser/WebView.");
}

const timer = setTimeout(() => { if (!uid) { $("loginStatus").textContent = "Firebase timeout — check Anonymous Auth"; } }, 12000);

function syncAppToVisualViewport() {
  const vv = window.visualViewport;
  const appEl = document.getElementById("app");
  if (!vv) {
    document.documentElement.style.setProperty("--app-height", `${window.innerHeight}px`);
    if (appEl) appEl.style.top = "0px";
    return;
  }

  document.documentElement.style.setProperty("--app-height", `${vv.height}px`);

  if (appEl) appEl.style.top = `${vv.offsetTop}px`;

  if (document.activeElement === $("message")) {
    requestAnimationFrame(() => {
      $("message").scrollIntoView({ block: "nearest", inline: "nearest" });
    });
  }
}

syncAppToVisualViewport();
window.addEventListener("resize", syncAppToVisualViewport, { passive: true });
window.visualViewport?.addEventListener("resize", syncAppToVisualViewport, { passive: true });
window.visualViewport?.addEventListener("scroll", syncAppToVisualViewport, { passive: true });

signInAnonymously(auth).catch(e => fail("Firebase auth failed", e));
onAuthStateChanged(auth, u => {
  uid = u?.uid || null;
  if (uid) {
    clearTimeout(timer);
    $("connect").classList.remove("is-loading");
    $("connect").textContent = "Let's Go...!🤞";
    $("loginStatus").textContent = "Connected";
  }
});

</script>

      svg('<path d="M20 3C32 12 32 30 20 37 8 30 8 12 20 3Z" fill="#f9a8d4"/><path d="M20 8v24" stroke="#f472b6" stroke-width="1.2"/>'),
      svg('<path d="M20 3C32 12 32 30 20 37 8 30 8 12 20 3Z" fill="#fb923c"/><path d="M20 8v24" stroke="#ea580c" stroke-width="1.2"/>')
    ];
    if(box){
      const N=document.documentElement.classList.contains("lite")?16:(matchMedia("(max-width:480px)").matches?22:30);
      for(let i=0;i<N;i++){

      }
    }
    const mid=document.getElementById("myId"),pid=document.getElementById("partnerId"),btn=document.getElementById("connect");
    btn.addEventListener("click",()=>{const v=pid.value.trim().toLowerCase();});
    mid.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();pid.focus()}});
    pid.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();if(!btn.disabled&&!btn.classList.contains("is-loading"))btn.click()}});
    const st=document.getElementById("loginStatus");
    new MutationObserver(()=>st.classList.toggle("ok",st.textContent.trim()==="Connected")).observe(st,{childList:true,characterData:true,subtree:true});
  }catch(e){}
})();
</script>
