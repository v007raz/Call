<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Secure Cloud</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        wa: {
                            teal: '#075E54', lightTeal: '#128C7E', green: '#25D366',
                            bg: '#ECE5DD', chatBg: '#efeae2', sent: '#dcf8c6', rcvd: '#ffffff'
                        }
                    }
                }
            }
        }
    </script>
    
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        body, html {
            font-family: 'Inter', sans-serif; margin: 0; padding: 0; position: fixed; 
            top: 0; left: 0; right: 0; bottom: 0; height: 100%; width: 100vw; overflow: hidden;
            background-color: #f3f4f6; overscroll-behavior-y: none;
        }
        #app-container {
            height: 100%; width: 100%; max-width: 450px; margin: 0 auto;
            position: relative; display: flex; flex-direction: column;
            background-color: white; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
        #chat-messages::-webkit-scrollbar { width: 5px; }
        #chat-messages::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 10px; }
        
        .bubble-tail-sent::before {
            content: ''; position: absolute; top: 0; right: -8px; width: 20px; height: 20px;
            background: linear-gradient(135deg, #dcf8c6 0%, #dcf8c6 50%, transparent 50%, transparent);
        }
        .bubble-tail-rcvd::before {
            content: ''; position: absolute; top: 0; left: -8px; width: 20px; height: 20px;
            background: linear-gradient(-135deg, #ffffff 0%, #ffffff 50%, transparent 50%, transparent);
        }
        .bubble-deleted::before { display: none !important; }
        .swipe-transition { transition: transform 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94); }
    </style>
</head>
<body class="flex items-center justify-center">

    <div id="app-container">
        <!-- Login Screen -->
        <div id="login-screen" class="absolute inset-0 bg-white z-20 flex flex-col items-center justify-center p-6 transition-transform duration-300">
            <div class="text-center mb-8">
                <div class="w-20 h-20 bg-wa-green rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg">
                    <i class="ph-fill ph-whatsapp-logo text-5xl text-white"></i>
                </div>
                <h1 class="text-2xl font-bold text-gray-800">Our Personal Cloud</h1>
            </div>
            <div class="w-full space-y-4">
                <input type="text" id="my-id-input" class="w-full bg-gray-50 border border-gray-300 rounded-lg p-3 focus:outline-none focus:border-wa-lightTeal" placeholder="Your ID (e.g. Doraemon)" autocomplete="off">
                <input type="text" id="partner-id-input" class="w-full bg-gray-50 border border-gray-300 rounded-lg p-3 focus:outline-none focus:border-wa-lightTeal" placeholder="Partner's ID (e.g. Nobita)" autocomplete="off">
                <button id="connect-btn" class="w-full bg-wa-lightTeal hover:bg-wa-teal text-white font-bold py-3.5 rounded-lg flex items-center justify-center gap-2 mt-4 shadow-md">
                    Start Secure Chat <i class="ph-bold ph-arrow-right"></i>
                </button>
            </div>
            <div id="login-status" class="text-sm mt-6 text-center font-bold h-6 text-gray-500">Connecting to Cloud...</div>
        </div>

        <!-- Chat Screen -->
        <div id="chat-screen" class="hidden absolute inset-0 bg-wa-chatBg flex flex-col z-10 bg-cover bg-center" style="background-color: #efeae2;">
            
            <div class="bg-wa-lightTeal text-white px-3 py-2 flex items-center justify-between shadow-md z-20 shrink-0">
                <div class="flex items-center gap-2">
                    <button id="btn-back" class="p-1 hover:bg-white/20 rounded-full"><i class="ph-bold ph-arrow-left text-xl"></i></button>
                    <div class="w-10 h-10 bg-gray-300 rounded-full flex items-center justify-center overflow-hidden"><i class="ph-fill ph-user text-2xl text-gray-500"></i></div>
                    <div class="ml-1 flex flex-col justify-center">
                        <h2 id="chat-partner-name" class="font-semibold text-[17px] leading-tight">Partner</h2>
                        <p id="chat-status" class="text-[11px] text-wa-bg opacity-90">Offline</p>
                    </div>
                </div>
                <div class="flex items-center gap-1">
                    <button id="btn-video-call" class="hover:bg-white/20 p-2 rounded-full"><i class="ph-fill ph-video-camera text-xl"></i></button>
                    <button id="btn-audio-call" class="hover:bg-white/20 p-2 rounded-full"><i class="ph-fill ph-phone text-xl"></i></button>
                    <button id="btn-chat-menu" class="hover:bg-white/20 p-2 rounded-full relative"><i class="ph-fill ph-dots-three-vertical text-xl"></i></button>
                    
                    <div id="chat-dropdown" class="hidden absolute top-14 right-2 bg-white text-gray-800 shadow-xl rounded-lg w-52 overflow-hidden z-50 origin-top-right border border-gray-100">
                        <button id="btn-change-theme" class="w-full text-left px-4 py-3 hover:bg-gray-100 text-[15px] flex items-center gap-3 border-b border-gray-100"><i class="ph ph-palette text-lg text-gray-600"></i> Change Background</button>
                        <button id="btn-clear-chat" class="w-full text-left px-4 py-3 hover:bg-gray-100 text-[15px] flex items-center gap-3 text-red-600"><i class="ph ph-broom text-lg"></i> Clear Chat</button>
                    </div>
                </div>
            </div>

            <div id="chat-messages" class="flex-1 overflow-y-auto p-3 flex flex-col gap-2 relative z-0 pb-4">
                <div class="flex justify-center mb-4 mt-2">
                    <div class="bg-[#FFEECD] text-gray-700 text-[11px] px-4 py-1.5 rounded-lg text-center shadow-sm">
                        <i class="ph-fill ph-lock-key inline align-middle mr-1"></i> End-to-End Encrypted & Secure.
                    </div>
                </div>
            </div>

            <!-- Reply Box -->
            <div id="reply-preview-box" class="hidden shrink-0 bg-white/90 backdrop-blur border-t border-gray-200 px-3 py-2 flex items-center gap-3 relative z-10 w-full rounded-t-xl mb-[-10px] pb-4">
                <div class="w-1 bg-wa-teal h-full absolute left-0 top-0 rounded-tl-xl"></div>
                <div class="flex-1 overflow-hidden ml-2">
                    <p id="reply-preview-sender" class="text-[13px] font-bold text-wa-teal"></p>
                    <p id="reply-preview-text" class="text-[12px] text-gray-500 truncate"></p>
                </div>
                <button id="btn-cancel-reply" class="p-2 text-gray-500 hover:text-gray-700"><i class="ph-bold ph-x text-lg"></i></button>
            </div>

            <!-- Input Area -->
            <div id="input-container" class="shrink-0 bg-[#f0f2f5] px-2 py-2 flex items-end gap-2 z-20 w-full">
                <div class="flex-1 bg-white rounded-2xl flex items-end shadow-sm border border-gray-200 relative overflow-hidden">
                    <button class="p-3 text-gray-500"><i class="ph ph-smiley text-xl text-gray-400"></i></button>
                    <textarea id="msg-input" rows="1" class="flex-1 bg-transparent py-3 focus:outline-none resize-none max-h-28 text-[15px] text-gray-800" placeholder="Message"></textarea>
                    <label for="media-input" class="p-3 text-gray-500 hover:text-gray-700 cursor-pointer flex items-center m-0">
                        <i class="ph ph-paperclip text-xl text-gray-400"></i>
                        <input type="file" id="media-input" style="display: none;" accept="image/*,video/*,audio/*,application/pdf">
                    </label>
                </div>
                <button id="send-btn" class="w-12 h-12 rounded-full bg-wa-lightTeal hover:bg-wa-teal text-white flex items-center justify-center shrink-0 shadow-sm disabled:opacity-50">
                    <i class="ph-fill ph-paper-plane-right text-xl ml-1" id="send-icon"></i>
                </button>
            </div>
            
            <div id="upload-progress-bar" class="hidden absolute top-[60px] left-0 w-full bg-wa-teal text-white text-xs font-semibold text-center py-1.5 z-30 shadow-md">
                Optimizing & Sending... <span id="upload-percent">0%</span>
            </div>
        </div>

        <!-- Theme Picker Modal -->
        <div id="theme-modal" class="hidden absolute inset-0 bg-black/40 z-[70] flex items-center justify-center p-4 backdrop-blur-sm">
            <div class="bg-white rounded-2xl w-full max-w-[320px] p-5 shadow-2xl">
                <h3 class="text-lg font-bold text-gray-800 mb-3">Choose Chat Background</h3>
                <div class="grid grid-cols-2 gap-3 mb-4">
                    <button onclick="setTheme('#efeae2')" class="p-3 rounded-xl bg-[#efeae2] border border-gray-300 font-medium text-xs text-gray-700">Default WhatsApp</button>
                    <button onclick="setTheme('#111b21')" class="p-3 rounded-xl bg-[#111b21] border border-gray-700 font-medium text-xs text-white">Dark Theme</button>
                    <button onclick="setTheme('#0b141a')" class="p-3 rounded-xl bg-[#0b141a] border border-gray-700 font-medium text-xs text-white">Pitch Black</button>
                    <button onclick="setTheme('#e2f4f3')" class="p-3 rounded-xl bg-[#e2f4f3] border border-gray-300 font-medium text-xs text-teal-900">Soft Mint</button>
                    <button onclick="setTheme('#fce4ec')" class="p-3 rounded-xl bg-[#fce4ec] border border-gray-300 font-medium text-xs text-pink-900">Rose Pink</button>
                    <button onclick="setTheme('#e8eaf6')" class="p-3 rounded-xl bg-[#e8eaf6] border border-gray-300 font-medium text-xs text-indigo-900">Lavender Blue</button>
                </div>
                <button id="btn-close-theme" class="w-full py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-800 font-semibold rounded-xl">Cancel</button>
            </div>
        </div>

        <!-- Fullscreen Image Viewer Modal -->
        <div id="image-viewer-modal" class="hidden absolute inset-0 bg-black/95 z-[100] flex flex-col items-center justify-center p-2">
            <button id="close-viewer" class="absolute top-4 right-4 text-white bg-white/20 hover:bg-white/40 p-2 rounded-full z-10"><i class="ph-bold ph-x text-2xl"></i></button>
            <div class="flex-1 w-full flex items-center justify-center overflow-auto">
                <img id="viewer-img" src="" class="max-w-full max-h-full object-contain transition-transform duration-200" alt="Full Image">
            </div>
            <div class="p-4 w-full flex justify-center">
                <a id="viewer-download-btn" href="" download="whatsapp_image.jpg" class="bg-wa-lightTeal hover:bg-wa-teal text-white px-6 py-2.5 rounded-full font-semibold flex items-center gap-2 shadow-lg">
                    <i class="ph-bold ph-download-simple text-xl"></i> Download Image
                </a>
            </div>
        </div>

        <!-- Call Screen -->
        <div id="call-screen" class="hidden absolute inset-0 bg-gray-900 z-[80] flex flex-col relative">
            <video id="remote-video" autoplay playsinline class="w-full h-full object-cover"></video>
            <div id="local-video-container" class="absolute top-16 right-4 w-28 aspect-[3/4] bg-gray-800 rounded-xl overflow-hidden border-2 border-gray-700 z-30">
                <video id="local-video" autoplay playsinline muted class="w-full h-full object-cover"></video>
            </div>
            <div class="absolute top-0 left-0 w-full p-6 bg-gradient-to-b from-black/70 flex flex-col items-center z-20">
                <h3 id="call-partner-display" class="text-white text-lg font-semibold">Partner</h3>
                <p id="call-duration" class="text-gray-300 text-sm">Calling...</p>
            </div>
            <div class="absolute bottom-10 w-full flex justify-center gap-6 z-40">
                <button id="toggle-mic-btn" class="w-14 h-14 rounded-full bg-gray-700/80 text-white flex items-center justify-center"><i class="ph-fill ph-microphone text-2xl" id="mic-icon"></i></button>
                <button id="end-call-btn" class="w-16 h-16 rounded-full bg-red-500 text-white flex items-center justify-center"><i class="ph-fill ph-phone-disconnect text-3xl"></i></button>
                <button id="toggle-video-btn" class="w-14 h-14 rounded-full bg-gray-700/80 text-white flex items-center justify-center"><i class="ph-fill ph-video-camera text-2xl" id="video-icon"></i></button>
            </div>
        </div>

        <!-- Incoming Call Modal -->
        <div id="incoming-call-modal" class="hidden absolute inset-0 bg-gray-900/95 z-[90] flex flex-col items-center justify-center">
            <div class="w-24 h-24 bg-wa-lightTeal rounded-full flex items-center justify-center animate-pulse"><i class="ph-fill ph-phone-ringing text-5xl text-white"></i></div>
            <h2 class="text-white text-2xl font-bold mt-6 mb-2" id="incoming-caller-id">Caller</h2>
            <div class="flex gap-12 mt-12">
                <button id="reject-call-btn" class="w-16 h-16 rounded-full bg-red-500 flex items-center justify-center text-white"><i class="ph-fill ph-phone-disconnect text-2xl"></i></button>
                <button id="accept-call-btn" class="w-16 h-16 rounded-full bg-green-500 flex items-center justify-center text-white"><i class="ph-fill ph-phone text-2xl"></i></button>
            </div>
        </div>

        <!-- Modals -->
        <div id="msg-action-modal" class="hidden absolute inset-0 bg-black/40 z-[60] flex items-center justify-center p-4 backdrop-blur-sm">
            <div class="bg-white rounded-xl w-full max-w-[280px] flex flex-col overflow-hidden shadow-2xl">
                <div class="px-5 py-3 border-b border-gray-100 font-semibold text-gray-800 text-[15px]">Message Options</div>
                <button id="btn-reply-msg" class="px-5 py-3.5 text-left border-b border-gray-50 flex items-center gap-3 text-gray-800"><i class="ph ph-arrow-u-up-left text-xl text-gray-500"></i> Reply</button>
                <button id="btn-edit-msg" class="hidden px-5 py-3.5 text-left border-b border-gray-50 flex items-center gap-3 text-gray-800"><i class="ph ph-pencil-simple text-xl text-gray-500"></i> Edit message</button>
                <button id="btn-delete-me" class="px-5 py-3.5 text-left border-b border-gray-50 flex items-center gap-3 text-gray-800"><i class="ph ph-trash text-xl text-gray-500"></i> Delete for me</button>
                <button id="btn-delete-everyone" class="hidden px-5 py-3.5 text-left border-b border-gray-50 flex items-center gap-3 text-red-500"><i class="ph ph-trash text-xl"></i> Delete for everyone</button>
                <button id="btn-action-cancel" class="px-5 py-3.5 text-center font-medium text-gray-600 bg-gray-50">Cancel</button>
            </div>
        </div>

        <div id="confirm-modal" class="hidden absolute inset-0 bg-black/40 z-[70] flex items-center justify-center p-4 backdrop-blur-sm">
            <div class="bg-white rounded-xl w-full max-w-[300px] p-5 shadow-2xl">
                <h3 class="text-lg font-bold text-gray-800 mb-2">Clear this chat?</h3>
                <p class="text-sm text-gray-600 mb-4">All messages will be removed.</p>
                <div class="flex justify-end gap-3 mt-4">
                    <button id="btn-confirm-cancel" class="px-4 py-2 text-wa-teal font-medium rounded">Cancel</button>
                    <button id="btn-confirm-clear" class="px-4 py-2 bg-wa-teal text-white font-medium rounded">Clear Chat</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection, query, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDHUttmxneJt1KZCf3d-9lRqrdxLxx76C0",
            authDomain: "myweb-88daa.firebaseapp.com",
            projectId: "myweb-88daa",
            storageBucket: "myweb-88daa.firebasestorage.app",
            messagingSenderId: "297038746284",
            appId: "1:297038746284:web:272d0ecdc8a3cfa3a20509",
            measurementId: "G-3KPXF8W72R"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        let currentUserUid = null;
        const appId = "my-whatsapp-clone";
        
        let myId = localStorage.getItem('whatsapp_my_id') || '';
        let partnerId = ''; 
        let currentRoomId = ''; 
        let unsubscribeChat = null; 
        let localChatStore = []; 
        let replyingToObj = null;

        const ui = {
            login: document.getElementById('login-screen'), 
            chat: document.getElementById('chat-screen'),
            messages: document.getElementById('chat-messages'), 
            dropdown: document.getElementById('chat-dropdown'),
            msgModal: document.getElementById('msg-action-modal'), 
            confirmModal: document.getElementById('confirm-modal'),
            themeModal: document.getElementById('theme-modal'),
            uploadBar: document.getElementById('upload-progress-bar'), 
            uploadPercent: document.getElementById('upload-percent'),
            replyBox: document.getElementById('reply-preview-box'),
            viewerModal: document.getElementById('image-viewer-modal'), 
            viewerImg: document.getElementById('viewer-img'), 
            viewerDownload: document.getElementById('viewer-download-btn'),
            callScreen: document.getElementById('call-screen'), 
            incomingModal: document.getElementById('incoming-call-modal')
        };
        const inputs = {
            myId: document.getElementById('my-id-input'), 
            partnerId: document.getElementById('partner-id-input'),
            msg: document.getElementById('msg-input'), 
            media: document.getElementById('media-input')
        };
        const btn = {
            menu: document.getElementById('btn-chat-menu'), 
            back: document.getElementById('btn-back'),
            clear: document.getElementById('btn-clear-chat'), 
            theme: document.getElementById('btn-change-theme'), 
            closeTheme: document.getElementById('btn-close-theme'),
            send: document.getElementById('send-btn'),
            reply: document.getElementById('btn-reply-msg'),
            cancelReply: document.getElementById('btn-cancel-reply'),
            connect: document.getElementById('connect-btn'),
            videoCall: document.getElementById('btn-video-call'),
            audioCall: document.getElementById('btn-audio-call')
        };

        // Initialize Anonymous Auth
        signInAnonymously(auth).then((userCredential) => {
            currentUserUid = userCredential.user.uid;
            document.getElementById('login-status').innerText = "Cloud Ready.";
        }).catch((error) => {
            console.error("Auth error:", error);
            document.getElementById('login-status').innerText = "Connection Failed.";
        });

        if (myId) {
            inputs.myId.value = myId;
        }

        // Connect button handler
        btn.connect.addEventListener('click', () => {
            myId = inputs.myId.value.trim();
            partnerId = inputs.partnerId.value.trim();
            if (!myId || !partnerId) {
                alert("Please enter both IDs");
                return;
            }
            localStorage.setItem('whatsapp_my_id', myId);
            currentRoomId = [myId, partnerId].sort().join('_');
            
            ui.login.classList.add('hidden');
            ui.chat.classList.remove('hidden');
            document.getElementById('chat-partner-name').innerText = partnerId;
            
            startChatListeners();
        });

        // Send Message Function
        async function sendMessage() {
            const text = inputs.msg.value.trim();
            if (!text) return;

            const messageData = {
                sender: myId,
                text: text,
                timestamp: Date.now(),
                replyTo: replyingToObj ? { id: replyingToObj.id, text: replyingToObj.text, sender: replyingToObj.sender } : null
            };

            try {
                const messageRef = doc(collection(db, 'artifacts', appId, 'rooms', currentRoomId, 'messages'));
                await setDoc(messageRef, messageData);
                
                inputs.msg.value = '';
                inputs.msg.style.height = 'auto';
                cancelReplyState();
            } catch (error) {
                console.error("Error sending message:", error);
            }
        }

        function cancelReplyState() {
            replyingToObj = null;
            ui.replyBox.classList.add('hidden');
        }

        // Send Button and Enter Key Event Listeners
        btn.send.addEventListener('click', sendMessage);
        inputs.msg.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        btn.cancelReply.addEventListener('click', cancelReplyState);

        function startChatListeners() {
            const messagesRef = collection(db, 'artifacts', appId, 'rooms', currentRoomId, 'messages');
            const q = query(messagesRef);
            
            if (unsubscribeChat) unsubscribeChat();

            unsubscribeChat = onSnapshot(q, (snapshot) => {
                localChatStore = [];
                snapshot.forEach((docSnap) => {
                    localChatStore.push({ id: docSnap.id, ...docSnap.data() });
                });
                localChatStore.sort((a, b) => a.timestamp - b.timestamp);
                renderMessages();
            });
        }

        function renderMessages() {
            ui.messages.innerHTML = `
                <div class="flex justify-center mb-4 mt-2">
                    <div class="bg-[#FFEECD] text-gray-700 text-[11px] px-4 py-1.5 rounded-lg text-center shadow-sm">
                        <i class="ph-fill ph-lock-key inline align-middle mr-1"></i> End-to-End Encrypted & Secure.
                    </div>
                </div>
            `;

            localChatStore.forEach(msg => {
                const isMe = msg.sender === myId;
                const div = document.createElement('div');
                div.className = `flex w-full mb-1 ${isMe ? 'justify-end' : 'justify-start'}`;
                
                div.innerHTML = `
                    <div class="max-w-[75%] rounded-lg px-3 py-1.5 shadow-sm relative ${isMe ? 'bg-wa-sent bubble-tail-sent' : 'bg-wa-rcvd bubble-tail-rcvd'}">
                        <p class="text-[14px] text-gray-800 break-words whitespace-pre-wrap">${escapeHTML(msg.text)}</p>
                        <div class="text-[10px] text-gray-500 text-right mt-0.5 select-none">${formatTime(msg.timestamp)}</div>
                    </div>
                `;
                ui.messages.appendChild(div);
            });
            ui.messages.scrollTop = ui.messages.scrollHeight;
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        function formatTime(ts) {
            if (!ts) return '';
            const d = new Date(ts);
            return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        // Dropdown menu toggle
        btn.menu.addEventListener('click', () => {
            ui.dropdown.classList.toggle('hidden');
        });

        document.addEventListener('click', (e) => {
            if (!btn.menu.contains(e.target) && !ui.dropdown.contains(e.target)) {
                ui.dropdown.classList.add('hidden');
            }
        });

        btn.back.addEventListener('click', () => {
            ui.chat.classList.add('hidden');
            ui.login.classList.remove('hidden');
            if (unsubscribeChat) unsubscribeChat();
        });
    </script>
</body>
</html>
