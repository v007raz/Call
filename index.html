<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Secure Cloud</title><script src="https://cdn.tailwindcss.com"></script><style>html,body{margin:0;height:100%;background:#f3f4f6;font-family:Arial,sans-serif}#app{max-width:450px;height:100%;margin:auto;background:#fff;position:relative;overflow:hidden}.screen{position:absolute;inset:0}.bubble{max-width:80%;padding:8px 10px;border-radius:10px;word-break:break-word;position:relative}.sent{background:#dcf8c6;align-self:flex-end}.received{background:#fff;align-self:flex-start}.modal{background:#0008;z-index:50}.hidden{display:none!important}</style></head><body><div id="app">
<section id="login" class="screen flex flex-col justify-center p-6"><h1 class="text-2xl font-bold text-center mb-6">Secure Cloud</h1><input id="myId" class="border rounded p-3 mb-3" placeholder="Your ID (e.g. doraemon)" autocomplete="off"><input id="partnerId" class="border rounded p-3 mb-3" placeholder="Partner ID (e.g. nobita)" autocomplete="off"><button id="connect" disabled class="bg-teal-700 text-white rounded p-3 font-bold opacity-50">Connecting…</button><p id="loginStatus" class="text-center text-sm mt-4 text-gray-500">Connecting to Firebase…</p></section>

<div id="colors" class="screen hidden modal flex items-center justify-center"><div class="bg-white rounded-xl p-5 w-64"><h3 class="font-bold mb-3">Background color</h3><div class="grid grid-cols-3 gap-2"><button data-bg="#efeae2" class="h-10 bg-[#efeae2] border rounded"></button><button data-bg="#dbeafe" class="h-10 bg-blue-100 border rounded"></button><button data-bg="#dcfce7" class="h-10 bg-green-100 border rounded"></button><button data-bg="#fce7f3" class="h-10 bg-pink-100 border rounded"></button><button data-bg="#1f2937" class="h-10 bg-gray-800 border rounded"></button><button data-bg="#fef3c7" class="h-10 bg-amber-100 border rounded"></button></div><button id="closeColors" class="w-full mt-4 p-2 bg-gray-100 rounded">Close</button></div></div>
</div>
<script>setTimeout(()=>{const s=document.getElementById('loginStatus');if(s&&s.textContent.includes('Connecting'))s.textContent='❌ Firebase load timeout — network/CDN check karein';},15000);</script>

function draw(s){const a=[];s.forEach(x=>a.push({id:x.id,...x.data()}));a.sort((x,y)=>(x.timestamp||0)-(y.timestamp||0));$("messages").innerHTML="";a.forEach(m=>{if((m.deletedFor||[]).includes(myId))return;const row=document.createElement("div");row.className="flex "+(m.senderId===myId?"justify-end":"justify-start");const b=document.createElement("div");b.className="bubble "+(m.senderId===myId?"sent":"received");b.dataset.id=m.id;b.textContent=m.isDeleted?(m.senderId===myId?"You deleted this message":"This message was deleted"):(m.text||"");if(m.replyTo){const r=document.createElement("small");r.className="block border-l-2 border-teal-600 pl-2 mb-1 text-gray-500";r.textContent="↩ "+m.replyTo.text;b.prepend(r)}const foot=document.createElement("small");foot.className="block text-right text-gray-500";foot.innerHTML=new Date(m.timestamp||0).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})+(m.senderId===myId?" "+(m.status==="read"?"<span class='text-blue-600'>✓✓</span>":m.status==="delivered"?"✓✓":"✓"):"");b.append(foot);let sx=0;b.addEventListener("touchstart",e=>sx=e.touches[0].clientX,{passive:true});b.addEventListener("touchend",e=>{if(e.changedTouches[0].clientX-sx>55){replyTo=m;$("replyText").textContent="Replying to: "+(m.text||"media");$("replyBox").classList.remove("hidden");$("message").focus()}});b.onclick=e=>{if(Math.abs((e.clientX||0)-sx)<10){selected=m;$("actions").classList.remove("hidden");$("edit").classList.toggle("hidden",!(m.senderId===myId&&!m.isDeleted))}};row.append(b);$("messages").append(row);if(m.senderId!==myId&&m.status!=="read")updateDoc(doc(C("chat_"+room),m.id),{status:"read"}).catch(()=>{})});$("messages").scrollTop=$("messages").scrollHeight}

const rtc={iceServers:[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:global.stun.twilio.com:3478"}]};function reset(){if(pc)pc.close();if(stream)stream.getTracks().forEach(t=>t.stop());pc=null;stream=null;$("remote").srcObject=null;$("local").srcObject=null;call.classList.add("hidden");chat.classList.remove("hidden");queued=[];callId=null}function peer(caller){pc=new RTCPeerConnection(rtc);stream.getTracks().forEach(t=>pc.addTrack(t,stream));pc.ontrack=e=>{$("remote").srcObject=e.streams[0];$("callState").textContent="Connected"};pc.onicecandidate=e=>{if(e.candidate)setDoc(doc(collection(db,"artifacts",A,"public","data","call_candidates",callId,caller?myId:partnerId)),e.candidate.toJSON()).catch(console.warn)};pc.onconnectionstatechange=()=>{if(["failed","closed"].includes(pc.connectionState))reset()};return pc}function watch(owner){return onSnapshot(collection(db,"artifacts",A,"public","data","call_candidates",callId,owner),s=>s.docChanges().forEach(async x=>{if(x.type!=="added"||!pc)return;const c=new RTCIceCandidate(x.doc.data());if(pc.remoteDescription)await pc.addIceCandidate(c).catch(console.warn);else queued.push(c)}))}async function getMedia(v){try{return await navigator.mediaDevices.getUserMedia({audio:true,video:v})}catch(e){err("Microphone/Camera permission failed",e);return null}}

Me").onclick=async()=>{if(selected)await updateDoc(doc(C("chat_"+room),selected.id),{deletedFor:[...(selected.deletedFor||[]),myId]});$("actions").classList.add("hidden")};$("deleteAll").onclick=async()=>{if(selected)await updateDoc(doc(C("chat_"+room),selected.id),{isDeleted:true,text:""});$("actions").classList.add("hidden")};
