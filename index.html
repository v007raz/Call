<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Permissions-Policy" content="camera=(self), microphone=(self)">
<title>Secure Cloud</title>
<script src="https://cdn.tailwindcss.com">



</script>
<style>
html,body{margin:0;height:100%;font-family:Arial;background:#f3f4f6}
#app{max-width:450px;height:var(--app-height,100dvh);margin:auto;position:relative;overflow:hidden;background:#fff}
#chat{height:100%;min-height:0}
#messages{min-height:0;overflow-anchor:auto;scroll-padding-bottom:12px}
#composer{flex-shrink:0;position:relative;z-index:5}
.screen{position:absolute;inset:0}
.hidden{display:none!important}
.bubble{max-width:80%;min-width:92px;padding:8px 10px;border-radius:10px;word-break:break-word}
.sent{background:#dcf8c6}
.received{background:#fff}
.modal{background:#0008;z-index:50}

/* Compact reply bubble shown directly above the message composer. */
#replyBox{
  margin:0 10px 4px;
  padding:7px 9px;
  border:1px solid #d1d5db;
  border-left:4px solid #0f766e;
  border-radius:10px;
  background:#ffffff;
  box-shadow:0 1px 3px rgba(0,0,0,.10);
  min-height:34px;
}
#replyBox > div{min-width:0;flex:1}
#replyText{max-width:calc(100vw - 105px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cancelReply{font-size:16px;line-height:1;min-width:30px;height:30px;border-radius:50%}
#cancelReply:active{background:#f3f4f6}

/* Keep the composer/input ready while reply mode is active. */
#message.reply-lock{caret-color:#0f766e}

.linkified { color:#2563eb; text-decoration:underline; cursor:pointer; word-break:break-all; }
#scrollBottom{transition:transform .2s,opacity .2s}
#scrollBottom:active,#emojiBtn:active{transform:scale(.9)}
#emojiTray button{cursor:pointer}
</style>

<style id="smooth-ui-upgrade">
:root{
  --accent:#0f766e;
  --accent-2:#14b8a6;
  --accent-3:#2dd4bf;
  --glass:rgba(255,255,255,.78);
  --ease:cubic-bezier(.22,1,.36,1);
  --ease-bounce:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:
    radial-gradient(circle at 10% 10%,rgba(20,184,166,.12),transparent 30%),
    radial-gradient(circle at 90% 90%,rgba(59,130,246,.10),transparent 32%),
    #f3f4f6;
}
#app{
  box-shadow:0 24px 80px rgba(15,23,42,.18);
  isolation:isolate;
}

/* ---------- Screen transitions ---------- */
.screen{animation:screenIn .38s var(--ease) both}
@keyframes screenIn{from{opacity:0}to{opacity:1}}

/* ---------- Login ---------- */
#login{
  background:
    radial-gradient(circle at 20% 15%,rgba(20,184,166,.16),transparent 32%),
    radial-gradient(circle at 80% 85%,rgba(59,130,246,.12),transparent 34%),
    linear-gradient(145deg,#ffffff,#f0fdfa);
  overflow:hidden;
}
#login:before,#login:after{
  content:"";position:absolute;border-radius:50%;filter:blur(1px);
  background:radial-gradient(circle,rgba(20,184,166,.35),transparent 70%);
  animation:orbFloat 9s ease-in-out infinite;pointer-events:none;z-index:0;
}
#login:before{width:220px;height:220px;top:-60px;left:-60px}
#login:after{width:260px;height:260px;bottom:-80px;right:-70px;animation-delay:-4s;
  background:radial-gradient(circle,rgba(59,130,246,.28),transparent 70%);}
#login > *{position:relative;z-index:1}
#login h1{
  letter-spacing:-.04em;
  background:linear-gradient(120deg,#0f766e,#0ea5a4,#2563eb);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:logoFloat 4s ease-in-out infinite;
}
#login h1:before{
  content:"🔒";display:block;font-size:34px;-webkit-text-fill-color:initial;margin-bottom:6px;
  animation:lockPop .5s var(--ease-bounce) both;
}
#login input,#message{
  transition:transform .22s var(--ease),box-shadow .22s var(--ease),border-color .22s var(--ease);
}
#login input:focus,#message:focus{
  border-color:#14b8a6;
  box-shadow:0 0 0 4px rgba(20,184,166,.12),0 8px 24px rgba(15,118,110,.08);
  transform:translateY(-1px);
}
#connect{
  position:relative;overflow:hidden;
  transition:transform .22s var(--ease),box-shadow .22s var(--ease);
  box-shadow:0 8px 20px rgba(15,118,110,.22);
}
#connect:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(15,118,110,.28)}
#connect:active{transform:scale(.98)}
#connect:after{
  content:"";position:absolute;inset:-80% -20%;
  background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.28) 50%,transparent 65%);
  transform:translateX(-70%) rotate(12deg);
  animation:shine 3.2s infinite;
}
#connect:disabled{opacity:.75;cursor:progress}
#connect.is-loading:before{
  content:"";width:16px;height:16px;margin-right:8px;display:inline-block;vertical-align:-3px;
  border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;
  animation:spin .7s linear infinite;
}
#loginStatus{transition:color .25s,opacity .25s}

/* ---------- Header ---------- */
#chatHeader{
  background:linear-gradient(115deg,#075e54,#0f766e 55%,#0d9488)!important;
  background-size:200% 200%;
  animation:headerSheen 12s ease-in-out infinite;
  box-shadow:0 3px 18px rgba(0,0,0,.16);
  z-index:10;
}
#dpBtn{
  transition:transform .25s var(--ease),box-shadow .25s var(--ease);
  position:relative;
}
#dpBtn:hover{transform:scale(1.06);box-shadow:0 0 0 4px rgba(255,255,255,.12)}
#statusDot{
  width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px;
  background:#9ca3af;box-shadow:0 0 0 rgba(74,222,128,.6);flex-shrink:0;
  transition:background .3s;
}
#statusDot.online{background:#4ade80;animation:pulseDot 1.8s ease-out infinite}
#statusDot.typing{background:#facc15;animation:pulseDot 1s ease-out infinite}
#status{opacity:.9;transition:opacity .25s;display:inline-flex;align-items:center}

/* ---------- Messages area ---------- */
#messages{
  background-image:
    radial-gradient(rgba(15,118,110,.045) 1px,transparent 1px);
  background-size:18px 18px;
  overscroll-behavior:contain;
  scrollbar-width:thin;
  scrollbar-color:rgba(15,118,110,.35) transparent;
}
#messages::-webkit-scrollbar{width:6px}
#messages::-webkit-scrollbar-thumb{background:rgba(15,118,110,.28);border-radius:99px}

.date-sep{
  align-self:center;background:rgba(15,23,42,.55);color:#fff;font-size:11px;
  padding:4px 12px;border-radius:99px;margin:6px 0;box-shadow:0 2px 8px rgba(0,0,0,.12);
  animation:popIn .3s var(--ease) both;backdrop-filter:blur(4px);
}

.bubble{
  position:relative;
  border:1px solid rgba(0,0,0,.045);
  box-shadow:0 3px 12px rgba(15,23,42,.07)!important;
  transition:transform .22s var(--ease),box-shadow .22s var(--ease),filter .22s;
  animation:messageIn .38s var(--ease) both;
}
.bubble:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(15,23,42,.10)!important}
.sent{
  background:linear-gradient(145deg,#dcf8c6,#d3f4ba);
  border-bottom-right-radius:4px;
}
.received{
  background:rgba(255,255,255,.94);
  border-bottom-left-radius:4px;
}
.bubble.heart-pop:after{
  content:"❤️";position:absolute;left:50%;top:50%;font-size:28px;
  transform:translate(-50%,-50%) scale(0);pointer-events:none;
  animation:heartPop .7s var(--ease-bounce) forwards;
}
.bubble img{
  max-width:min(280px,72vw)!important;
  max-height:360px;
  width:auto;height:auto;
  object-fit:contain;
  display:block;
  transition:transform .28s var(--ease),filter .28s;
}
.bubble img:hover{transform:scale(1.012);filter:brightness(1.02)}
#replyBox{
  animation:slideUp .28s var(--ease);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}
#composer{
  background:rgba(248,250,252,.88)!important;
  border-top:1px solid rgba(15,23,42,.07);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  padding-bottom:max(8px,env(safe-area-inset-bottom))!important;
}
#mediaBtn,#send,#emojiBtn{
  transition:transform .2s var(--ease),box-shadow .2s var(--ease),background .2s;
}
#mediaBtn:hover,#send:hover,#emojiBtn:hover{transform:translateY(-2px);box-shadow:0 7px 18px rgba(15,118,110,.20)}
#mediaBtn:active,#send:active,#emojiBtn:active{transform:scale(.92)}
#send{
  background:linear-gradient(135deg,#0f766e,#14b8a6)!important;
}
#send.sending{animation:sendPop .35s var(--ease)}
#unreadBadge{animation:badgePop .3s var(--ease-bounce) both}

#menu,.modal>div{
  animation:popIn .25s var(--ease);
  box-shadow:0 18px 55px rgba(15,23,42,.20)!important;
}
#menu button,#actions button,.theme-btn,#colors button{
  transition:background .18s,transform .18s var(--ease);
}
#menu button:hover,#actions button:hover,.theme-btn:hover,#colors button:hover{
  transform:translateY(-1px);
}
.modal{backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
#mediaModal{background:rgba(2,6,23,.94)!important}
#previewImg{
  animation:mediaIn .35s var(--ease);
  box-shadow:0 18px 70px rgba(0,0,0,.35);
}
#downloadBtn,#closeMedia,#accept,#reject,#end,#mute,#speaker,#toggleVideo{
  transition:transform .2s var(--ease),filter .2s,box-shadow .2s;
}
#downloadBtn:hover,#closeMedia:hover,#accept:hover,#reject:hover,#end:hover,#mute:hover,#speaker:hover,#toggleVideo:hover{
  transform:translateY(-2px);filter:brightness(1.06);box-shadow:0 8px 22px rgba(0,0,0,.22);
}

/* ---------- Call screen ---------- */
#call{
  background:radial-gradient(circle at 50% 30%,#1f2937,#020617 75%)!important;
}
#local{
  border:2px solid rgba(255,255,255,.7);
  box-shadow:0 10px 30px rgba(0,0,0,.35);
  animation:localFloat 4s ease-in-out infinite;
}
#incoming{
  background:radial-gradient(circle at 50% 30%,rgba(31,41,55,.97),rgba(2,6,23,.97) 75%)!important;
}
#incoming h2{animation:pulseSoft 1.8s ease-in-out infinite}
#accept{box-shadow:0 0 0 rgba(34,197,94,.55);animation:acceptGlow 1.8s ease-out infinite}
#reject,#end{position:relative}

/* Call/incoming avatar with radar-style pulse rings */
#callAvatar,#callerAvatar{box-shadow:0 10px 30px rgba(0,0,0,.4)}
.call-ring{animation:callRing 2.6s ease-out infinite;opacity:0}
#callAvatarWrap.connected .call-ring{animation:none;opacity:0}
#local{transition:all .3s var(--ease)}
#call.swapped #remote{
  position:absolute!important;top:16px;right:16px;width:112px;height:144px;
  object-fit:cover;border-radius:10px;z-index:6;
  border:2px solid rgba(255,255,255,.7);box-shadow:0 10px 30px rgba(0,0,0,.35);
}
#call.swapped #local{
  position:absolute!important;inset:0;top:0;right:0;width:100%!important;height:100%!important;
  border:none;border-radius:0;box-shadow:none;z-index:1;animation:none;
}
#call.swapped #audioOnly{display:none}

/* Toggled state (muted / video off / earpiece) on call controls */
#mute.active,#toggleVideo.active,#speaker.active{
  background:linear-gradient(135deg,#dc2626,#ef4444)!important;
  box-shadow:0 0 0 4px rgba(239,68,68,.22);
}

/* ---------- Ripple ---------- */
.rui-ripple{
  position:absolute;border-radius:50%;background:rgba(255,255,255,.55);
  transform:scale(0);pointer-events:none;animation:rippleAnim .55s ease-out forwards;
  mix-blend-mode:overlay;
}

@keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes lockPop{from{opacity:0;transform:scale(.4) rotate(-15deg)}to{opacity:1;transform:scale(1) rotate(0)}}
@keyframes orbFloat{0%,100%{transform:translate(0,0)}50%{transform:translate(14px,-10px)}}
@keyframes headerSheen{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes shine{0%,55%{transform:translateX(-75%) rotate(12deg)}75%,100%{transform:translateX(75%) rotate(12deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes messageIn{from{opacity:0;transform:translateY(9px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes heartPop{0%{opacity:0;transform:translate(-50%,-50%) scale(0)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.3)}100%{opacity:0;transform:translate(-50%,-140%) scale(1)}}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes popIn{from{opacity:0;transform:translateY(-7px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes sendPop{0%{transform:scale(1)}40%{transform:scale(.82)}100%{transform:scale(1)}}
@keyframes badgePop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes mediaIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
@keyframes localFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes pulseSoft{0%,100%{opacity:.7}50%{opacity:1}}
@keyframes pulseDot{0%{box-shadow:0 0 0 0 rgba(74,222,128,.55)}100%{box-shadow:0 0 0 8px rgba(74,222,128,0)}}
@keyframes ringRing{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes callRing{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.85);opacity:0}}
@keyframes acceptGlow{0%{box-shadow:0 0 0 0 rgba(34,197,94,.55)}100%{box-shadow:0 0 0 14px rgba(34,197,94,0)}}
@keyframes rippleAnim{to{transform:scale(2.6);opacity:0}}
@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}
}
</style>

</head>
<body>
<div id="app">
  <section id="login" class="screen flex flex-col justify-center p-6">
    <h1 class="text-2xl font-bold text-center mb-6">Secure Cloud</h1>
    <input id="myId" class="border rounded p-3 mb-3" placeholder="Your ID (e.g. Nobita)">
    <input id="partnerId" class="border rounded p-3 mb-3" placeholder="Partner ID (e.g. Doraemon)">
    <button id="connect" class="bg-teal-700 text-white rounded p-3 font-bold is-loading">Connecting to Firebase…</button>
    <p id="loginStatus" class="text-center text-sm mt-4 text-gray-500">Initializing Firebase…</p>
  </section>

  <section id="chat" class="screen hidden flex flex-col" style="background:#efeae2">
    <header id="chatHeader" class="bg-teal-700 text-white p-3 flex justify-between items-center">
      <div class="flex items-center gap-3 min-w-0">
        <button id="dpBtn" type="button" class="w-11 h-11 rounded-full bg-white/20 overflow-hidden flex items-center justify-center shrink-0" title="Set profile photo">
          <img id="partnerDp" class="w-full h-full object-cover hidden" alt="Profile photo">
          <span id="dpPlaceholder" class="text-xl">👤</span>
        </button>
        <div class="min-w-0">
          <b id="partnerName" class="block truncate">Partner</b>
          <small id="status" class="block"><span id="statusDot"></span><span id="statusText">Offline</span></small>
        </div>
      </div>
      <div class="flex items-center gap-3 relative">
        <button id="audioCall" class="p-2 text-xl">☎</button>
        <button id="videoCall" class="p-2 text-xl">▣</button>
        <button id="scrollBottom" class="p-2 text-xl relative" title="Latest messages">↓<span id="unreadBadge" class="hidden absolute -top-1 -right-1 bg-red-500 text-white text-[10px] leading-none rounded-full min-w-[16px] h-4 px-1 flex items-center justify-center">0</span></button>
        <button id="menuBtn" class="p-2 text-xl">⋮</button>
        <div id="menu" class="hidden absolute right-0 top-12 bg-white text-gray-800 w-48 z-20 shadow rounded">
          <button id="copyMyId" class="block w-full text-left p-3 border-b">Copy my ID</button>
           <button id="copyPartnerId" class="block w-full text-left p-3 border-b">Copy partner ID</button>
           <button id="clearChat" class="block w-full text-left p-3 border-b text-red-600 font-bold">Clear chat</button>
          <button id="themeBtn" class="block w-full text-left p-3">Chat theme</button>
          <button id="bgBtn" class="block w-full text-left p-3">Background color</button>
        </div>
      </div>
    </header>
    <main id="messages" class="flex-1 overflow-y-auto p-3 flex flex-col gap-2"></main>
    <div id="replyBox" class="hidden text-sm flex justify-between items-center" aria-live="polite">
      <div>
        <span class="text-[10px] text-teal-700 font-bold block">Replying to</span>
        <span id="replyText" class="text-gray-600 block"></span>
      </div>
      <button id="cancelReply" type="button" class="text-gray-500 font-bold px-2" aria-label="Cancel reply">✕</button>
    </div>
    <div id="emojiTray" class="hidden px-3 py-2 bg-white border-t text-xl flex-wrap gap-2">😊 😂 ❤️ 👍 😍 😢 😎 🔥 🎉 🙏 👋 💯</div>
     <div id="composer" class="p-2 bg-gray-100 flex items-center gap-2">
      <input type="file" id="mediaInput" accept="image/*,video/*,audio/*" class="hidden">
      <input type="file" id="dpInput" accept="image/*" class="hidden">
      <button id="emojiBtn" class="rounded-full bg-gray-200 text-gray-700 w-10 h-10 flex items-center justify-center text-lg" title="Emoji">😊</button>
       <button id="mediaBtn" class="rounded-full bg-gray-200 text-gray-700 w-10 h-10 flex items-center justify-center text-lg font-bold" title="Photo or video">＋</button>
      <textarea id="message" rows="1" class="flex-1 rounded-2xl p-3 border resize-none outline-none" placeholder="Message"></textarea>
      <button id="send" class="rounded-full bg-teal-700 text-white w-12 h-12 flex items-center justify-center">➤</button>
    </div>
  </section>

  <section id="call" class="screen hidden bg-gray-900 text-white">
    <video id="remote" autoplay playsinline class="w-full h-full object-cover"></video>
    <div id="audioOnly" class="absolute inset-0 flex flex-col items-center justify-center gap-3 text-center px-6">
      <div id="callAvatarWrap" class="relative w-28 h-28 flex items-center justify-center">
        <span class="call-ring absolute inset-0 rounded-full border-2 border-teal-300/50"></span>
        <span class="call-ring absolute inset-0 rounded-full border-2 border-teal-300/50" style="animation-delay:.7s"></span>
        <span class="call-ring absolute inset-0 rounded-full border-2 border-teal-300/50" style="animation-delay:1.4s"></span>
        <div id="callAvatar" class="w-28 h-28 rounded-full bg-white/10 border border-white/20 flex items-center justify-center text-5xl overflow-hidden relative z-10">
          <img id="callAvatarImg" class="w-full h-full object-cover hidden" alt="">
          <span id="callAvatarInitial">👤</span>
        </div>
      </div>
    </div>
    <video id="local" autoplay muted playsinline title="Tap to swap view" class="absolute top-4 right-4 w-28 h-36 object-cover rounded cursor-pointer"></video>
    <div class="absolute top-4 w-full text-center">
      <b id="callName"></b>
      <p id="callState">Calling…</p><p id="callDuration" class="text-sm opacity-80 hidden">00:00</p>
    </div>
    <div class="absolute bottom-8 w-full flex justify-center gap-3 flex-wrap px-4">
      <button id="mute" class="bg-gray-700 rounded-full px-4 py-3">🎙 Mute</button>
      <button id="speaker" class="bg-gray-700 rounded-full px-4 py-3">🔊 Speaker</button>
      <button id="toggleVideo" class="bg-gray-700 rounded-full px-4 py-3">📹 Video</button>
      <button id="end" class="bg-red-600 rounded-full px-4 py-3">End</button>
    </div>
  </section>

  <div id="incoming" class="screen hidden bg-gray-900/95 text-white flex flex-col justify-center items-center gap-5">
    <div id="callerAvatarWrap" class="relative w-24 h-24 flex items-center justify-center">
      <span class="call-ring absolute inset-0 rounded-full border-2 border-teal-300/50"></span>
      <span class="call-ring absolute inset-0 rounded-full border-2 border-teal-300/50" style="animation-delay:.7s"></span>
      <span class="call-ring absolute inset-0 rounded-full border-2 border-teal-300/50" style="animation-delay:1.4s"></span>
      <div id="callerAvatar" class="w-24 h-24 rounded-full bg-white/10 border border-white/20 flex items-center justify-center text-4xl overflow-hidden relative z-10">
        <img id="callerAvatarImg" class="w-full h-full object-cover hidden" alt="">
        <span id="callerAvatarInitial">👤</span>
      </div>
    </div>
    <h2 id="caller" class="text-2xl"></h2>
    <div class="flex gap-8">
      <button id="reject" class="bg-red-600 rounded-full px-6 py-3">Reject</button>
      <button id="accept" class="bg-green-600 rounded-full px-6 py-3">Accept</button>
    </div>
  </div>

  <div id="actions" class="screen hidden modal flex items-center justify-center">
    <div class="bg-white rounded w-64 overflow-hidden shadow-lg">
      <button id="react" class="w-full text-left p-4 border-b hover:bg-gray-50">😊 React</button>
      <button id="reply" class="w-full text-left p-4 border-b hover:bg-gray-50">↩ Reply</button>
      <button id="copy" class="w-full text-left p-4 border-b hover:bg-gray-50">📋 Copy</button>
      <button id="edit" class="w-full text-left p-4 border-b hover:bg-gray-50">✎ Edit</button>
      <button id="deleteMe" class="w-full text-left p-4 border-b hover:bg-gray-50">Delete for me</button>
      <button id="deleteAll" class="w-full text-left p-4 border-b text-red-600 hover:bg-gray-50 hidden">Delete for everyone</button>
      <button id="closeActions" class="w-full p-4 hover:bg-gray-50 text-gray-600">Cancel</button>
    </div>
  </div>

  <div id="reactionPicker" class="screen hidden modal flex items-center justify-center">
    <div class="bg-white rounded-full px-3 py-2 flex gap-2 shadow-lg text-2xl">
      <button data-emoji="❤️" class="react-emoji p-1">❤️</button>
      <button data-emoji="👍" class="react-emoji p-1">👍</button>
      <button data-emoji="😂" class="react-emoji p-1">😂</button>
      <button data-emoji="😮" class="react-emoji p-1">😮</button>

<script type="module">
function linkifyText(text) {
  const frag = document.createDocumentFragment();
  const re = /(https?:\/\/[^\s<]+|www\.[^\s<]+)/gi;
  let last = 0, m;
  while ((m = re.exec(text)) !== null) {
    frag.append(document.createTextNode(text.slice(last, m.index)));
    let raw = m[0], trailing = "";
    while (/[.,!?;:)\]}]$/.test(raw)) {
      trailing = raw.slice(-1) + trailing;
      raw = raw.slice(0, -1);
    }
    const a = document.createElement("a");
    a.className = "linkified";
    a.textContent = raw;
    a.href = raw.startsWith("www.") ? "https://" + raw : raw;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.onclick = e => {
      e.preventDefault();
      const url = a.href;
      if (/Android/i.test(navigator.userAgent)) {
        try {
          const u = new URL(url);
          window.location.href =
            "intent://" + u.host + u.pathname + u.search + u.hash +
            "#Intent;scheme=" + u.protocol.replace(":", "") +
            ";package=com.android.chrome;end";
          return;
        } catch (_) {}
      }
      window.open(url, "_blank", "noopener,noreferrer");
    };
    frag.append(a);
    if (trailing) frag.append(document.createTextNode(trailing));
    last = m.index + m[0].length;
  }
  frag.append(document.createTextNode(text.slice(last)));
  return frag;
}

function render(s) {
  const a = [];
  s.forEach(x => {

      if (mediaType.startsWith("video/")) {
        const video = document.createElement("video");

    }

    const f = document.createElement("small");

            ? "✓✓"

        : "");

    if (m.image && !m.text) {
      b.append(f);
    } else {
      const last = b.lastElementChild;
      if (last) last.appendChild(f);
      else b.append(f);
    }

    if (m.reactions && Object.keys(m.reactions).length && !m.isDeleted) {
      const groups = {};
      for (const uid_ in m.reactions) {
        const em = m.reactions[uid_];
        (groups[em] = groups[em] || []).push(uid_);
      }
      const row = document.createElement("div");
      row.className = "absolute -bottom-3 right-2 flex gap-1";
      Object.entries(groups).forEach(([em, uids]) => {

    attachHeartDoubleTap(b, m);

    let sx = 0, sy = 0;
    b.ontouchstart = e => {

    r.append(b);

async function send(imgData = null) {
  const i = $("message"), text = i.value.trim();
  if ((!text && !imgData) || !uid || !room) return;

  // Capture the reply BEFORE clearing replyTo. Otherwise hideReplyBubble()
  // removes replyTo and the sent message loses its quoted/reply reference.
  const reply = replyTo ? { id: replyTo.id, text: replyTo.text || "media" } : null;

  // Clear the composer immediately so sending never leaves the typed text
  // stuck in the input while Firestore is saving.
  i.value = "";
  if (reply) hideReplyBubble();
  requestAnimationFrame(() => i.focus({ preventScroll: true }));

  const now = Date.now();
  try {
    if (editing) {
      const editId = editing.id;
      editing = null;

      // Keep the UI responsive while the edit is saved.
      updateDoc(doc(C("chat_" + room), editId), { text, isEdited: true })
        .catch(e => {
          console.error("Message edit failed", e);
          alert("Message edit failed. Check your internet connection.");
        });
      return;
    }

    const id = "msg_" + now + "_" + Math.random().toString(36).slice(2, 8);
    const d = {
      text: text || "",
      senderId: myId,
      timestamp: now,
      status: "sent",
      deletedFor: [],
      isDeleted: false
    };
    if (imgData) d.image = imgData;
    // Keep the quoted message INSIDE the sent bubble permanently.
    if (reply) d.replyTo = reply;

    localMessages.set(id, { id, ...d });

    // Let the cleared textarea paint first, then update the message list.
    requestAnimationFrame(() => {
      render({ docs: [], forEach: cb => localMessages.forEach(cb) });
      requestAnimationFrame(() => {
        const box = $("messages");
        box.scrollTop = box.scrollHeight;
      });
    });

    // Fire-and-forget: UI is not blocked by Firestore round-trip.
    setDoc(doc(C("chat_" + room), id), d).then(() => {
      localMessages.delete(id);
    }).catch(e => {
      console.error("Message send failed", e);
      const m = localMessages.get(id);
      if (m) m.sendError = true;
      render({ docs: [], forEach: cb => localMessages.forEach(cb) });
      alert("Message send failed. Check your internet connection.");
    });
  } catch (e) {
    fail("Message send failed", e);
  }
}

// Formats a raw lastSeen timestamp into an exact, human-readable line
// like WhatsApp's "last seen today at 6:42 PM" instead of a bare "Offline".
function formatLastSeen(ts) {
  const t = Number(ts);
  if (!t || !Number.isFinite(t) || t <= 0) return "Offline";

  const now = Date.now();
  const diffSec = Math.floor((now - t) / 1000);
  if (diffSec < 45) return "last seen just now";

  const d = new Date(t);
  const timeStr = d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit", hour12: true });
  const today = new Date().toDateString();
  const yesterday = new Date(now - 86400000).toDateString();

  if (d.toDateString() === today) return "last seen today at " + timeStr;
  if (d.toDateString() === yesterday) return "last seen yesterday at " + timeStr;

  const sameYear = d.getFullYear() === new Date().getFullYear();
  const dateStr = d.toLocaleDateString("en-US", sameYear
    ? { day: "numeric", month: "short" }
    : { day: "numeric", month: "short", year: "numeric" });
  return "last seen on " + dateStr + " at " + timeStr;
}

let ringCtx = null;

function playRingChime(kind) {
  try {
    ringCtx = ringCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (ringCtx.state === "suspended") ringCtx.resume().catch(() => {});
    const t0 = ringCtx.currentTime;
    const freqs = kind === "back" ? [440, 494] : [523.25, 659.25];
    freqs.forEach((freq, i) => {
      const osc = ringCtx.createOscillator();
      const gain = ringCtx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      const start = t0 + i * 0.25;
      const peak = kind === "back" ? 0.10 : 0.16;
      gain.gain.setValueAtTime(0, start);
      gain.gain.linearRampToValueAtTime(peak, start + 0.05);
      gain.gain.setValueAtTime(peak, start + 0.4);
      gain.gain.linearRampToValueAtTime(0, start + 0.5);
      osc.connect(gain).connect(ringCtx.destination);
      osc.start(start);
      osc.stop(start + 0.55);
    });

  } catch (e) { /* audio not available; ignore silently */ }
}

// --- Subtle ripple feedback on tappable controls ---
document.addEventListener("pointerdown", e => {
  const el = e.target.closest("button");
  if (!el || el.disabled) return;
  const rect = el.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height);
  const ripple = document.createElement("span");
  ripple.className = "rui-ripple";
  ripple.style.width = ripple.style.height = size + "px";
  ripple.style.left = (e.clientX - rect.left - size / 2) + "px";
  ripple.style.top = (e.clientY - rect.top - size / 2) + "px";
  const prevPosition = getComputedStyle(el).position;
  if (prevPosition === "static") el.style.position = "relative";
  el.style.overflow = el.style.overflow || "hidden";
  el.appendChild(ripple);
  setTimeout(() => ripple.remove(), 550);
}, { passive: true });

function formatCallDuration(ms) {
  const total = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(total / 3600);
  const m = Math.floor((total % 3600) / 60);
  const sec = total % 60;
  return h > 0
    ? String(h).padStart(2,"0") + ":" + String(m).padStart(2,"0") + ":" + String(sec).padStart(2,"0")
    : String(m).padStart(2,"0") + ":" + String(sec).padStart(2,"0");
}

function peer(caller) {
  pc = new RTCPeerConnection(rtc);

  if (stream) {
    stream.getTracks().forEach(t => pc.addTrack(t, stream));
  }

  let remoteStream = null;

  pc.ontrack = async e => {
    if (!remoteStream) remoteStream = e.streams?.[0] || new MediaStream();

    if (!e.streams?.[0]) {
      const exists = remoteStream.getTracks().some(t => t.id === e.track.id);
      if (!exists) remoteStream.addTrack(e.track);
    }

    $("remote").srcObject = remoteStream;
    $("remote").muted = false;
    $("remote").volume = 1;
    $("callState").textContent = "Connected";
    if (!callConnectedAt) startCallTimer(Date.now());

    try {
      await $("remote").play();
    } catch (err) {
      console.warn("Remote media autoplay was blocked:", err);
      $("callState").textContent = "Tap Speaker to enable audio";
    }
  };

  pc.onicecandidate = e => {
    if (!e.candidate || !callId) return;
    // Every ICE candidate needs its own document. Reusing one owner
    // document overwrites earlier candidates and can break audio.
    const owner = myId;
    addDoc(
      collection(db, "artifacts", A, "public", "data", "call_candidates", callId, owner),
      e.candidate.toJSON()
    ).catch(console.warn);
  };

  pc.onconnectionstatechange = () => {
    const state = pc?.connectionState;
    if (state === "connected") {
      $("callState").textContent = "Connected";
      stopRing();
      $("callAvatarWrap").classList.add("connected");
      if (!callConnectedAt) {
        startCallTimer(Date.now());
        setDoc(D("call_state", callId), { connectedAt: callConnectedAt }, { merge: true }).catch(console.warn);
      }
    } else if (state === "connecting") $("callState").textContent = "Connecting…";
    else if (state === "disconnected") $("callState").textContent = "Connection interrupted";
    else if (state === "failed") $("callState").textContent = "Connection failed";
    else if (state === "closed") $("callState").textContent = "Call ended";
  };

  pc.oniceconnectionstatechange = async () => {
    const state = pc?.iceConnectionState;
    console.log("ICE state:", state);
    if (state === "checking") $("callState").textContent = "Connecting…";
    else if (state === "connected" || state === "completed") {
      $("callState").textContent = "Connected";
      stopRing();
      $("callAvatarWrap").classList.add("connected");
      await playRemoteAudio();
    } else if (state === "failed") {
      $("callState").textContent = "Connection failed — retry call";
    } else if (state === "disconnected") {
      $("callState").textContent = "Connection interrupted";
    }
  };

  return pc;
}

async function addQueuedCandidates() {
  if (!pc?.remoteDescription) return;
  for (const c of queued.splice(0)) {
    try { await pc.addIceCandidate(c); } catch (e) { console.warn("ICE add failed", e); }
  }
}

function watch(owner) {
  unCandidates?.();
  unCandidates = onSnapshot(
    collection(db, "artifacts", A, "public", "data", "call_candidates", callId, owner),
    async s => {
      for (const x of s.docChanges()) {
        if (x.type !== "added" || !pc) continue;
        try {
          const c = new RTCIceCandidate(x.doc.data());
          if (pc.remoteDescription) await pc.addIceCandidate(c);
          else queued.push(c);
        } catch (e) {
          console.warn("Invalid ICE candidate:", e);
        }
      }
    },
    e => console.warn("ICE signaling error:", e)
  );
}

async function mediaStream(video) {
  if (!window.isSecureContext) {
    showCallError("Calls require HTTPS. Open this site over HTTPS.");
    return null;
  }

  if (!window.RTCPeerConnection) {
    showCallError("WebRTC is not available in this browser/WebView.");
    return null;
  }

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showCallError(
      "This browser/WebView does not allow microphone/camera access. " +
      "Please allow microphone/camera permission for this browser or app, then try again."
    );
    return null;
  }

  const audio = {
    echoCancellation: true,
    noiseSuppression: true,
    autoGainControl: true,
    channelCount: 1,
    sampleRate: { ideal: 48000 },
    sampleSize: { ideal: 16 }
  };

  const videoConstraints = {
    facingMode: { ideal: "user" },
    width: { ideal: 1280, max: 1920 },
    height: { ideal: 720, max: 1080 }
  };

  try {
    // Ask for both tracks in one permission request for video calls.
    return await navigator.mediaDevices.getUserMedia({
      audio,
      video: video ? videoConstraints : false
    });
  } catch (e) {
    console.error("getUserMedia failed:", e);

    // Some WebViews fail on video constraints even though the microphone works.
    // For an audio call, retry with the simplest possible audio request.
    if (!video && (e?.name === "OverconstrainedError" || e?.name === "NotReadableError")) {
      try {
        return await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      } catch (e2) {
        e = e2;
      }
    }

    const name = e?.name || "";
    const msg =
      name === "NotAllowedError" || name === "PermissionDeniedError"
        ? "Microphone/Camera permission is blocked. Allow microphone/camera permission for this site in browser/app settings."
        : name === "NotFoundError"
        ? "No microphone/camera was found on this device."
        : name === "NotReadableError"
        ? "The microphone/camera is busy or cannot be opened by this WebView."
        : name === "SecurityError"
        ? "The WebView blocked microphone/camera access for security reasons."
        : name === "AbortError"
        ? "The microphone/camera request was interrupted. Try the call again."
        : "Microphone/Camera permission failed. Please allow camera and microphone access in your browser/app settings.";

    showCallError(msg, e);
    return null;
  }
}

async function start(video) {
  callStartedVideo = !!video;
  // This function must be called directly from the user's tap/click.
  // That is important because mobile browsers/WebViews may only allow
  // getUserMedia after a user gesture.
  if (!uid) {
    alert("Firebase is not connected yet.");
    return;
  }

  if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
    showCallError(
      "This WebView cannot access microphone/camera. " +
      "If the browser or app blocks the permission, JavaScript cannot bypass that restriction. " +
      "Open the same HTTPS page in Chrome for calling."
    );
    return;
  }
  if (!partnerId) {
    alert("Partner ID is missing.");
    return;
  }

  callEnded = false;
  $("callState").textContent = "Requesting permission…";

  stream = await mediaStream(video);
  if (!stream) return;

  // Re-apply browser DSP after permission is granted.
  const audioTrack = stream.getAudioTracks()[0];
  if (audioTrack?.applyConstraints) {
    audioTrack.applyConstraints({
      echoCancellation: { ideal: true },
      noiseSuppression: { ideal: true },
      autoGainControl: { ideal: true }
    }).catch(() => {});
  }

  callId = room + "_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8);

  $("local").srcObject = stream;
  $("local").classList.toggle("hidden", !video);
  $("remote").classList.toggle("hidden", !video);
  $("audioOnly").classList.toggle("hidden", video);
  $("callName").textContent = partnerId;
  $("callState").textContent = "Calling…";
  stopCallTimer();
  $("speaker").textContent = "🔊 Speaker On";
  speakerOn = true;
  setCallAvatar($("callAvatarImg"), $("callAvatarInitial"), partnerId);
  $("callAvatarWrap").classList.remove("connected");
  call.classList.remove("swapped");
  startRing("back");

  chat.classList.add("hidden");
  call.classList.remove("hidden");

  try {
    peer(true);

    const offer = await pc.createOffer({
      offerToReceiveAudio: true,
      offerToReceiveVideo: video
    });
    await pc.setLocalDescription(offer);

    await setDoc(
      D("active_calls", partnerId),
      {
        caller: myId,
        type: video ? "video" : "audio",
        offer: { type: offer.type, sdp: offer.sdp },
        callId,
        timestamp: Date.now()
      }
    );

    await setDoc(D("call_state", callId), {
      status: "ringing",
      caller: myId,
      callee: partnerId,
      createdAt: Date.now()
    }, { merge: true });
    watchCallState();

    // Keep the caller on "Ringing…" until the other side accepts.
    $("callState").textContent = "Ringing…";
    await setDoc(D("call_state", callId), {
      status: "ringing",
      caller: myId,
      callee: partnerId,
      createdAt: Date.now()
    }, { merge: true });
    watchCallState();

    unAnswer = onSnapshot(D("call_answers", callId), async s => {
      const d = s.data();
      if (!d?.answer || !pc || pc.currentRemoteDescription || callEnded) return;

      try {
        await pc.setRemoteDescription(d.answer);
        await addQueuedCandidates();
      } catch (e) {
        showCallError("Could not establish the call.", e);
      }
    });

    watch(partnerId);
  } catch (e) {
    showCallError("Could not start the call.", e);
    reset();
  }
}

  const audioTrack = stream.getAudioTracks()[0];
  if (audioTrack?.applyConstraints) {
    audioTrack.applyConstraints({
      echoCancellation: { ideal: true },
      noiseSuppression: { ideal: true },
      autoGainControl: { ideal: true }
    }).catch(() => {});
  }

  callId = d.callId;
  partnerId = d.caller;

  $("local").srcObject = stream;
  $("local").classList.toggle("hidden", d.type !== "video");
  $("remote").classList.toggle("hidden", d.type !== "video");
  $("audioOnly").classList.toggle("hidden", d.type === "video");
  $("callName").textContent = partnerId;
  $("callState").textContent = "Connecting…";
  stopCallTimer();
  $("speaker").textContent = "🔊 Speaker On";
  speakerOn = true;
  setCallAvatar($("callAvatarImg"), $("callAvatarInitial"), partnerId);
  $("callAvatarWrap").classList.remove("connected");
  call.classList.remove("swapped");
  stopRing();

  incoming.classList.add("hidden");
  chat.classList.add("hidden");
  call.classList.remove("hidden");

  try {
    peer(false);

    await pc.setRemoteDescription(d.offer);
    await addQueuedCandidates();

    const answer = await pc.createAnswer({
      offerToReceiveAudio: true,
      offerToReceiveVideo: d.type === "video"
    });
    await pc.setLocalDescription(answer);

    await setDoc(
      D("call_answers", callId),
      { answer: { type: answer.type, sdp: answer.sdp } }
    );

    await setDoc(D("call_state", callId), { status: "answering" }, { merge: true });
    watchCallState();

    watch(d.caller);

    await deleteDoc(D("active_calls", myId)).catch(() => {});
    pending = null;
  } catch (e) {
    showCallError("Could not accept the call.", e);
    reset();
  }
}

async function acquireCallWakeLock() {
  try {
    if ("wakeLock" in navigator && !callWakeLock) {
      callWakeLock = await navigator.wakeLock.request("screen");
      callWakeLock.addEventListener("release", () => { callWakeLock = null; });
    }
  } catch (e) {
    console.warn("Wake Lock unavailable:", e);
  }
}

async function releaseCallWakeLock() {
  try { await callWakeLock?.release(); } catch {}
  callWakeLock = null;
}

async function enableBackgroundCallMode() {
  if (!callId) return;

  // Keep media tracks enabled while the page is backgrounded.
  stream?.getAudioTracks().forEach(t => { t.enabled = true; });
  if (callStartedVideo) {
    stream?.getVideoTracks().forEach(t => { t.enabled = true; });
  }

  await acquireCallWakeLock();

  // If the browser supports a persistent notification, tell the user
  // that the call is still active when they leave the chat screen.
  if (document.hidden && "Notification" in window && Notification.permission === "granted") {
    try {
      new Notification("Call in progress", {
        body: "Your call is still active. Return to the app to control it.",
        tag: "secure-cloud-active-call",
        renotify: false
      });
    } catch {}
  }
}

function installBackgroundCallHandling() {
  document.addEventListener("visibilitychange", async () => {
    if (!callId || callEnded) return;

    if (document.hidden) {
      await enableBackgroundCallMode();
    } else {
      await acquireCallWakeLock();
      try { await $("remote").play(); } catch {}
    }
  });

  window.addEventListener("pagehide", () => {
    // Do NOT end an active call merely because the page becomes hidden.
    // Browser/WebView policies still decide whether WebRTC can continue.
  });

  window.addEventListener("beforeunload", e => {
    if (callId && !callEnded) {
      // Prevent accidental navigation/reload from silently destroying the call.
      e.preventDefault();
      e.returnValue = "";
    }
  });
}

  if (callTapLocked) return;
  callTapLocked = true;
  if ("Notification" in window && Notification.permission === "default") {
    await Notification.requestPermission().catch(() => {});
  }
  try {
    await start(video);
  } finally {
    setTimeout(() => { callTapLocked = false; }, 700);
  }
}

function applyTheme(name, customColor = null) {
  const themes = {
    default: "#efeae2",
    blue: "#dbeafe",
    green: "#dcfce7",
    pink: "#fce7f3",
    purple: "#f3e8ff",
    dark: "#1f2937"
  };
  const bg = customColor || themes[name] || themes.default;
  $("chat").style.background = bg;
  $("chat").dataset.theme = name || "custom";
  $("messages").style.color = name === "dark" ? "#fff" : "";
  localStorage.setItem("chat-theme", JSON.stringify({ name: name || "custom", color: bg }));
}

$("clearChat").onclick = async () => {
  if (!confirm("Clear chat sirf aapke phone se clear hoga. Continue?")) return;
  try {
    const snap = await new Promise((resolve, reject) => {
      const unsub = onSnapshot(query(C("chat_" + room)), snapshot => { unsub(); resolve(snapshot); }, error => { unsub(); reject(error); });
    });
    const ids = snap.docs.map(d => d.id);
    ids.forEach(id => localHiddenMessages.add(id));
    localStorage.setItem("hiddenMessages", JSON.stringify([...localHiddenMessages].slice(-5000)));
    render(snap);
    $("menu").classList.add("hidden");
    // Persist in chunks so Firestore limits and a slow network don't freeze the UI.
    for (let i = 0; i < snap.docs.length; i += 400) {
      const batch = writeBatch(db);
      snap.docs.slice(i, i + 400).forEach(d => batch.update(d.ref, { deletedFor: arrayUnion(myId) }));
      await batch.commit();
    }
  } catch (e) { fail("Clear chat failed", e); }
};

$("mediaBtn").onclick = () => $("mediaInput").click();
$("mediaInput").onchange = async e => {
  const file = e.target.files[0];
  e.target.value = "";
  if (!file) return;

  const allowed = file.type.startsWith("image/") || file.type.startsWith("video/") || file.type.startsWith("audio/");
  if (!allowed) return alert("Please select an image, video, or audio file.");
  if (file.size > 50 * 1024 * 1024) return alert("Media file must be 50 MB or smaller.");

  try {
    if (!uid || !room) throw new Error("Chat is not connected yet.");

    const id = "media_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8);
    const ext = (file.name.split(".").pop() || "bin").replace(/[^a-z0-9]/gi, "").slice(0, 8) || "bin";
    const ref = storageRef(storage, "chat_media/" + room + "/" + id + "." + ext);

    await uploadBytes(ref, file, { contentType: file.type });
    const url = await getDownloadURL(ref);
    await sendMediaMessage({ id, url, type: file.type, name: file.name, size: file.size });
  } catch (err) {
    console.error("Media upload failed:", err);
    alert("Media upload failed: " + (err?.message || "Check Firebase Storage rules and your internet connection."));
  }
};

async function sendMediaMessage({ id, url, type, name, size }) {
  const d = {
    text: "", senderId: myId, timestamp: Date.now(), status: "sent",
    deletedFor: [], isDeleted: false,
    mediaUrl: url, mediaType: type, fileName: name, fileSize: size
  };
  if (replyTo) {
    d.replyTo = { id: replyTo.id, text: replyTo.text || "media" };
    hideReplyBubble();
  }
  localMessages.set(id, { id, ...d });
  render({ docs: [], forEach: cb => localMessages.forEach(cb) });
  requestAnimationFrame(() => {
    const box = $("messages"); box.scrollTop = box.scrollHeight;
  });
  setDoc(doc(C("chat_" + room), id), d).then(() => {
    localMessages.delete(id);
  }).catch(e => {
    console.error("Media message save failed:", e);
    alert("Media uploaded, but the message could not be saved.");
  });
}

$("copy").onclick = async () => {
  if (!selected) return;

  const text = selected.text || "";
  if (!text) {
    $("actions").classList.add("hidden");
    return;
  }

  try {
    await navigator.clipboard.writeText(text);
  } catch (e) {
    // Fallback for browsers/WebViews where Clipboard API is unavailable.
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try { document.execCommand("copy"); } catch (_) {}
    ta.remove();
  }

  $("actions").classList.add("hidden");
};

// ShareChat / in-app browser detection.
// JavaScript cannot grant a permission that the host WebView has disabled.
const ua = navigator.userAgent || "";
const inAppBrowser =
  /; wv\)/i.test(ua) ||
  (/Android/i.test(ua) && /Version\/\d+\.\d+/i.test(ua) && /Chrome/i.test(ua));

if (inAppBrowser) {
  console.info("In-app/WebView detected. WebRTC depends on host permission support.");
}

// Basic compatibility check. This does not bypass restrictions imposed by an
// in-app browser; it only gives a useful message instead of failing silently.
if (!window.isSecureContext) {
  $("loginStatus").textContent = "⚠️ HTTPS is required for calls";
}
if (!window.RTCPeerConnection) {
  console.warn("WebRTC RTCPeerConnection is not available in this browser.");
}
if (!navigator.mediaDevices?.getUserMedia) {
  console.warn("getUserMedia is not available in this browser/WebView.");
}

const timer = setTimeout(() => { if (!uid) { $("loginStatus").textContent = "Firebase timeout — check Anonymous Auth"; } }, 12000);

function syncAppToVisualViewport() {
  const vv = window.visualViewport;
  if (!vv) {
    document.documentElement.style.setProperty("--app-height", `${window.innerHeight}px`);
    return;
  }

  // visualViewport.height becomes the visible area above the Android keyboard.
  // Keep the whole chat inside that area so the composer follows the keyboard.
  document.documentElement.style.setProperty("--app-height", `${vv.height}px`);

  // Keep the focused input visible after the viewport changes.
  if (document.activeElement === $("message")) {
    requestAnimationFrame(() => {
      $("message").scrollIntoView({ block: "nearest", inline: "nearest" });
    });
  }
}

syncAppToVisualViewport();
window.addEventListener("resize", syncAppToVisualViewport, { passive: true });
window.visualViewport?.addEventListener("resize", syncAppToVisualViewport, { passive: true });
window.visualViewport?.addEventListener("scroll", syncAppToVisualViewport, { passive: true });

signInAnonymously(auth).catch(e => fail("Firebase auth failed", e));
onAuthStateChanged(auth, u => {
  uid = u?.uid || null;
  if (uid) {
    clearTimeout(timer);
    $("connect").classList.remove("is-loading");
    $("connect").textContent = "Start Secure Chat";
    $("loginStatus").textContent = "✅ Connected";
  }
});
