<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Secure Cloud</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>html,body{margin:0;height:100%;background:#f3f4f6;font-family:Arial,sans-serif}#app{max-width:450px;height:100%;margin:auto;background:#fff;position:relative;overflow:hidden}.bubble{max-width:80%;padding:8px 10px;border-radius:10px;word-break:break-word}.sent{background:#dcf8c6;align-self:flex-end}.received{background:#fff;align-self:flex-start}.screen{position:absolute;inset:0}.hidden{display:none!important}</style>
</head>
<body><div id="app">
<section id="login" class="screen flex flex-col justify-center p-6">
<h1 class="text-2xl font-bold text-center mb-6">Secure Cloud</h1>
<input id="myId" class="border rounded p-3 mb-3" placeholder="Your ID (e.g. doraemon)" autocomplete="off">
<input id="partnerId" class="border rounded p-3 mb-3" placeholder="Partner ID (e.g. nobita)" autocomplete="off">
<button id="connect" disabled class="bg-teal-700 text-white rounded p-3 font-bold opacity-50">Connecting…</button>
<p id="loginStatus" class="text-center text-sm mt-4 text-gray-500">Connecting to Firebase…</p>
</section>
<section id="chat" class="screen hidden flex flex-col bg-[#efeae2]">
<header class="bg-teal-700 text-white p-3 flex justify-between items-center"><div><b id="partnerName">Partner</b><small id="status" class="block">Offline</small></div><div><button id="audioCall" class="px-2 text-xl">☎</button><button id="videoCall" class="px-2 text-xl">▣</button><button id="back" class="px-2">↩</button></div></header>
<main id="messages" class="flex-1 overflow-y-auto p-3 flex flex-col gap-2"></main>
<div class="p-2 bg-gray-100 flex gap-2"><textarea id="message" rows="1" class="flex-1 rounded-2xl p-3 resize-none" placeholder="Message"></textarea><button id="send" disabled class="rounded-full bg-teal-700 text-white w-12 h-12 disabled:opacity-50">➤</button></div>
</section>
<section id="call" class="screen hidden bg-gray-900 text-white"><video id="remote" autoplay playsinline class="w-full h-full object-cover"></video><div id="audioOnly" class="absolute inset-0 flex items-center justify-center text-7xl">☎</div><video id="local" autoplay muted playsinline class="absolute top-4 right-4 w-28 h-36 object-cover rounded border"></video><div class="absolute top-4 w-full text-center"><b id="callName"></b><p id="callState">Connecting…</p></div><button id="end" class="absolute bottom-8 left-1/2 -translate-x-1/2 rounded-full bg-red-600 px-8 py-4">End call</button></section>
<div id="incoming" class="screen hidden bg-gray-900/95 text-white flex flex-col justify-center items-center"><h2 id="caller" class="text-2xl mb-8"></h2><div class="flex gap-8"><button id="reject" class="bg-red-600 rounded-full px-6 py-4">Reject</button><button id="accept" class="bg-green-600 rounded-full px-6 py-4">Accept</button></div></div>
</div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import {getAuth,signInAnonymously,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
import {getFirestore,doc,setDoc,deleteDoc,onSnapshot,collection,query} from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyDHUttmxneJt1KZCf3d-9lRqrdxLxx76C0",authDomain:"myweb-88daa.firebaseapp.com",projectId:"myweb-88daa",storageBucket:"myweb-88daa.firebasestorage.app",messagingSenderId:"297038746284",appId:"1:297038746284:web:272d0ecdc8a3cfa3a20509",measurementId:"G-3KPXF8W72R"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),APP_ID="my-whatsapp-clone";
const $=id=>document.getElementById(id); const login=$("login"),chat=$("chat"),call=$("call"),incoming=$("incoming");
let uid=null,myId="",partnerId="",room="",unChat=null,unPresence=null,unIncoming=null,pc=null,stream=null,callId=null,pending=null,queuedCandidates=[];
const path=(group,id,...rest)=>doc(db,"artifacts",APP_ID,"public","data",group,id,...rest);
function error(title,e){console.error(title,e);const detail=e?.code?e.code+" — ":"; "+(e?.message||e);alert(title+detail)}
function valid(v){return /^[a-z0-9_-]{2,40}$/.test(v)}
function stop(){[unChat,unPresence,unIncoming].forEach(f=>f&&f());unChat=unPresence=unIncoming=null}
function roomCollection(){return collection(db,"artifacts",APP_ID,"public","data","chat_"+room)}
function draw(snap){const list=[];snap.forEach(x=>list.push({id:x.id,...x.data()}));list.sort((a,b)=>(a.timestamp||0)-(b.timestamp||0));$("messages").innerHTML="";for(const m of list){if((m.deletedFor||[]).includes(myId))continue;const row=document.createElement("div");row.className="flex "+(m.senderId===myId?"justify-end":"justify-start");const b=document.createElement("div");b.className="bubble "+(m.senderId===myId?"sent":"received");b.textContent=m.text||"";const t=document.createElement("small");t.className="block text-right text-gray-500";t.textContent=new Date(m.timestamp||0).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});b.append(t);row.append(b);$("messages").append(row)}$("messages").scrollTop=$("messages").scrollHeight}
async function send(){const input=$("message"),text=input.value.trim();if(!text||!uid||!room)return;$("send").disabled=true;try{const id="msg_"+Date.now()+"_"+Math.random().toString(36).slice(2,8);await setDoc(doc(roomCollection(),id),{text,senderId:myId,timestamp:Date.now(),status:"sent",deletedFor:[]});input.value=""}catch(e){error("Message send failed",e)}finally{$("send").disabled=false;input.focus()}}
function presence(){setDoc(path("presence",myId),{online:true,lastSeen:Date.now(),uid},{merge:true}).catch(e=>console.warn("Presence write",e));unPresence=onSnapshot(path("presence",partnerId),s=>{if(!s.exists()){$("status").textContent="Offline";return}const d=s.data();$("status").textContent=d.online&&Date.now()-d.lastSeen<15000?"Online":"Offline"})}
function setup(){myId=$("myId").value.trim().toLowerCase();partnerId=$("partnerId").value.trim().toLowerCase();if(!valid(myId)||!valid(partnerId)||myId===partnerId){alert("Dono IDs alag hon aur 2-40 letters, numbers, _ ya - hon.");return}localStorage.setItem("whatsapp_my_id",myId);room=[myId,partnerId].sort().join("_");$("partnerName").textContent=partnerId;login.classList.add("hidden");chat.classList.remove("hidden");$("send").disabled=false;unChat=onSnapshot(query(roomCollection()),draw,e=>error("Chat sync failed",e));presence();listenIncoming()}
const rtc={iceServers:[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:global.stun.twilio.com:3478"}]};
function resetCall(){if(pc){pc.close();pc=null}if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$("remote").srcObject=null;$("local").srcObject=null;call.classList.add("hidden");chat.classList.remove("hidden");callId=null;queuedCandidates=[]}
function peer(caller){pc=new RTCPeerConnection(rtc);stream.getTracks().forEach(t=>pc.addTrack(t,stream));pc.ontrack=e=>{$("remote").srcObject=e.streams[0];$("callState").textContent="Connected"};pc.onconnectionstatechange=()=>{if(["failed","closed"].includes(pc.connectionState))resetCall()};pc.onicecandidate=e=>{if(!e.candidate||!callId)return;const owner=caller?myId:partnerId;setDoc(doc(collection(db,"artifacts",APP_ID,"public","data","call_candidates",callId,owner)),e.candidate.toJSON()).catch(x=>console.warn("ICE write",x))};return pc}
function watchIce(owner){return onSnapshot(collection(db,"artifacts",APP_ID,"public","data","call_candidates",callId,owner),s=>s.docChanges().forEach(async ch=>{if(ch.type!=="added"||!pc)return;const c=new RTCIceCandidate(ch.doc.data());if(pc.remoteDescription)await pc.addIceCandidate(c).catch(e=>console.warn("ICE",e));else queuedCandidates.push(c)}))}
async function media(video){try{return await navigator.mediaDevices.getUserMedia({audio:true,video})}catch(e){error("Camera/Microphone permission failed",e);return null}}
async function startCall(video){if(!uid||!partnerId)return;stream=await media(video);if(!stream)return;callId=room+"_"+Date.now();$("local").srcObject=stream;$("local").classList.toggle("hidden",!video);$("remote").classList.toggle("hidden",!video);$("audioOnly").classList.toggle("hidden",video);$("callName").textContent=partnerId;$("callState").textContent="Calling…";chat.classList.add("hidden");call.classList.remove("hidden");peer(true);const offer=await pc.createOffer();await pc.setLocalDescription(offer);try{await setDoc(path("active_calls",partnerId),{caller:myId,type:video?"video":"audio",offer:{type:offer.type,sdp:offer.sdp},callId,timestamp:Date.now()});const answer=onSnapshot(path("call_answers",callId),async s=>{const d=s.data();if(d?.answer&&pc&&!pc.currentRemoteDescription){await pc.setRemoteDescription(d.answer);for(const c of queuedCandidates)await pc.addIceCandidate(c);queuedCandidates=[]}});watchIce(partnerId);setTimeout(()=>answer(),120000)}catch(e){error("Call setup failed",e);resetCall()}}
function listenIncoming(){if(unIncoming)unIncoming();unIncoming=onSnapshot(path("active_calls",myId),s=>{const d=s.data();if(!d||!d.caller||d.caller===myId||Date.now()-d.timestamp>30000)return;pending=d;$("caller").textContent=d.caller+" is calling";incoming.classList.remove("hidden")})}
async function accept(){const d=pending;if(!d)return;stream=await media(d.type==="video");if(!stream)return;callId=d.callId;partnerId=d.caller;$("local").srcObject=stream;$("local").classList.toggle("hidden",d.type!=="video");$("remote").classList.toggle("hidden",d.type!=="video");$("audioOnly").classList.toggle("hidden",d.type==="video");$("callName").textContent=d.caller;incoming.classList.add("hidden");chat.classList.add("hidden");call.classList.remove("hidden");try{peer(false);await pc.setRemoteDescription(d.offer);for(const c of queuedCandidates)await pc.addIceCandidate(c);queuedCandidates=[];const answer=await pc.createAnswer();await pc.setLocalDescription(answer);await setDoc(path("call_answers",callId),{answer:{type:answer.type,sdp:answer.sdp},timestamp:Date.now()});watchIce(d.caller);await deleteDoc(path("active_calls",myId));pending=null}catch(e){error("Accept call failed",e);resetCall()}}
$("myId").value=localStorage.getItem("whatsapp_my_id")||"";$("connect").onclick=setup;$("send").onclick=send;$("message").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}};$("audioCall").onclick=()=>startCall(false);$("videoCall").onclick=()=>startCall(true);$("accept").onclick=accept;$("reject").onclick=async()=>{incoming.classList.add("hidden");if(pending)await deleteDoc(path("active_calls",myId)).catch(()=>{});pending=null};$("end").onclick=async()=>{if(callId)await deleteDoc(path("active_calls",myId)).catch(()=>{});resetCall()};$("back").onclick=async()=>{stop();await setDoc(path("presence",myId),{online:false,lastSeen:Date.now()},{merge:true}).catch(()=>{});chat.classList.add("hidden");login.classList.remove("hidden")};
signInAnonymously(auth).catch(e=>{$("loginStatus").textContent="❌ Firebase authentication failed";error("Authentication failed",e)});onAuthStateChanged(auth,u=>{uid=u?.uid||null;if(uid){$("connect").disabled=false;$("connect").classList.remove("opacity-50");$("connect").textContent="Start Secure Chat";$("loginStatus").textContent="✅ Connected"}});
</script></body></html>
