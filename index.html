    <style>
        body, html {
            font-family: 'Inter', sans-serif; margin: 0; padding: 0; 
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; 
            height: 100%; width: 100vw; overflow: hidden;
            background-color: #f3f4f6; overscroll-behavior-y: none;
        }
        #app-container {
            height: 100%; width: 100%; max-width: 450px; margin: 0 auto;
            position: relative; display: flex; flex-direction: column;
            background-color: white; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
        #chat-messages::-webkit-scrollbar { width: 5px; }
        #chat-messages::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 10px; }
        
        .bubble-tail-sent::before {
            content: ''; position: absolute; top: 0; right: -8px; width: 20px; height: 20px;
            background: linear-gradient(135deg, #dcf8c6 0%, #dcf8c6 50%, transparent 50%, transparent);
        }
        .bubble-tail-rcvd::before {
            content: ''; position: absolute; top: 0; left: -8px; width: 20px; height: 20px;
            background: linear-gradient(-135deg, #ffffff 0%, #ffffff 50%, transparent 50%, transparent);
        }
        .swipe-transition { transition: transform 0.2s ease-out; }
    </style>
</head>
<body class="flex items-center justify-center">

    <div id="app-container">
        <!-- Login Screen -->
        <div id="login-screen" class="absolute inset-0 bg-white z-50 flex flex-col items-center justify-center p-6">
            <div class="text-center mb-8">
                <div class="w-20 h-20 bg-wa-green rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg">
                    <i class="ph-fill ph-whatsapp-logo text-5xl text-white"></i>

                <button id="connect-btn" class="w-full bg-wa-lightTeal hover:bg-wa-teal text-white font-bold py-3.5 rounded-lg flex items-center justify-center gap-2 shadow-md">

                </button>
            </div>
            <div id="login-status" class="text-sm mt-6 text-gray-500 font-medium">Ready to connect...</div>
        </div>

        <!-- Chat Screen -->
        <div id="chat-screen" class="hidden absolute inset-0 bg-wa-chatBg flex flex-col z-10 bg-chat-pattern bg-cover">
            <!-- Header -->
            <div class="bg-wa-lightTeal text-white px-3 py-2 flex items-center justify-between shadow-md z-30">
                <div class="flex items-center gap-2">
                    <button id="btn-back" class="p-1"><i class="ph-bold ph-arrow-left text-xl"></i></button>
                    <div class="w-10 h-10 bg-gray-300 rounded-full flex items-center justify-center"><i class="ph-fill ph-user text-2xl text-gray-500"></i></div>
                    <div>
                        <h2 id="chat-partner-name" class="font-semibold text-[16px] leading-tight">Partner</h2>
                        <p id="chat-status" class="text-[11px] opacity-90">Offline</p>

                </div>
                <div class="flex items-center gap-1">

                    <button id="btn-audio-call" class="p-2"><i class="ph-fill ph-phone text-xl"></i></button>
                </div>
            </div>

            <!-- Messages Container -->
            <div id="chat-messages" class="flex-1 overflow-y-auto p-3 flex flex-col gap-2 relative">
                <!-- Encryption Notice -->
                <div class="flex justify-center my-2">
                    <span class="bg-[#FFEECD] text-[11px] px-3 py-1 rounded shadow-sm text-gray-600"><i class="ph-fill ph-lock-key mr-1"></i> Messages are encrypted</span>
                </div>
            </div>

            <!-- Input Area (Fixed for Keyboard) -->
            <div id="input-container" class="bg-[#f0f2f5] p-2 flex items-end gap-2 z-40">
                <div class="flex-1 bg-white rounded-2xl flex items-end shadow-sm border border-gray-200">
                    <textarea id="msg-input" rows="1" class="flex-1 bg-transparent p-3 focus:outline-none resize-none max-h-32 text-[15px]" placeholder="Message"></textarea>
                    <label for="media-input" class="p-3 cursor-pointer"><i class="ph ph-paperclip text-xl text-gray-400"></i></label>
                    <input type="file" id="media-input" class="hidden">
                </div>
                <button id="send-btn" class="w-12 h-12 rounded-full bg-wa-lightTeal text-white flex items-center justify-center shadow-md">
                    <i class="ph-fill ph-paper-plane-right text-xl"></i>
                </button>
            </div>
        </div>

        <!-- Call Screen -->
        <div id="call-screen" class="hidden absolute inset-0 bg-slate-900 z-[100] flex flex-col">
            <video id="remote-video" autoplay playsinline class="w-full h-full object-cover"></video>
            <div class="absolute top-10 left-0 w-full text-center text-white">
                <h3 id="call-name" class="text-xl font-bold">Partner Name</h3>
                <p id="call-timer" class="text-sm opacity-80">Connecting...</p>
            </div>
            <div class="absolute top-20 right-4 w-28 h-40 bg-black rounded-lg overflow-hidden border-2 border-white/20">
                <video id="local-video" autoplay playsinline muted class="w-full h-full object-cover"></video>

            <div class="absolute bottom-12 w-full flex justify-center gap-8">

            </div>
        </div>

            <div class="w-24 h-24 bg-wa-green rounded-full flex items-center justify-center animate-bounce mb-4">
                <i class="ph-fill ph-phone-ringing text-5xl"></i>
            </div>
            <h2 id="incoming-caller-name" class="text-2xl font-bold mb-8">Incoming Call...</h2>
            <div class="flex gap-10">
                <button id="reject-btn" class="w-16 h-16 bg-red-500 rounded-full flex items-center justify-center"><i class="ph-fill ph-x text-3xl"></i></button>
                <button id="accept-btn" class="w-16 h-16 bg-green-500 rounded-full flex items-center justify-center"><i class="ph-fill ph-phone text-3xl"></i></button>
            </div>
        </div>
    </div>

        // --- Viewport & Keyboard Fix ---
        const adjustHeight = () => {

            document.getElementById('app-container').style.height = vh + 'px';
            window.scrollTo(0, 0);
        };
        if (window.visualViewport) window.visualViewport.addEventListener('resize', adjustHeight);
        window.addEventListener('resize', adjustHeight);

        // --- Presence (Online/Offline) Logic ---
        async function setStatus(isOnline) {
            if(!myId) return;
            await setDoc(doc(db, "presence", myId), {
                online: isOnline,
                lastSeen: Date.now()
            }, { merge: true });
        }

        function syncPresence() {
            setStatus(true);
            setInterval(() => setStatus(true), 10000);
            onSnapshot(doc(db, "presence", partnerId), (snap) => {
                if(snap.exists()){
                    const data = snap.data();
                    const isOnline = data.online && (Date.now() - data.lastSeen < 25000);
                    const statusEl = document.getElementById('chat-status');
                    if(isOnline) {
                        statusEl.innerText = "Online";
                        statusEl.className = "text-[11px] text-green-300 font-bold";
                    } else {
                        const time = new Date(data.lastSeen).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
                        statusEl.innerText = `last seen today at ${time}`;
                        statusEl.className = "text-[11px] opacity-90";
                    }
                }
            });
        }

            peer = new Peer(peerId);

            peer.on('open', () => console.log("PeerJS Ready"));

            peer.on('call', (call) => {
                document.getElementById('incoming-caller-name').innerText = partnerId;
                document.getElementById('incoming-modal').classList.remove('hidden');
                
                document.getElementById('accept-btn').onclick = async () => {
                    localStream = await navigator.mediaDevices.getUserMedia({video: true, audio: true});
                    document.getElementById('local-video').srcObject = localStream;
                    call.answer(localStream);
                    handleCall(call);
                    document.getElementById('incoming-modal').classList.add('hidden');
                    document.getElementById('call-screen').classList.remove('hidden');
                };

                document.getElementById('reject-btn').onclick = () => {
                    call.close();
                    document.getElementById('incoming-modal').classList.add('hidden');
                };
            });
        }

            }
        }
