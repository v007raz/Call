<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Secure Cloud</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
html,body{margin:0;height:100%;font-family:Arial;background:#f3f4f6}
#app{max-width:450px;height:100%;margin:auto;position:relative;overflow:hidden;background:#fff}
.screen{position:absolute;inset:0}
.hidden{display:none!important}
.bubble{max-width:80%;padding:8px 10px;border-radius:10px;word-break:break-word}
.sent{background:#dcf8c6}
.received{background:#fff}
.modal{background:#0008;z-index:50}
</style>
</head>
<body>
<div id="app">
  <section id="login" class="screen flex flex-col justify-center p-6">
    <h1 class="text-2xl font-bold text-center mb-6">Secure Cloud</h1>
    <input id="myId" class="border rounded p-3 mb-3" placeholder="Your ID (e.g. doraemon)">
    <input id="partnerId" class="border rounded p-3 mb-3" placeholder="Partner ID (e.g. nobita)">
    <button id="connect" class="bg-teal-700 text-white rounded p-3 font-bold">Connecting to Firebase…</button>
    <p id="loginStatus" class="text-center text-sm mt-4 text-gray-500">Initializing Firebase…</p>
  </section>

  <section id="chat" class="screen hidden flex flex-col" style="background:#efeae2">
    <header class="bg-teal-700 text-white p-3 flex justify-between items-center">
      <div>
        <b id="partnerName">Partner</b>
        <small id="status" class="block">Offline</small>
      </div>
      <div class="flex items-center gap-3 relative">
        <button id="audioCall" class="p-2 text-xl">☎</button>
        <button id="videoCall" class="p-2 text-xl">▣</button>
        <button id="menuBtn" class="p-2 text-xl">⋮</button>
        <div id="menu" class="hidden absolute right-0 top-12 bg-white text-gray-800 w-48 z-20 shadow rounded">
          <button id="clearChat" class="block w-full text-left p-3 border-b">Clear chat</button>
          <button id="bgBtn" class="block w-full text-left p-3">Background color</button>
        </div>
      </div>
    </header>
    <main id="messages" class="flex-1 overflow-y-auto p-3 flex flex-col gap-2"></main>
    <div id="replyBox" class="hidden bg-white p-2 text-sm flex justify-between">
      <span id="replyText"></span><button id="cancelReply">✕</button>
    </div>
    <div class="p-2 bg-gray-100 flex items-center gap-2">
      <input type="file" id="mediaInput" accept="image/*" class="hidden">
      <button id="mediaBtn" class="rounded-full bg-gray-200 text-gray-700 w-10 h-10 flex items-center justify-center text-lg font-bold">＋</button>
      <textarea id="message" rows="1" class="flex-1 rounded-2xl p-3 border" placeholder="Message"></textarea>
      <button id="send" class="rounded-full bg-teal-700 text-white w-12 h-12 flex items-center justify-center">➤</button>
    </div>
  </section>

  <section id="call" class="screen hidden bg-gray-900 text-white">
    <video id="remote" autoplay playsinline class="w-full h-full object-cover"></video>
    <div id="audioOnly" class="absolute inset-0 flex items-center justify-center text-7xl">☎</div>
    <video id="local" autoplay muted playsinline class="absolute top-4 right-4 w-28 h-36 object-cover rounded"></video>
    <div class="absolute top-4 w-full text-center">
      <b id="callName"></b>
      <p id="callState">Calling…</p>
    </div>
    <div class="absolute bottom-8 w-full flex justify-center gap-3 flex-wrap px-4">
      <button id="mute" class="bg-gray-700 rounded-full px-4 py-3">🎙 Mute</button>
      <button id="speaker" class="bg-gray-700 rounded-full px-4 py-3">🔊 Speaker</button>
      <button id="toggleVideo" class="bg-gray-700 rounded-full px-4 py-3">📹 Video</button>
      <button id="end" class="bg-red-600 rounded-full px-4 py-3">End</button>
    </div>
  </section>

  <div id="incoming" class="screen hidden bg-gray-900/95 text-white flex flex-col justify-center items-center">
    <h2 id="caller" class="text-2xl mb-8"></h2>
    <div class="flex gap-8">
      <button id="reject" class="bg-red-600 rounded-full px-6 py-3">Reject</button>
      <button id="accept" class="bg-green-600 rounded-full px-6 py-3">Accept</button>
    </div>
  </div>

  <div id="actions" class="screen hidden modal flex items-center justify-center">
    <div class="bg-white rounded w-64 overflow-hidden">
      <button id="reply" class="w-full text-left p-4 border-b">↩ Reply</button>
      <button id="edit" class="w-full text-left p-4 border-b">✎ Edit</button>
      <button id="deleteMe" class="w-full text-left p-4 border-b">Delete for me</button>
      <button id="deleteAll" class="w-full text-left p-4 border-b text-red-600">Delete for everyone</button>
      <button id="closeActions" class="w-full p-4">Cancel</button>
    </div>
  </div>

  <div id="colors" class="screen hidden modal flex items-center justify-center">
    <div class="bg-white rounded p-5 w-64">
      <b>Background color</b>
      <div class="grid grid-cols-3 gap-2 mt-3">
        <button data-bg="#efeae2" class="h-10 bg-[#efeae2] border"></button>
        <button data-bg="#dbeafe" class="h-10 bg-blue-100 border"></button>
        <button data-bg="#dcfce7" class="h-10 bg-green-100 border"></button>
        <button data-bg="#fce7f3" class="h-10 bg-pink-100 border"></button>
        <button data-bg="#1f2937" class="h-10 bg-gray-800 border"></button>
        <button data-bg="#fef3c7" class="h-10 bg-amber-100 border"></button>
      </div>
      <button id="closeColors" class="w-full mt-4 p-2 bg-gray-100 rounded">Close</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { initializeAuth, inMemoryPersistence, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
import { getFirestore, doc, setDoc, updateDoc, deleteDoc, onSnapshot, collection, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

const cfg = { apiKey: "AIzaSyDHUttmxneJt1KZCf3d-9lRqrdxLxx76C0", authDomain: "myweb-88daa.firebaseapp.com", projectId: "myweb-88daa", storageBucket: "myweb-88daa.firebasestorage.app", messagingSenderId: "297038746284", appId: "1:297038746284:web:272d0ecdc8a3cfa3a20509" };
const app = initializeApp(cfg);
const auth = initializeAuth(app, { persistence: inMemoryPersistence });
const db = getFirestore(app), A = "my-whatsapp-clone", $ = id => document.getElementById(id), D = (g, id) => doc(db, "artifacts", A, "public", "data", g, id), C = g => collection(db, "artifacts", A, "public", "data", g);

let uid = null, myId = "", partnerId = "", room = "", unChat, unPresence, unIncoming, presenceTimer, pc, stream, callId, pending, selected, replyTo, editing, queued = [];
const login = $("login"), chat = $("chat"), call = $("call"), incoming = $("incoming");

function fail(t, e) { console.error(t, e); $("loginStatus").textContent = t + " — " + (e?.code || e?.message || "failed"); }
function valid(x) { return /^[a-z0-9_-]{2,40}$/.test(x); }

function render(s) {
  const a = [];
  s.forEach(x => a.push({ id: x.id, ...x.data() }));
  a.sort((x, y) => (x.timestamp || 0) - (y.timestamp || 0));
  $("messages").innerHTML = "";
  a.forEach(m => {
    if ((m.deletedFor || []).includes(myId)) return;
    const r = document.createElement("div");
    r.className = "flex " + (m.senderId === myId ? "justify-end" : "justify-start");
    const b = document.createElement("div");
    b.className = "bubble " + (m.senderId === myId ? "sent" : "received");
    
    if (m.isDeleted) {
      b.textContent = m.senderId === myId ? "You deleted this message" : "This message was deleted";
    } else if (m.image) {
      const img = document.createElement("img");
      img.src = m.image;
      img.className = "max-w-xs rounded mb-1 cursor-pointer";
      b.appendChild(img);
      if (m.text) {
        const txt = document.createElement("p");
        txt.textContent = m.text;
        b.appendChild(txt);
      }
    } else {
      b.textContent = m.text || "";
    }

    const f = document.createElement("small");
    f.className = "block text-right text-gray-500 mt-1";
    f.innerHTML = new Date(m.timestamp || 0).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) + (m.senderId === myId ? " " + (m.status === "read" ? "<span class='text-blue-600'>✓✓</span>" : m.status === "delivered" ? "✓✓" : "✓") : "");
    b.append(f);
    
    let sx = 0;
    b.ontouchstart = e => sx = e.touches[0].clientX;
    b.ontouchend = e => { if (e.changedTouches[0].clientX - sx > 55) { replyTo = m; $("replyText").textContent = "Replying to: " + (m.text || "media"); $("replyBox").classList.remove("hidden"); } };
    b.onclick = () => { selected = m; $("actions").classList.remove("hidden"); $("edit").classList.toggle("hidden", !(m.senderId === myId && !m.isDeleted && !m.image)); };
    r.append(b);
    $("messages").append(r);
    if (m.senderId !== myId && m.status !== "read") updateDoc(doc(C("chat_" + room), m.id), { status: "read" }).catch(() => {});
  });
  $("messages").scrollTop = $("messages").scrollHeight;
}

async function send(imgData = null) {
  const i = $("message"), text = i.value.trim();
  if (!text && !imgData || !uid || !room) return;
  try {
    if (editing) {
      await updateDoc(doc(C("chat_" + room), editing.id), { text, isEdited: true });
      editing = null;
    } else {
      const d = { text: text || "", senderId: myId, timestamp: Date.now(), status: "sent", deletedFor: [], isDeleted: false };
      if (imgData) d.image = imgData;
      if (replyTo) { d.replyTo = { id: replyTo.id, text: replyTo.text || "media" }; replyTo = null; $("replyBox").classList.add("hidden"); }
      await setDoc(doc(C("chat_" + room), "msg_" + Date.now() + Math.random().toString(36).slice(2, 7)), d);
    }
    i.value = "";
  } catch (e) { fail("Message send failed", e); }
}

function presence() {
  const write = () => setDoc(D("presence", myId), { online: true, lastSeen: Date.now(), uid }, { merge: true }).catch(console.warn);
  write();
  presenceTimer = setInterval(write, 5000);
  unPresence = onSnapshot(D("presence", partnerId), s => {
    const d = s.data();
    $("status").textContent = d && d.online && Date.now() - d.lastSeen < 15000 ? "Online" : "Offline";
  });
}

function setup() {
  myId = $("myId").value.trim().toLowerCase();
  partnerId = $("partnerId").value.trim().toLowerCase();
  if (!valid(myId) || !valid(partnerId) || myId === partnerId) return alert("Valid, different IDs enter karein.");
  localStorage.setItem("whatsapp_my_id", myId);
  room = [myId, partnerId].sort().join("_");
  $("partnerName").textContent = partnerId;
  login.classList.add("hidden");
  chat.classList.remove("hidden");
  unChat = onSnapshot(query(C("chat_" + room)), render, e => fail("Chat sync failed", e));
  presence();
  listenIncoming();
}

function listenIncoming() {
  unIncoming = onSnapshot(D("active_calls", myId), s => {
    const d = s.data();
    if (d && d.caller && Date.now() - d.timestamp < 30000) {
      pending = d;
      $("caller").textContent = d.caller + " is calling";
      incoming.classList.remove("hidden");
    }
  });
}

const rtc = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };
function reset() { pc?.close(); stream?.getTracks().forEach(t => t.stop()); pc = null; stream = null; call.classList.add("hidden"); chat.classList.remove("hidden"); }

function peer(caller) {
  pc = new RTCPeerConnection(rtc);
  stream.getTracks().forEach(t => pc.addTrack(t, stream));
  pc.ontrack = e => { $("remote").srcObject = e.streams[0]; $("callState").textContent = "Connected"; };
  pc.onicecandidate = e => e.candidate && setDoc(doc(collection(db, "artifacts", A, "public", "data", "call_candidates", callId, caller ? myId : partnerId)), e.candidate.toJSON()).catch(console.warn);
  return pc;
}

function watch(owner) {
  return onSnapshot(collection(db, "artifacts", A, "public", "data", "call_candidates", callId, owner), s => s.docChanges().forEach(async x => {
    if (x.type !== "added" || !pc) return;
    const c = new RTCIceCandidate(x.doc.data());
    if (pc.remoteDescription) await pc.addIceCandidate(c);
    else queued.push(c);
  }));
}

async function mediaStream(video) {
  try { return await navigator.mediaDevices.getUserMedia({ audio: true, video }); } catch (e) { fail("Microphone/Camera permission failed", e); }
}

async function start(video) {
  stream = await mediaStream(video);
  if (!stream) return;
  callId = room + "_" + Date.now();
  $("local").srcObject = stream;
  $("local").classList.toggle("hidden", !video);
  $("remote").classList.toggle("hidden", !video);
  $("audioOnly").classList.toggle("hidden", video);
  $("callName").textContent = partnerId;
  chat.classList.add("hidden");
  call.classList.remove("hidden");
  peer(true);
  const o = await pc.createOffer();
  await pc.setLocalDescription(o);
  await setDoc(D("active_calls", partnerId), { caller: myId, type: video ? "video" : "audio", offer: { type: o.type, sdp: o.sdp }, callId, timestamp: Date.now() });
  onSnapshot(D("call_answers", callId), async s => {
    const d = s.data();
    if (d?.answer && !pc.currentRemoteDescription) {
      await pc.setRemoteDescription(d.answer);
      for (const c of queued) await pc.addIceCandidate(c);
      queued = [];
    }
  });
  watch(partnerId);
}

async function acceptCall() {
  const d = pending;
  stream = await mediaStream(d.type === "video");
  if (!stream) return;
  callId = d.callId;
  partnerId = d.caller;
  $("local").srcObject = stream;
  incoming.classList.add("hidden");
  chat.classList.add("hidden");
  call.classList.remove("hidden");
  peer(false);
  await pc.setRemoteDescription(d.offer);
  const a = await pc.createAnswer();
  await pc.setLocalDescription(a);
  await setDoc(D("call_answers", callId), { answer: { type: a.type, sdp: a.sdp } });
  watch(d.caller);
  await deleteDoc(D("active_calls", myId));
  pending = null;
}

$("myId").value = localStorage.getItem("whatsapp_my_id") || "";
$("connect").onclick = setup;
$("send").onclick = () => send();
$("message").onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } };
$("audioCall").onclick = () => start(false);
$("videoCall").onclick = () => start(true);
$("accept").onclick = () => acceptCall().catch(e => fail("Accept call failed", e));
$("reject").onclick = () => { incoming.classList.add("hidden"); if (pending) deleteDoc(D("active_calls", myId)); pending = null; };
$("end").onclick = reset;
$("mute").onclick = () => { const t = stream?.getAudioTracks()[0]; if (t) { t.enabled = !t.enabled; $("mute").textContent = t.enabled ? "🎙 Mute" : "🔇 Unmute"; } };

let speakerOn = false;
$("speaker").onclick = () => {
  speakerOn = !speakerOn;
  const remoteVideo = $("remote");
  if (typeof remoteVideo.sinkId !== 'undefined') {
    // Advanced audio output switching if supported
  }
  remoteVideo.muted = !speakerOn; // basic toggle simulation for mobile audio output
  $("speaker").textContent = speakerOn ? "🔊 Speaker On" : "🔈 Earpiece";
};

$("toggleVideo").onclick = () => { const t = stream?.getVideoTracks()[0]; if (t) t.enabled = !t.enabled; };
$("menuBtn").onclick = () => $("menu").classList.toggle("hidden");
$("bgBtn").onclick = () => { $("colors").classList.remove("hidden"); $("menu").classList.add("hidden"); };
$("closeColors").onclick = () => $("colors").classList.add("hidden");
document.querySelectorAll("[data-bg]").forEach(b => b.onclick = () => { chat.style.background = b.dataset.bg; localStorage.setItem("chat-bg", b.dataset.bg); $("colors").classList.add("hidden"); });
if (localStorage.getItem("chat-bg")) chat.style.background = localStorage.getItem("chat-bg");

$("clearChat").onclick = async () => {
  if (confirm("Clear chat?")) {
    const snap = await new Promise(resolve => {
      const unsub = onSnapshot(query(C("chat_" + room)), snapshot => {
        unsub();
        resolve(snapshot);
      });
    });
    await Promise.all(snap.docs.map(docSnap => 
      updateDoc(docSnap.ref, { deletedFor: [...(docSnap.data().deletedFor || []), myId] }).catch(() => {})
    ));
    $("menu").classList.add("hidden");
  }
};

$("mediaBtn").onclick = () => $("mediaInput").click();
$("mediaInput").onchange = e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = event => send(event.target.result);
  reader.readAsDataURL(file);
};

$("cancelReply").onclick = () => { $("replyBox").classList.add("hidden"); replyTo = null; };
$("closeActions").onclick = () => $("actions").classList.add("hidden");
$("reply").onclick = () => { replyTo = selected; $("replyText").textContent = "Replying to: " + (selected.text || "media"); $("replyBox").classList.remove("hidden"); $("actions").classList.add("hidden"); };
$("edit").onclick = () => { editing = selected; $("message").value = selected.text || ""; $("message").focus(); $("actions").classList.add("hidden"); };
$("deleteMe").onclick = async () => { if (selected) await updateDoc(doc(C("chat_" + room), selected.id), { deletedFor: [...(selected.deletedFor || []), myId] }); $("actions").classList.add("hidden"); };
$("deleteAll").onclick = async () => { if (selected) await updateDoc(doc(C("chat_" + room), selected.id), { isDeleted: true, text: "", image: "" }); $("actions").classList.add("hidden"); };

const timer = setTimeout(() => { if (!uid) { $("loginStatus").textContent = "Firebase timeout — check Anonymous Auth"; } }, 12000);

signInAnonymously(auth).catch(e => fail("Firebase auth failed", e));
onAuthStateChanged(auth, u => {
  uid = u?.uid || null;
  if (uid) {
    clearTimeout(timer);
    $("connect").textContent = "Start Secure Chat";
    $("loginStatus").textContent = "✅ Connected";
  }
});
</script>
</body>
</html>
