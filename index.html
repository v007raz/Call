<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WhatsApp Cloud</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        wa: {
                            teal: '#075E54', lightTeal: '#128C7E', green: '#25D366',
                            bg: '#ECE5DD', chatBg: '#efeae2', sent: '#dcf8c6', rcvd: '#ffffff'
                        }
                    },
                    backgroundImage: {
                        'chat-pattern': "url('https://w0.peakpx.com/wallpaper/818/148/HD-wallpaper-whatsapp-background-cool-dark-green-new-theme-whatsapp.jpg')"
                    }
                }
            }
        }
    </script>
    
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <style>
        body, html {
            font-family: 'Inter', sans-serif; margin: 0; padding: 0; position: fixed; 
            top: 0; left: 0; right: 0; bottom: 0; height: 100%; width: 100vw; overflow: hidden;
            background-color: #f3f4f6; overscroll-behavior-y: none;
        }
        #app-container {
            height: 100%; width: 100%; max-width: 450px; margin: 0 auto;
            position: relative; display: flex; flex-direction: column;
            background-color: white; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
        #chat-messages::-webkit-scrollbar { width: 5px; }
        #chat-messages::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 10px; }
        
        .bubble-tail-sent::before {
            content: ''; position: absolute; top: 0; right: -8px; width: 20px; height: 20px;
            background: linear-gradient(135deg, #dcf8c6 0%, #dcf8c6 50%, transparent 50%, transparent);
        }
        .bubble-tail-rcvd::before {
            content: ''; position: absolute; top: 0; left: -8px; width: 20px; height: 20px;
            background: linear-gradient(-135deg, #ffffff 0%, #ffffff 50%, transparent 50%, transparent);
        }
        .bubble-deleted::before { display: none !important; }
        .swipe-transition { transition: transform 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94); }
    </style>
</head>
<body class="flex items-center justify-center">

    <div id="app-container">
        <!-- Login Screen -->
        <div id="login-screen" class="absolute inset-0 bg-white z-20 flex flex-col items-center justify-center p-6 transition-transform duration-300">
            <div class="text-center mb-8">
                <div class="w-20 h-20 bg-wa-green rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg">
                    <i class="ph-fill ph-whatsapp-logo text-5xl text-white"></i>
                </div>
                <h1 class="text-2xl font-bold text-gray-800">WhatsApp Cloud</h1>
            </div>
            <div class="w-full space-y-4">
                <input type="text" id="my-id-input" class="w-full bg-gray-50 border border-gray-300 rounded-lg p-3 focus:outline-none focus:border-wa-lightTeal" placeholder="Your ID (e.g. vikash)" autocomplete="off">
                <input type="text" id="partner-id-input" class="w-full bg-gray-50 border border-gray-300 rounded-lg p-3 focus:outline-none focus:border-wa-lightTeal" placeholder="Partner's ID (e.g. rahul)" autocomplete="off">
                <button id="connect-btn" class="w-full bg-wa-lightTeal hover:bg-wa-teal text-white font-bold py-3.5 rounded-lg flex items-center justify-center gap-2 mt-4 shadow-md">
                    Start Chatting <i class="ph-bold ph-arrow-right"></i>
                </button>
            </div>
            <div id="login-status" class="text-sm mt-6 text-center font-bold h-6 text-gray-500">Connecting to Cloud...</div>
        </div>

        <!-- Chat Screen -->
        <div id="chat-screen" class="hidden absolute inset-0 bg-wa-chatBg flex flex-col z-10 bg-chat-pattern bg-cover bg-center">
            
            <div class="bg-wa-lightTeal text-white px-3 py-2 flex items-center justify-between shadow-md z-20 shrink-0">
                <div class="flex items-center gap-2">
                    <button id="btn-back" class="p-1 hover:bg-white/20 rounded-full"><i class="ph-bold ph-arrow-left text-xl"></i></button>
                    <div class="w-10 h-10 bg-gray-300 rounded-full flex items-center justify-center overflow-hidden"><i class="ph-fill ph-user text-2xl text-gray-500"></i></div>
                    <div class="ml-1 flex flex-col justify-center">
                        <h2 id="chat-partner-name" class="font-semibold text-[17px] leading-tight">Partner</h2>
                        <p id="chat-status" class="text-[11px] text-wa-bg opacity-90">Cloud Sync Active</p>
                    </div>
                </div>
                <div class="flex items-center gap-1">
                    <button id="btn-video-call" class="hover:bg-white/20 p-2 rounded-full"><i class="ph-fill ph-video-camera text-xl"></i></button>
                    <button id="btn-audio-call" class="hover:bg-white/20 p-2 rounded-full"><i class="ph-fill ph-phone text-xl"></i></button>
                    <button id="btn-chat-menu" class="hover:bg-white/20 p-2 rounded-full relative"><i class="ph-fill ph-dots-three-vertical text-xl"></i></button>
                    
                    <div id="chat-dropdown" class="hidden absolute top-14 right-2 bg-white text-gray-800 shadow-xl rounded-lg w-44 overflow-hidden z-50 origin-top-right border border-gray-100">
                        <button id="btn-clear-chat" class="w-full text-left px-4 py-3 hover:bg-gray-100 text-[15px] flex items-center gap-3"><i class="ph ph-broom text-lg text-gray-600"></i> Clear Chat</button>
                    </div>
                </div>
            </div>

            <div id="chat-messages" class="flex-1 overflow-y-auto p-3 flex flex-col gap-2 relative z-0 pb-4">
                <div class="flex justify-center mb-4 mt-2">
                    <div class="bg-[#FFEECD] text-gray-700 text-[11px] px-4 py-1.5 rounded-lg text-center shadow-sm">
                        <i class="ph-fill ph-lock-key inline align-middle mr-1"></i> Messages are saved on Cloud.
                    </div>
                </div>
            </div>

            <!-- Reply Box -->
            <div id="reply-preview-box" class="hidden shrink-0 bg-white/90 backdrop-blur border-t border-gray-200 px-3 py-2 flex items-center gap-3 relative z-10 w-full rounded-t-xl mb-[-10px] pb-4">
                <div class="w-1 bg-wa-teal h-full absolute left-0 top-0 rounded-tl-xl"></div>
                <div class="flex-1 overflow-hidden ml-2">
                    <p id="reply-preview-sender" class="text-[13px] font-bold text-wa-teal"></p>
                    <p id="reply-preview-text" class="text-[12px] text-gray-500 truncate"></p>
                </div>
                <button id="btn-cancel-reply" class="p-2 text-gray-500 hover:text-gray-700"><i class="ph-bold ph-x text-lg"></i></button>
            </div>

            <!-- Input Area -->
            <div id="input-container" class="shrink-0 bg-[#f0f2f5] px-2 py-2 flex items-end gap-2 z-20 w-full" style="padding-bottom: env(safe-area-inset-bottom, 8px);">
                <div class="flex-1 bg-white rounded-2xl flex items-end shadow-sm border border-gray-200 relative overflow-hidden">
                    <button class="p-3 text-gray-500"><i class="ph ph-smiley text-xl text-gray-400"></i></button>
                    <textarea id="msg-input" rows="1" class="flex-1 bg-transparent py-3 focus:outline-none resize-none max-h-28 text-[15px] text-gray-800" placeholder="Message"></textarea>
                    <label for="media-input" class="p-3 text-gray-500 hover:text-gray-700 cursor-pointer flex items-center m-0">
                        <i class="ph ph-paperclip text-xl text-gray-400"></i>
                        <input type="file" id="media-input" style="display: none;" accept="image/*,video/*,audio/*,application/pdf">
                    </label>
                </div>
                <button id="send-btn" class="w-12 h-12 rounded-full bg-wa-lightTeal hover:bg-wa-teal text-white flex items-center justify-center shrink-0 shadow-sm disabled:opacity-50">
                    <i class="ph-fill ph-paper-plane-right text-xl ml-1" id="send-icon"></i>
                </button>
            </div>
            
            <div id="upload-progress-bar" class="hidden absolute top-[60px] left-0 w-full bg-wa-teal text-white text-xs font-semibold text-center py-1.5 z-30 shadow-md">
                Uploading Media... <span id="upload-percent">0%</span>
            </div>
        </div>

        <!-- Modals -->
        <div id="msg-action-modal" class="hidden absolute inset-0 bg-black/40 z-[60] flex items-center justify-center p-4 backdrop-blur-sm">
            <div class="bg-white rounded-xl w-full max-w-[280px] flex flex-col overflow-hidden shadow-2xl">
                <div class="px-5 py-3 border-b border-gray-100 font-semibold text-gray-800 text-[15px]">Message Options</div>
                <button id="btn-reply-msg" class="px-5 py-3.5 text-left border-b border-gray-50 flex items-center gap-3 text-gray-800"><i class="ph ph-arrow-u-up-left text-xl text-gray-500"></i> Reply</button>
                <button id="btn-edit-msg" class="hidden px-5 py-3.5 text-left border-b border-gray-50 flex items-center gap-3 text-gray-800"><i class="ph ph-pencil-simple text-xl text-gray-500"></i> Edit message</button>
                <button id="btn-delete-me" class="px-5 py-3.5 text-left border-b border-gray-50 flex items-center gap-3 text-gray-800"><i class="ph ph-trash text-xl text-gray-500"></i> Delete for me</button>
                <button id="btn-delete-everyone" class="hidden px-5 py-3.5 text-left border-b border-gray-50 flex items-center gap-3 text-red-500"><i class="ph ph-trash text-xl"></i> Delete for everyone</button>
                <button id="btn-action-cancel" class="px-5 py-3.5 text-center font-medium text-gray-600 bg-gray-50">Cancel</button>
            </div>
        </div>

        <div id="confirm-modal" class="hidden absolute inset-0 bg-black/40 z-[70] flex items-center justify-center p-4 backdrop-blur-sm">
            <div class="bg-white rounded-xl w-full max-w-[300px] p-5 shadow-2xl">
                <h3 class="text-lg font-bold text-gray-800 mb-2">Clear this chat?</h3>
                <div class="flex justify-end gap-3 mt-4">
                    <button id="btn-confirm-cancel" class="px-4 py-2 text-wa-teal font-medium rounded">Cancel</button>
                    <button id="btn-confirm-clear" class="px-4 py-2 bg-wa-teal text-white font-medium rounded">Clear Chat</button>
                </div>
            </div>
        </div>
        
        <!-- Call Screen -->
        <div id="call-screen" class="hidden absolute inset-0 bg-gray-900 z-[80] flex flex-col relative">
            <video id="remote-video" autoplay playsinline class="w-full h-full object-cover"></video>
            <div id="local-video-container" class="absolute top-16 right-4 w-28 aspect-[3/4] bg-gray-800 rounded-xl overflow-hidden border-2 border-gray-700 z-30">
                <video id="local-video" autoplay playsinline muted class="w-full h-full object-cover"></video>
            </div>
            <div class="absolute top-0 left-0 w-full p-6 bg-gradient-to-b from-black/70 flex flex-col items-center z-20">
                <h3 id="call-partner-display" class="text-white text-lg font-semibold">Partner</h3>
                <p id="call-duration" class="text-gray-300 text-sm">Calling...</p>
            </div>
            <div class="absolute bottom-10 w-full flex justify-center gap-6 z-40">
                <button id="toggle-mic-btn" class="w-14 h-14 rounded-full bg-gray-700/80 text-white flex items-center justify-center"><i class="ph-fill ph-microphone text-2xl" id="mic-icon"></i></button>
                <button id="end-call-btn" class="w-16 h-16 rounded-full bg-red-500 text-white flex items-center justify-center"><i class="ph-fill ph-phone-disconnect text-3xl"></i></button>
                <button id="toggle-video-btn" class="w-14 h-14 rounded-full bg-gray-700/80 text-white flex items-center justify-center"><i class="ph-fill ph-video-camera text-2xl" id="video-icon"></i></button>
            </div>
        </div>

        <div id="incoming-call-modal" class="hidden absolute inset-0 bg-gray-900/95 z-[90] flex flex-col items-center justify-center">
            <div class="w-24 h-24 bg-wa-lightTeal rounded-full flex items-center justify-center animate-pulse"><i class="ph-fill ph-phone-ringing text-5xl text-white"></i></div>
            <h2 class="text-white text-2xl font-bold mt-6 mb-2" id="incoming-caller-id">Caller</h2>
            <div class="flex gap-12 mt-12">
                <button id="reject-call-btn" class="w-16 h-16 rounded-full bg-red-500 flex items-center justify-center text-white"><i class="ph-fill ph-phone-disconnect text-2xl"></i></button>
                <button id="accept-call-btn" class="w-16 h-16 rounded-full bg-green-500 flex items-center justify-center text-white"><i class="ph-fill ph-phone text-2xl"></i></button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection, query, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDHUttmxneJt1KZCf3d-9lRqrdxLxx76C0",
            authDomain: "myweb-88daa.firebaseapp.com",
            projectId: "myweb-88daa",
            storageBucket: "myweb-88daa.firebasestorage.app",
            messagingSenderId: "297038746284",
            appId: "1:297038746284:web:272d0ecdc8a3cfa3a20509",
            measurementId: "G-3KPXF8W72R"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app); 
        
        let currentUserUid = null;
        const appId = "my-whatsapp-clone";
        
        let myId = localStorage.getItem('whatsapp_my_id') || '';
        let partnerId = ''; let currentRoomId = ''; let unsubscribeChat = null;
        let localChatStore = []; let selectedMsgObj = null;
        let replyingToObj = null; let editingMsgObj = null;

        const ui = {
            login: document.getElementById('login-screen'), chat: document.getElementById('chat-screen'),
            messages: document.getElementById('chat-messages'), dropdown: document.getElementById('chat-dropdown'),
            msgModal: document.getElementById('msg-action-modal'), confirmModal: document.getElementById('confirm-modal'),
            uploadBar: document.getElementById('upload-progress-bar'), uploadPercent: document.getElementById('upload-percent'),
            replyBox: document.getElementById('reply-preview-box')
        };
        const inputs = {
            myId: document.getElementById('my-id-input'), partnerId: document.getElementById('partner-id-input'),
            msg: document.getElementById('msg-input'), media: document.getElementById('media-input')
        };
        const btn = {
            menu: document.getElementById('btn-chat-menu'), back: document.getElementById('btn-back'),
            clear: document.getElementById('btn-clear-chat'), send: document.getElementById('send-btn'),
            delMe: document.getElementById('btn-delete-me'), delEveryone: document.getElementById('btn-delete-everyone'), 
            cancelAction: document.getElementById('btn-action-cancel'), reply: document.getElementById('btn-reply-msg'),
            edit: document.getElementById('btn-edit-msg'), cancelReply: document.getElementById('btn-cancel-reply')
        };

        if(myId) { inputs.myId.value = myId; }

        function setupMobileViewportFix() {
            const appContainer = document.getElementById('app-container');
            const adjustHeight = () => {
                if (window.visualViewport) {
                    appContainer.style.height = `${window.visualViewport.height}px`;
                    window.scrollTo(0, 0); 
                    if(!ui.chat.classList.contains('hidden')) ui.messages.scrollTop = ui.messages.scrollHeight;
                }
            };
            window.visualViewport?.addEventListener('resize', adjustHeight);
            window.visualViewport?.addEventListener('scroll', adjustHeight);
            adjustHeight(); 
        }
        setupMobileViewportFix();

        async function initAuth() {
            try { await signInAnonymously(auth); currentUserUid = auth.currentUser.uid; document.getElementById('login-status').textContent = "✅ Connected!"; } 
            catch (err) { alert("Login Failed! Authentication is off in Firebase."); }
        }
        initAuth();

        inputs.msg.addEventListener('input', function() {
            this.style.height = 'auto'; this.style.height = Math.min(this.scrollHeight, 112) + 'px'; 
            if(this.value.trim() === '') this.style.height = 'auto';
            setTimeout(() => ui.messages.scrollTop = ui.messages.scrollHeight, 10);
        });

        document.getElementById('connect-btn').addEventListener('click', () => {
            myId = inputs.myId.value.trim().toLowerCase(); partnerId = inputs.partnerId.value.trim().toLowerCase();
            if (!myId || !partnerId) return alert("Please enter both IDs");
            localStorage.setItem('whatsapp_my_id', myId);
            currentRoomId = [myId, partnerId].sort().join('_');
            
            ui.login.classList.add('-translate-x-full');
            setTimeout(() => {
                ui.login.classList.add('hidden'); ui.login.classList.remove('-translate-x-full'); ui.chat.classList.remove('hidden');
                document.getElementById('chat-partner-name').textContent = partnerId.charAt(0).toUpperCase() + partnerId.slice(1);
            }, 300);
            startChatSync();
        });

        btn.back.addEventListener('click', () => {
            if(unsubscribeChat) { unsubscribeChat(); unsubscribeChat = null; }
            ui.chat.classList.add('hidden'); ui.login.classList.remove('hidden');
        });

        function startChatSync() {
            if(!currentUserUid) return;
            Array.from(ui.messages.children).forEach(child => { if(!child.querySelector('.ph-lock-key')) child.remove(); });
            localChatStore = [];
            const q = query(collection(db, 'artifacts', appId, 'public', 'data', 'chat_' + currentRoomId));
            unsubscribeChat = onSnapshot(q, (snapshot) => {
                const fetchedMessages = [];
                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    if(data.deletedFor && data.deletedFor.includes(myId)) return;
                    fetchedMessages.push({ id: docSnap.id, ...data });
                });
                fetchedMessages.sort((a, b) => a.timestamp - b.timestamp);
                processIncomingMessages(fetchedMessages);
            });
        }

        function processIncomingMessages(fetchedMessages) {
            let needsScroll = false;
            fetchedMessages.forEach(msg => {
                const isSentByMe = msg.senderId === myId;
                const existingIndex = localChatStore.findIndex(m => m.id === msg.id);
                if (existingIndex === -1) {
                    localChatStore.push(msg); renderMessageInDOM(msg, isSentByMe); needsScroll = true;
                    if (!isSentByMe && msg.status !== 'read') {
                        try { updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'chat_' + currentRoomId, msg.id), { status: 'read' }); } catch(e){}
                    }
                } else {
                    const existingMsg = localChatStore[existingIndex];
                    if (existingMsg.status !== msg.status || existingMsg.isDeleted !== msg.isDeleted || existingMsg.text !== msg.text) {
                        localChatStore[existingIndex] = msg; updateMessageDOM(msg, isSentByMe);
                    }
                }
            });
            if(needsScroll) setTimeout(() => ui.messages.scrollTop = ui.messages.scrollHeight, 100);
        }

        function activateReplyMode(msg) {
            replyingToObj = msg; editingMsgObj = null; ui.replyBox.classList.remove('hidden');
            document.getElementById('reply-preview-sender').textContent = msg.senderId === myId ? 'You' : msg.senderId;
            document.getElementById('reply-preview-text').textContent = msg.text ? msg.text : (msg.media ? 'Media file' : '');
            document.getElementById('send-icon').classList.replace('ph-check', 'ph-paper-plane-right'); inputs.msg.focus();
        }
        function activateEditMode(msg) {
            editingMsgObj = msg; replyingToObj = null; ui.replyBox.classList.add('hidden');
            inputs.msg.value = msg.text; inputs.msg.style.height = 'auto'; inputs.msg.style.height = Math.min(inputs.msg.scrollHeight, 112) + 'px'; 
            document.getElementById('send-icon').classList.replace('ph-paper-plane-right', 'ph-check'); inputs.msg.focus();
        }
        btn.cancelReply.addEventListener('click', () => { replyingToObj = null; ui.replyBox.classList.add('hidden'); inputs.msg.focus(); });

        function addSwipeListener(bubble, msg) {
            let startX = 0, currentX = 0;
            bubble.addEventListener('touchstart', (e) => { startX = e.touches[0].clientX; }, {passive: true});
            bubble.addEventListener('touchmove', (e) => {
                currentX = e.touches[0].clientX - startX;
                if (currentX > 0 && currentX < 80) bubble.style.transform = `translateX(${currentX}px)`;
            }, {passive: true});
            bubble.addEventListener('touchend', (e) => {
                bubble.classList.add('swipe-transition'); bubble.style.transform = 'translateX(0px)';
                if (currentX > 50) activateReplyMode(msg);
                setTimeout(() => bubble.classList.remove('swipe-transition'), 200); currentX = 0;
            });
        }

        btn.send.addEventListener('click', (e) => {
            e.preventDefault(); sendMessage(); inputs.msg.focus(); 
        });
        inputs.msg.addEventListener('keypress', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });

        async function sendMessage(overrideText = '', mediaData = null) {
            const text = overrideText !== '' ? overrideText : inputs.msg.value.trim();
            if (!text && !mediaData) return; if (!currentUserUid) return alert("System not connected to Cloud!");

            if (editingMsgObj) {
                try { await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'chat_' + currentRoomId, editingMsgObj.id), { text: text, isEdited: true }); } catch(e) { alert("Edit Failed!"); }
                editingMsgObj = null; inputs.msg.value = ''; inputs.msg.style.height = 'auto';
                document.getElementById('send-icon').classList.replace('ph-check', 'ph-paper-plane-right'); return;
            }

            const timestamp = Date.now();
            const docId = 'msg_' + timestamp + '_' + Math.random().toString(36).substr(2, 5);
            
            // Backup text and clear UI immediately to feel fast
            const backupText = inputs.msg.value;
            inputs.msg.value = ''; inputs.msg.style.height = 'auto';

            let msgData = { text: text, media: mediaData, senderId: myId, timestamp: timestamp, status: 'sent', isDeleted: false, deletedFor: [], isEdited: false };
            if (replyingToObj) {
                msgData.replyTo = { id: replyingToObj.id, text: replyingToObj.text || 'Media', sender: replyingToObj.senderId };
                replyingToObj = null; ui.replyBox.classList.add('hidden');
            }

            try { 
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'chat_' + currentRoomId, docId), msgData); 
            } catch (e) { 
                alert("❌ MESSAGE FAILED! Firebase Database Rules band hain. Please step 1 follow karein!"); 
                inputs.msg.value = backupText; // Put text back if failed
            }
            setTimeout(() => ui.messages.scrollTop = ui.messages.scrollHeight, 50);
        }

        inputs.media.addEventListener('change', async (e) => {
            const file = e.target.files[0]; if(!file) return;
            if(file.size > 20 * 1024 * 1024) return alert("File is too large (Max 20MB)!");

            inputs.msg.disabled = true; btn.send.disabled = true; 
            ui.uploadBar.classList.remove('hidden'); ui.uploadPercent.textContent = '0%';
            
            let safeName = file.name ? file.name.replace(/[^a-zA-Z0-9.]/g, '_') : 'file';
            const storageRef = ref(storage, `chat_media/${currentRoomId}/${Date.now()}_${safeName}`);
            const uploadTask = uploadBytesResumable(storageRef, file);

            uploadTask.on('state_changed',
                (snap) => { ui.uploadPercent.textContent = Math.round((snap.bytesTransferred / snap.totalBytes) * 100) + '%'; },
                (err) => { 
                    alert("❌ UPLOAD BLOCKED! Firebase Storage Rules band hain. Please step 2 follow karein!"); 
                    inputs.msg.disabled = false; btn.send.disabled = false; ui.uploadBar.classList.add('hidden'); inputs.media.value = '';
                },
                async () => {
                    ui.uploadPercent.textContent = 'Processing...';
                    const downloadURL = await getDownloadURL(uploadTask.snapshot.ref);
                    let fileType = 'document';
                    if(file.type.startsWith('image/')) fileType = 'image'; else if(file.type.startsWith('video/')) fileType = 'video';
                    await sendMessage('', { url: downloadURL, name: file.name, type: fileType, size: file.size });
                    inputs.msg.disabled = false; btn.send.disabled = false; ui.uploadBar.classList.add('hidden'); inputs.media.value = ''; inputs.msg.focus();
                }
            );
        });

        function renderMessageInDOM(msg, isSent) {
            const wrapper = document.createElement('div'); wrapper.id = 'wrap_' + msg.id; wrapper.className = `flex w-full ${isSent ? 'justify-end' : 'justify-start'} mb-1 relative`;
            const bubble = document.createElement('div'); bubble.id = 'bubble_' + msg.id;
            
            addSwipeListener(bubble, msg); 
            
            bubble.addEventListener('click', (e) => {
                if (e.target.closest('a') || e.target.tagName === 'VIDEO' || e.target.closest('.reply-block')) return;
                selectedMsgObj = msg; ui.msgModal.classList.remove('hidden');
                if (isSent && !msg.isDeleted && !msg.media) btn.edit.classList.remove('hidden'); else btn.edit.classList.add('hidden');
                if (isSent && !msg.isDeleted) btn.delEveryone.classList.remove('hidden'); else btn.delEveryone.classList.add('hidden');
            });
            wrapper.appendChild(bubble); ui.messages.appendChild(wrapper); updateMessageDOM(msg, isSent);
        }

        function updateMessageDOM(msg, isSent) {
            const bubble = document.getElementById('bubble_' + msg.id); if(!bubble) return;
            if (msg.isDeleted) {
                bubble.className = `relative max-w-[80%] px-3 py-2 rounded-lg text-[15px] bubble-deleted bg-white border border-gray-200 italic text-gray-500 shadow-sm`;
                bubble.innerHTML = `<div class="mr-1 flex items-center"><i class="ph ph-prohibit mr-1 text-lg"></i> ${isSent ? 'You deleted this message' : 'This message was deleted'}</div>`;
                return;
            }

            bubble.className = `relative max-w-[80%] px-2 py-1.5 rounded-lg shadow-sm text-[15px] text-gray-800 break-words active:opacity-90 transition-opacity ${isSent ? 'bg-wa-sent rounded-tr-none bubble-tail-sent' : 'bg-wa-rcvd rounded-tl-none bubble-tail-rcvd'}`;

            let replyHtml = '';
            if (msg.replyTo) {
                replyHtml = `<div class="bg-black/5 border-l-4 border-l-wa-teal p-1.5 rounded mb-1 text-sm cursor-pointer reply-block" onclick="document.getElementById('wrap_${msg.replyTo.id}')?.scrollIntoView({behavior: 'smooth'})">
                    <p class="font-bold text-wa-teal text-xs">${msg.replyTo.sender === myId ? 'You' : msg.replyTo.sender}</p>
                    <p class="text-gray-600 text-xs truncate">${msg.replyTo.text}</p>
                </div>`;
            }

            let mediaHtml = '';
            if (msg.media) {
                const m = msg.media;
                if (m.type === 'image') mediaHtml = `<div class="mb-1 rounded overflow-hidden relative"><img src="${m.url}" class="max-w-full h-auto max-h-[300px] rounded"></div>`;
                else if (m.type === 'video') mediaHtml = `<div class="mb-1 rounded"><video src="${m.url}" controls class="max-w-full max-h-[300px] bg-black rounded"></video></div>`;
            }

            const formattedText = msg.text ? msg.text.replace(/\n/g, '<br>') : '';
            let ticksHtml = '';
            if (isSent) {
                if (msg.status === 'sent') ticksHtml = '<i class="ph-bold ph-check text-gray-400 text-[14px]"></i>';
                if (msg.status === 'delivered') ticksHtml = '<i class="ph-bold ph-checks text-gray-400 text-[14px]"></i>';
                if (msg.status === 'read') ticksHtml = '<i class="ph-bold ph-checks text-blue-500 text-[14px]"></i>';
            }
            
            const textPadding = msg.text ? 'pb-3 px-1' : 'pb-4'; 
            let timeStr = new Date(msg.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            if(timeStr === 'Invalid Date') timeStr = '';
            
            bubble.innerHTML = `${replyHtml}${mediaHtml}${msg.text ? `<div class="${textPadding}">${formattedText}</div>` : `<div class="pb-3"></div>`}
                <div class="absolute bottom-1 right-2 flex items-center gap-1 opacity-90 z-10 ${msg.media && !msg.text ? 'bg-white/60 px-1 rounded-full' : ''}">
                    ${msg.isEdited ? '<span class="text-[10px] text-gray-400 italic">edited</span>' : ''}
                    <span class="text-[10px] text-gray-500 font-medium">${timeStr}</span><span>${ticksHtml}</span>
                </div>`;
        }

        btn.cancelAction.addEventListener('click', () => { ui.msgModal.classList.add('hidden'); selectedMsgObj = null; });
        btn.reply.addEventListener('click', () => { ui.msgModal.classList.add('hidden'); activateReplyMode(selectedMsgObj); });
        btn.edit.addEventListener('click', () => { ui.msgModal.classList.add('hidden'); activateEditMode(selectedMsgObj); });
        
        btn.delMe.addEventListener('click', () => {
            if(!selectedMsgObj) return; ui.msgModal.classList.add('hidden');
            try { updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'chat_' + currentRoomId, selectedMsgObj.id), { deletedFor: [...(selectedMsgObj.deletedFor || []), myId] }); } catch(e){}
            document.getElementById('wrap_' + selectedMsgObj.id)?.remove();
        });
        btn.delEveryone.addEventListener('click', () => {
            if(!selectedMsgObj) return; ui.msgModal.classList.add('hidden');
            try { updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'chat_' + currentRoomId, selectedMsgObj.id), { isDeleted: true }); } catch(e){}
        });
        document.getElementById('btn-chat-menu').addEventListener('click', () => ui.dropdown.classList.toggle('hidden'));
    </script>
</body>
</html>
