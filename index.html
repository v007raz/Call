<style>
html,body{margin:0;height:100%;font-family:Arial;background:#f3f4f6;overscroll-behavior:none}
body{position:fixed;inset:0;width:100%;overflow:hidden}
/* #app is pinned with position:fixed and its own top/height, kept in sync
   with window.visualViewport by JS below. This is what actually stops the
   "white page fills up under the composer" bug: the old approach only
   resized #app while leaving it inside a normal-flow body, so a gap opened
   up between the shrunk #app and the still full-height body whenever the
   keyboard opened or the page was zoomed. Pinning #app directly to the
   visual viewport's own top+height means there is nothing left to leave a
   gap — #app always exactly covers the visible area. */
#app{max-width:450px;height:var(--app-height,100dvh);width:100%;margin:0 auto;position:fixed;top:0;left:0;right:0;overflow:hidden;background:#fff}
#chat{height:100%;min-height:0}
#messages{min-height:0;overflow-anchor:auto;scroll-padding-bottom:12px}
#composer{flex-shrink:0;position:relative;z-index:5}
.screen{position:absolute;inset:0}
.hidden{display:none!important}
.bubble{max-width:80%;min-width:92px;padding:8px 10px;border-radius:10px;word-break:break-word;position:relative}
.sent{background:#dcf8c6}
.received{background:#fff}
.modal{background:#0008;z-index:50}

/* Messages should read like WhatsApp, not like a text document: tapping a
   bubble must never trigger the browser's native text-selection highlight. */
.bubble,.bubble *{
  -webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;
  -webkit-touch-callout:none;
}
/* The composer itself must stay a normal, selectable/editable text field. */
#message,#myId,#partnerId{
  -webkit-user-select:text;user-select:text;-webkit-touch-callout:default;
  /* 16px stops iOS Safari's automatic zoom-on-focus, which is what was
     shoving the composer upward and leaving blank space under it. */
  font-size:16px;
}

/* Compact reply bubble shown directly above the message composer. */
#replyBox{
  margin:0 10px 4px;
  padding:7px 9px;
  border:1px solid #d1d5db;
  border-left:4px solid #0f766e;
  border-radius:10px;
  background:#ffffff;
  box-shadow:0 1px 3px rgba(0,0,0,.10);
  min-height:34px;
}
#replyBox > div{min-width:0;flex:1}
#replyText{max-width:calc(100vw - 105px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cancelReply{font-size:16px;line-height:1;min-width:30px;height:30px;border-radius:50%}
#cancelReply:active{background:#f3f4f6}

/* Keep the composer/input ready while reply mode is active. */
#message.reply-lock{caret-color:#0f766e}

.linkified { color:#2563eb; text-decoration:underline; cursor:pointer; word-break:break-all; }

/* ---------- Multi-select mode ---------- */
#selectBar{animation:slideUp .2s ease}
.select-row{background:rgba(15,118,110,.10);border-radius:12px;transition:background .15s}
.msg-check{
  display:none;position:absolute;top:-7px;right:-7px;width:20px;height:20px;border-radius:50%;
  background:#fff;border:2px solid #9ca3af;align-items:center;justify-content:center;
  font-size:11px;color:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2);z-index:3;
}
#messages.select-mode .msg-check{display:flex}
#messages.select-mode .bubble{cursor:pointer}
.msg-check.checked{background:#0f766e;border-color:#0f766e}
.msg-check.checked:after{content:"✓"}
#scrollBottom{transition:transform .2s,opacity .2s}
#scrollBottom:active,#emojiBtn:active{transform:scale(.9)}
#emojiTray button{cursor:pointer}
</style>

/* ---------- Lite mode ----------
   Some browsers (in-app WebViews, older/lighter mobile browsers) render
   backdrop-filter blur and constant background/gradient animations far
   slower than Chrome/Safari do on the very same phone. A short on-device
   frame-rate probe (see the script below) measures the *actual* rendering
   speed of whichever browser opened the page and adds html.lite when it's
   struggling, so the app quietly trims exactly the expensive parts instead
   of everyone getting a one-size-fits-all, always-heavy or always-plain UI. */
html.lite,html.lite *,html.lite *:before,html.lite *:after{
  animation-duration:.01ms!important;animation-iteration-count:1!important;
  scroll-behavior:auto!important;transition-duration:.01ms!important;
}
html.lite #composer,html.lite #replyBox,html.lite .modal,html.lite .date-sep{
  backdrop-filter:none!important;-webkit-backdrop-filter:none!important;
}
html.lite #messages{background-image:none!important}
html.lite #login:before,html.lite #login:after{display:none!important}
html.lite .bubble,html.lite #app{box-shadow:none!important}

<body>
<script>
// Runs before anything else. Measures real, on-device frame rate for
// ~700ms while the login screen's blur/gradient animations are already
// playing, so it reflects THIS browser's actual rendering speed rather
// than guessing from device specs (which don't explain why the same
// phone can feel fast in one browser and sluggish in another).
(function () {
  try {
    if (typeof requestAnimationFrame !== "function") return;
    var frames = 0, start = null;

  // Always render every Firestore document, in chronological order.
  // Invalid/missing timestamps are kept at the end instead of being dropped.
  a.sort((x, y) => {
    const tx = Number(x.timestamp) || 0;
    const ty = Number(y.timestamp) || 0;
    return tx - ty;
  });

  // Cursor for "Load earlier messages": the oldest timestamp currently
  // known across the live window + any already-loaded older pages.
  earliestLoadedTs = a.length ? (Number(a[0].timestamp) || null) : null;

  const box = $("messages");
  const wasNearBottom =
    box.scrollHeight - box.scrollTop - box.clientHeight < 120;

  // Count newly-arrived partner messages the user hasn't scrolled to yet.
  a.forEach(m => {
    if (m.senderId === myId || m.isDeleted || seenMessageIds.has(m.id)) return;
    seenMessageIds.add(m.id);
    if (renderedOnce) {
      if (!wasNearBottom) unreadCount++;
      playNotifySound();
    }
  });
  if (wasNearBottom) unreadCount = 0;
  renderedOnce = true;
  updateUnreadBadge();

  const frag = document.createDocumentFragment();
  const toMarkRead = [];
  let lastDateKey = "";

  if (a.length && !noMoreOlder) {
    const loadBtn = document.createElement("button");
    loadBtn.type = "button";
    loadBtn.disabled = loadingOlder;
    loadBtn.textContent = loadingOlder ? "Loading…" : "⬆ Load earlier messages";
    loadBtn.className =
      "self-center text-xs font-semibold text-teal-700 bg-white/85 border border-teal-700/25 " +
      "rounded-full px-3 py-1.5 my-1 shadow-sm hover:bg-teal-50 active:scale-95 transition disabled:opacity-60";
    loadBtn.onclick = loadOlderMessages;
    frag.append(loadBtn);
  }

  a.forEach(m => {
    // Only hide a message when deletedFor is a real array containing myId.
    // This prevents malformed/missing deletedFor data from hiding messages.
    const deletedFor = Array.isArray(m.deletedFor) ? m.deletedFor : [];
    if (deletedFor.includes(myId) || localHiddenMessages.has(m.id)) return;

    const msgTime = Number(m.timestamp);
    if (Number.isFinite(msgTime) && msgTime > 0) {
      const d = new Date(msgTime);
      const dateKey = d.toDateString();
      if (dateKey !== lastDateKey) {
        lastDateKey = dateKey;
        const today = new Date().toDateString();
        const yest = new Date(Date.now() - 86400000).toDateString();
        const label = dateKey === today ? "Today" : dateKey === yest ? "Yesterday" :
          d.toLocaleDateString("en-US", { day: "numeric", month: "short", year: "numeric" });
        const sep = document.createElement("div");
        sep.className = "date-sep";
        sep.textContent = label;
        frag.append(sep);
      }
    }

    const r = document.createElement("div");
    const isPicked = selectedIds.has(m.id);
    r.className = "flex p-1 " + (m.senderId === myId ? "justify-end" : "justify-start") + (isPicked ? " select-row" : "");
    r.style.willChange = "transform,opacity";
    r.dataset.mid = m.id;

    const b = document.createElement("div");
    b.className =
      "bubble " +
      (m.senderId === myId ? "sent" : "received") +
      " shadow-sm cursor-pointer";
    b.dataset.mid = m.id;

    if (m.replyTo) {
      const rep = document.createElement("div");
      rep.className =
        "reply-preview bg-black/5 border-l-4 border-teal-700 p-1.5 mb-1.5 text-xs rounded-md text-gray-700";
      rep.textContent = m.replyTo.text || "media";
      rep.title = "Reply to message";
      b.appendChild(rep);
    }

    if (m.isDeleted) {
      b.textContent =
        m.senderId === myId
          ? "You deleted this message"
          : "This message was deleted";
      b.className += " italic text-gray-400";
    } else if (m.mediaUrl || m.image) {
      const mediaUrl = m.mediaUrl || m.image;
      const mediaType = m.mediaType || (m.image ? "image/*" : "");
      if (mediaType.startsWith("video/")) {
        const video = document.createElement("video");
        video.src = mediaUrl;
        video.controls = true;
        video.playsInline = true;
        video.preload = "metadata";
        video.className = "max-w-xs max-h-80 rounded mb-1";
        b.appendChild(video);
      } else if (mediaType.startsWith("audio/")) {
        const audio = document.createElement("audio");
        audio.src = mediaUrl;
        audio.controls = true;
        audio.preload = "metadata";
        audio.className = "w-full max-w-xs mb-1";
        b.appendChild(audio);
      } else {
        const img = document.createElement("img");
        img.src = mediaUrl;
        img.className = "max-w-xs rounded mb-1 cursor-pointer";
        img.loading = "lazy";
        img.decoding = "async";
        img.onclick = e => {
          e.stopPropagation();
          if (selectMode) { toggleMessageSelect(m.id); return; }
          $("previewImg").src = mediaUrl;
          $("previewImg").classList.remove("hidden");
          $("previewVideo").classList.add("hidden");
          $("previewAudio").classList.add("hidden");
          $("downloadBtn").href = mediaUrl;
          $("downloadBtn").download = m.fileName || "image";
          $("mediaModal").classList.remove("hidden");
        };
        b.appendChild(img);
      }
      if (m.text) {
        const txt = document.createElement("p");
        txt.textContent = m.text;
        b.appendChild(txt);
      }
    } else {
      const txt = document.createElement("div");
      txt.replaceChildren(linkifyText(m.text || ""));
      b.appendChild(txt);
    }

    const f = document.createElement("small");
    f.className =
      "inline-flex items-center gap-1 text-gray-500 ml-2 align-baseline whitespace-nowrap text-[10px]";

    const time = Number(m.timestamp);
    const timeText = Number.isFinite(time) && time > 0
      ? new Date(time).toLocaleTimeString("en-US", {
          hour: "numeric",
          minute: "2-digit",
          hour12: true
        })
      : "";

    f.innerHTML =
      timeText +
      (m.senderId === myId
        ? " " +
          (m.status === "read"
            ? "<span class='text-blue-600'>✓✓</span>"
            : m.status === "delivered"
            ? "✓✓"
            : "✓")
        : "");

    if (m.image && !m.text) {
      b.append(f);
    } else {
      const last = b.lastElementChild;
      if (last) last.appendChild(f);
      else b.append(f);
    }

    if (m.reactions && Object.keys(m.reactions).length && !m.isDeleted) {
      const groups = {};
      for (const uid_ in m.reactions) {
        const em = m.reactions[uid_];
        (groups[em] = groups[em] || []).push(uid_);
      }
      const row = document.createElement("div");
      row.className = "absolute -bottom-3 right-2 flex gap-1";
      Object.entries(groups).forEach(([em, uids]) => {
        const pill = document.createElement("button");
        pill.type = "button";
        pill.className =
          "bg-white border rounded-full px-1.5 text-[11px] shadow flex items-center gap-0.5" +
          (uids.includes(myId) ? " border-teal-600" : " border-gray-200");
        pill.textContent = em + (uids.length > 1 ? " " + uids.length : "");
        pill.onclick = e => {
          e.stopPropagation();
          toggleReaction(m, em);
        };
        row.appendChild(pill);
      });
      b.appendChild(row);
    }

    const check = document.createElement("span");
    check.className = "msg-check" + (isPicked ? " checked" : "");
    check.setAttribute("aria-hidden", "true");
    b.appendChild(check);

    attachHeartDoubleTap(b, m);

    let sx = 0, sy = 0;
    b.ontouchstart = e => {
      if (!e.touches[0]) return;
      sx = e.touches[0].clientX;
      sy = e.touches[0].clientY;
    };

    b.ontouchend = e => {
      if (selectMode) return;
      if (!e.changedTouches[0]) return;
      const dx = e.changedTouches[0].clientX - sx;
      const dy = e.changedTouches[0].clientY - sy;

      if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy)) {
        e.preventDefault();
        e.stopPropagation();
        showReplyBubble(m);
        b.dataset.swipeReply = "1";
        setTimeout(() => delete b.dataset.swipeReply, 350);
      }
    };

    // Normal tap does nothing. Message actions open only on long-press.
    let longPressTimer = null;
    let longPressTriggered = false;
    let pressStartX = 0, pressStartY = 0;

    const openMessageActions = () => {
      selected = m;
      $("actions").classList.remove("hidden");
      $("deleteAll").classList.toggle("hidden", m.senderId !== myId || m.isDeleted);
      $("edit").classList.toggle("hidden", !(m.senderId === myId && !m.isDeleted && !m.image));
    };

    const cancelLongPress = () => {
      if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
    };

    b.addEventListener("pointerdown", e => {
      if (selectMode) return;
      if (e.target.closest("a, img, button")) return;
      longPressTriggered = false;
      pressStartX = e.clientX; pressStartY = e.clientY;
      cancelLongPress();
      longPressTimer = setTimeout(() => {
        longPressTimer = null;
        longPressTriggered = true;
        if (navigator.vibrate) navigator.vibrate(30);
        openMessageActions();
      }, 550);
    });

    b.addEventListener("pointermove", e => {
      if (Math.hypot(e.clientX - pressStartX, e.clientY - pressStartY) > 12) cancelLongPress();
    });
    b.addEventListener("pointerup", e => {
      cancelLongPress();
      if (longPressTriggered) { e.preventDefault(); e.stopPropagation(); }
    });
    b.addEventListener("pointercancel", cancelLongPress);
    b.addEventListener("contextmenu", e => { e.preventDefault(); e.stopPropagation(); });

    b.onclick = e => {
      if (selectMode) {
        e.preventDefault();
        e.stopPropagation();
        toggleMessageSelect(m.id);
        return;
      }
      if (e.target.closest("a, img, button")) return;
      if (b.dataset.swipeReply === "1" || longPressTriggered) {
        longPressTriggered = false;
        return;
      }
    };

    r.append(b);
    frag.append(r);

    // Mark only received, visible messages as read.
    if (
      m.senderId !== myId &&
      m.status !== "read" &&
      !m.isDeleted
    ) {
      toMarkRead.push(m.id);
    }
  });

  box.replaceChildren(frag);

  // One batched write for every newly-read message instead of a separate
  // round-trip per message — fewer writes means fewer follow-up snapshot
  // events, which means less redundant re-rendering and a snappier feel.
  if (toMarkRead.length) {
    const batch = writeBatch(db);
    toMarkRead.forEach(id => batch.update(doc(C("chat_" + room), id), { status: "read" }));
    batch.commit().catch(() => {});
  }

  // Keep the newest message visible. Android's keyboard changes the
  // visual viewport, so anchor to the real bottom after the DOM is painted.
  if ((wasNearBottom || box.scrollTop === 0) && !suppressBottomScroll) {
    requestAnimationFrame(() => {
      box.scrollTop = box.scrollHeight;
      requestAnimationFrame(() => { box.scrollTop = box.scrollHeight; });
    });
  }
}

async function loadOlderMessages() {
  if (loadingOlder || noMoreOlder || !room || earliestLoadedTs == null) return;
  loadingOlder = true;
  const emptySnap = { docs: [], forEach: () => {} };
  render(lastLiveSnap || emptySnap); // repaint the button as "Loading…"
  try {
    const snap = await getDocs(
      query(C("chat_" + room), orderBy("timestamp", "desc"), startAfter(earliestLoadedTs), limit(PAGE_SIZE))
    );
    snap.forEach(d => olderMessages.set(d.id, { id: d.id, ...d.data() }));
    if (snap.size < PAGE_SIZE) noMoreOlder = true;
  } catch (e) {
    console.error("Loading older messages failed", e);
    alert("Could not load older messages. Check your internet connection.");
  } finally {
    loadingOlder = false;
    const box = $("messages");
    const prevScrollHeight = box.scrollHeight;
    const prevScrollTop = box.scrollTop;
    suppressBottomScroll = true;
    render(lastLiveSnap || emptySnap);
    requestAnimationFrame(() => {
      // Keep whatever the user was reading in view instead of snapping
      // to the bottom now that older messages were inserted above it.
      box.scrollTop = prevScrollTop + (box.scrollHeight - prevScrollHeight);
      suppressBottomScroll = false;
    });
  }
}

function focusReplyInput() {
  const input = $("message");
  if (!input || !replyFocusLock) return;
  input.classList.add("reply-lock");
  input.focus({ preventScroll: true });
  // A second focus attempt helps on mobile browsers after a touch event.
  clearTimeout(replyFocusTimer);
  replyFocusTimer = setTimeout(() => {
    if (replyFocusLock && document.activeElement !== input) input.focus({ preventScroll: true });
  }, 60);
}

function showReplyBubble(message) {
  replyTo = message;
  $("replyText").textContent = message.text || "media";
  $("replyBox").classList.remove("hidden");
  replyFocusLock = true;
  focusReplyInput();
}

function toggleReaction(m, emoji) {
  if (!room || !myId) return;
  const current = m.reactions?.[myId];
  const value = current === emoji ? deleteField() : emoji;
  updateDoc(doc(C("chat_" + room), m.id), { ["reactions." + myId]: value }).catch(e => {
    console.error("Reaction failed", e);
  });
}

function hideReplyBubble() {
  replyFocusLock = false;
  clearTimeout(replyFocusTimer);
  replyFocusTimer = null;
  replyTo = null;
  $("replyBox").classList.add("hidden");
  $("message").classList.remove("reply-lock");
}

async function send(imgData = null) {
  const i = $("message"), text = i.value.trim();
  if ((!text && !imgData) || !uid || !room) return;

  // Capture the reply BEFORE clearing replyTo. Otherwise hideReplyBubble()
  // removes replyTo and the sent message loses its quoted/reply reference.
  const reply = replyTo ? { id: replyTo.id, text: replyTo.text || "media" } : null;

  // Clear the composer immediately so sending never leaves the typed text
  // stuck in the input while Firestore is saving.
  i.value = "";
  if (reply) hideReplyBubble();
  requestAnimationFrame(() => i.focus({ preventScroll: true }));
  updateSendState();

  const now = Date.now();
  try {
    if (editing) {
      const editId = editing.id;
      editing = null;

      // Keep the UI responsive while the edit is saved.
      updateDoc(doc(C("chat_" + room), editId), { text, isEdited: true })
        .catch(e => {
          console.error("Message edit failed", e);
          alert("Message edit failed. Check your internet connection.");
        });
      return;
    }

    const id = "msg_" + now + "_" + Math.random().toString(36).slice(2, 8);
    const d = {
      text: text || "",
      senderId: myId,
      timestamp: now,
      status: "sent",
      deletedFor: [],
      isDeleted: false
    };
    if (imgData) d.image = imgData;
    // Keep the quoted message INSIDE the sent bubble permanently.
    if (reply) d.replyTo = reply;

    localMessages.set(id, { id, ...d });

    // Let the cleared textarea paint first, then update the message list.
    requestAnimationFrame(() => {
      render({ docs: [], forEach: cb => localMessages.forEach(cb) });
      requestAnimationFrame(() => {
        const box = $("messages");
        box.scrollTop = box.scrollHeight;
      });
    });

    // Fire-and-forget: UI is not blocked by Firestore round-trip.
    setDoc(doc(C("chat_" + room), id), d).then(() => {
      localMessages.delete(id);
    }).catch(e => {
      console.error("Message send failed", e);
      const m = localMessages.get(id);
      if (m) m.sendError = true;
      render({ docs: [], forEach: cb => localMessages.forEach(cb) });
      alert("Message send failed. Check your internet connection.");
    });
  } catch (e) {
    fail("Message send failed", e);
  }
}

// Formats a raw lastSeen timestamp into an exact, human-readable line
// like WhatsApp's "last seen today at 6:42 PM" instead of a bare "Offline".
function formatLastSeen(ts) {
  const t = Number(ts);
  if (!t || !Number.isFinite(t) || t <= 0) return "Offline";

  const now = Date.now();
  const diffSec = Math.floor((now - t) / 1000);
  if (diffSec < 45) return "last seen just now";

  const d = new Date(t);
  const timeStr = d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit", hour12: true });
  const today = new Date().toDateString();
  const yesterday = new Date(now - 86400000).toDateString();

  if (d.toDateString() === today) return "last seen today at " + timeStr;
  if (d.toDateString() === yesterday) return "last seen yesterday at " + timeStr;

  const sameYear = d.getFullYear() === new Date().getFullYear();
  const dateStr = d.toLocaleDateString("en-US", sameYear
    ? { day: "numeric", month: "short" }
    : { day: "numeric", month: "short", year: "numeric" });
  return "last seen on " + dateStr + " at " + timeStr;
}

let lastPartnerPresence = null;
let lastSeenRefreshTimer = null;
function renderPresence() {
  const d = lastPartnerPresence;
  const isTyping = d && d.typing && Date.now() - Number(d.typingAt || 0) < 3000;
  const isOnline = d && d.online && Date.now() - Number(d.lastSeen || 0) < 15000;
  $("statusText").textContent = isTyping ? "typing…" : isOnline ? "Online" : formatLastSeen(d && d.lastSeen);
  $("statusDot").className = isTyping ? "typing" : isOnline ? "online" : "";
}

function presence() {
  const write = () => setDoc(D("presence", myId), { online: true, lastSeen: Date.now(), uid }, { merge: true }).catch(console.warn);
  write();
  presenceTimer = setInterval(write, 5000);
  unPresence = onSnapshot(D("presence", partnerId), s => {
    lastPartnerPresence = s.data() || null;
    renderPresence();
  });
  // Re-render every 20s so a static timestamp still counts up naturally
  // (e.g. "just now" turning into "last seen today at 6:42 PM") without
  // needing a new Firestore update from the partner.
  clearInterval(lastSeenRefreshTimer);
  lastSeenRefreshTimer = setInterval(renderPresence, 20000);
}

let typingClearTimer = null;
let typingIsOn = false;
function setTyping(isTyping) {
  if (isTyping === typingIsOn) {
    // Still typing: refresh typingAt so the partner's 3s window doesn't expire.
    if (isTyping) setDoc(D("presence", myId), { typing: true, typingAt: Date.now() }, { merge: true }).catch(() => {});
    return;
  }
  typingIsOn = isTyping;
  setDoc(D("presence", myId), { typing: isTyping, typingAt: Date.now() }, { merge: true }).catch(() => {});
}
function updateSendState() {
  $("send").disabled = !$("message").value.trim() && !editing;
}
$("message").addEventListener("input", () => {
  updateSendState();
  if (!uid || !room) return;
  setTyping(true);
  clearTimeout(typingClearTimer);
  typingClearTimer = setTimeout(() => setTyping(false), 1800);
});
updateSendState();

function setup() {
  myId = $("myId").value.trim().toLowerCase();
  partnerId = $("partnerId").value.trim().toLowerCase();
  if (!valid(myId) || !valid(partnerId) || myId === partnerId) return alert("Valid, different IDs enter karein.");
  localStorage.setItem("whatsapp_my_id", myId);
  room = [myId, partnerId].sort().join("_");
  $("partnerName").textContent = cap(partnerId);
  login.classList.add("hidden");
  chat.classList.remove("hidden");

  // Restore this ID's profile photo: instantly from the local cache, then
  // reconcile against Firestore (the source of truth) so the same ID on a
  // different browser/device converges on the same photo.
  const cachedDp = localStorage.getItem("chat-dp-" + myId);
  if (cachedDp) {
    $("partnerDp").src = cachedDp;
    $("partnerDp").classList.remove("hidden");
    $("dpPlaceholder").classList.add("hidden");
  } else {
    $("partnerDp").classList.add("hidden");
    $("dpPlaceholder").classList.remove("hidden");
  }
  getDoc(D("presence", myId)).then(snap => {
    const dp = snap.data()?.dp;
    if (dp && dp !== cachedDp) {
      $("partnerDp").src = dp;
      $("partnerDp").classList.remove("hidden");
      $("dpPlaceholder").classList.add("hidden");
      localStorage.setItem("chat-dp-" + myId, dp);
    }
  }).catch(() => {});

  unChat = onSnapshot(
    query(C("chat_" + room), orderBy("timestamp", "desc"), limit(PAGE_SIZE)),
    snap => {
      console.log("Chat sync:", snap.size, "messages loaded (live window)");
      lastLiveSnap = snap;
      // If the very first sync already comes back under a full page, the
      // whole history fits in this window — no older page will ever exist.
      if (!noMoreOlder && olderMessages.size === 0 && snap.size < PAGE_SIZE) noMoreOlder = true;
      render(snap);
    },
    e => {
      console.error("Chat sync failed:", e);
      fail("Chat sync failed", e);
    }
  );
  presence();
  listenIncoming();
}

function listenIncoming() {
  unIncoming?.();
  unIncoming = onSnapshot(D("active_calls", myId), s => {
    const d = s.data();
    if (d && d.caller && Date.now() - Number(d.timestamp || 0) < 30000) {
      pending = d;
      $("caller").textContent = cap(d.caller) + (d.type === "video" ? " is video calling" : " is calling");
      setCallAvatar($("callerAvatarImg"), $("callerAvatarInitial"), d.caller);
      if (incoming.classList.contains("hidden")) startRing("in");
      incoming.classList.remove("hidden");
    } else {
      // Caller cancelled / call timed out: return immediately to inbox.
      pending = null;
      stopRing();
      incoming.classList.add("hidden");
      if (call.classList.contains("hidden")) chat.classList.remove("hidden");
    }
  }, e => console.warn("Incoming call listener error:", e));
}

// WebRTC configuration.
// STUN only discovers a public address; it does NOT work when both sides
// sit behind "symmetric"/carrier-grade NAT (very common on mobile data and
// many home routers) — that's exactly why this worked on the same Wi-Fi but
// failed across networks. A TURN server relays the media in that case, so
// it's included below (Open Relay Project's free public TURN service) with
// both UDP and a TCP/443 fallback for networks that block UDP entirely.
// Several independent STUN servers are listed too — if one is briefly
// unreachable/rate-limited the others still let candidate gathering finish.
// For heavier day-to-day use, swap these for your own TURN server (coturn,
// Metered, Twilio, Cloudflare Calls) — free public relays are rate-limited
// and can go down; the app also copes with that at runtime (see
// attemptHardReconnect below), but a paid TURN server is more reliable.
const rtc = {
  iceServers: [
    { urls: "stun:stun.l.google.com:19302" },
    { urls: "stun:stun1.l.google.com:19302" },
    { urls: "stun:stun2.l.google.com:19302" },
    { urls: "stun:global.stun.twilio.com:3478" },
    { urls: "stun:openrelay.metered.ca:80" },
    { urls: "turn:openrelay.metered.ca:80", username: "openrelayproject", credential: "openrelayproject" },
    { urls: "turn:openrelay.metered.ca:443", username: "openrelayproject", credential: "openrelayproject" },
    // TCP-over-443 relay — gets through networks/firewalls that block plain UDP.
    { urls: "turn:openrelay.metered.ca:443?transport=tcp", username: "openrelayproject", credential: "openrelayproject" }
  ],
  iceCandidatePoolSize: 10
};

let unAnswer = null;
let unCandidates = null;
let unCallState = null;
let callEnded = false;

// --- Auto-reconnect (ICE restart) state ---
// When a call's network path breaks mid-call (phone switches from Wi-Fi to
// mobile data, a network hiccups, etc.), WebRTC can often recover in place
// instead of the call just dying — this is what drives that recovery.
let amCaller = false;
let restartInProgress = false;
let iceFailTimer = null;
let mySeq = 0;
let lastAppliedRestartSeq = 0;
let lastAppliedAnswerSeq = 0;
// Tracks whether this call has already escalated to a relay-only (TURN-forced)
// reconnect attempt, so it's only ever tried once per call (see
// attemptHardReconnect / watchCallState below).
let hardReconnectDone = false;
let calleeHardened = false;
let localHiddenMessages = new Set(JSON.parse(localStorage.getItem("hiddenMessages") || "[]"));
let localMessages = new Map();
let seenMessageIds = new Set();
let unreadCount = 0;
let renderedOnce = false;
function updateUnreadBadge() {
  const badge = $("unreadBadge");
  if (unreadCount > 0) {
    badge.textContent = unreadCount > 99 ? "99+" : String(unreadCount);
    badge.classList.remove("hidden");
  } else {
    badge.classList.add("hidden");
  }
}
let callConnectedAt = 0;
let callDurationTimer = null;

// --- Soft notification sound for incoming messages (WebAudio, no assets needed) ---
let notifyAudioCtx = null;
function playNotifySound() {
  try {
    notifyAudioCtx = notifyAudioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (notifyAudioCtx.state === "suspended") notifyAudioCtx.resume().catch(() => {});
    const t0 = notifyAudioCtx.currentTime;
    [880, 1180].forEach((freq, i) => {
      const osc = notifyAudioCtx.createOscillator();
      const gain = notifyAudioCtx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, t0 + i * 0.09);
      gain.gain.linearRampToValueAtTime(0.14, t0 + i * 0.09 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, t0 + i * 0.09 + 0.24);
      osc.connect(gain).connect(notifyAudioCtx.destination);
      osc.start(t0 + i * 0.09);
      osc.stop(t0 + i * 0.09 + 0.26);
    });
  } catch (e) { /* audio not available; ignore silently */ }
}

// --- Ringtone (incoming) / ringback (outgoing) tone with optional vibration ---
let ringCtx = null;
let ringTimer = null;
function playRingChime(kind) {
  try {
    ringCtx = ringCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (ringCtx.state === "suspended") ringCtx.resume().catch(() => {});
    const t0 = ringCtx.currentTime;
    const freqs = kind === "back" ? [440, 494] : [523.25, 659.25];
    freqs.forEach((freq, i) => {
      const osc = ringCtx.createOscillator();
      const gain = ringCtx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      const start = t0 + i * 0.25;
      const peak = kind === "back" ? 0.10 : 0.16;
      gain.gain.setValueAtTime(0, start);
      gain.gain.linearRampToValueAtTime(peak, start + 0.05);
      gain.gain.setValueAtTime(peak, start + 0.4);
      gain.gain.linearRampToValueAtTime(0, start + 0.5);
      osc.connect(gain).connect(ringCtx.destination);
      osc.start(start);
      osc.stop(start + 0.55);
    });
    if (kind === "in" && navigator.vibrate) { try { navigator.vibrate([450, 250]); } catch {} }
  } catch (e) { /* audio not available; ignore silently */ }
}
function startRing(kind) {
  stopRing();
  playRingChime(kind);
  ringTimer = setInterval(() => playRingChime(kind), kind === "back" ? 2600 : 2000);
}
function stopRing() {
  clearInterval(ringTimer);
  ringTimer = null;
  if (navigator.vibrate) { try { navigator.vibrate(0); } catch {} }
}

// --- Show partner's saved display photo (if any) or their initial in call avatars ---

// --- Subtle ripple feedback on tappable controls ---
document.addEventListener("pointerdown", e => {
  const el = e.target.closest("button");
  if (!el || el.disabled) return;
  const rect = el.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height);
  const ripple = document.createElement("span");
  ripple.className = "rui-ripple";
  ripple.style.width = ripple.style.height = size + "px";
  ripple.style.left = (e.clientX - rect.left - size / 2) + "px";
  ripple.style.top = (e.clientY - rect.top - size / 2) + "px";
  const prevPosition = getComputedStyle(el).position;
  if (prevPosition === "static") el.style.position = "relative";
  el.style.overflow = el.style.overflow || "hidden";
  el.appendChild(ripple);
  setTimeout(() => ripple.remove(), 550);
}, { passive: true });

// --- Double-tap a message bubble for a quick ❤️ reaction ---
function attachHeartDoubleTap(bubbleEl, message) {

  });
}

function showCallError(title, e) {
  console.error(title, e);
  $("callState").textContent = title;
  alert(title + (e?.message ? "\n\n" + e.message : ""));
}

function cleanupCallListeners() {
  try { unAnswer?.(); } catch {}
  try { unCandidates?.(); } catch {}
  try { unCallState?.(); } catch {}
  unAnswer = null;
  unCandidates = null;
  unCallState = null;
}

function watchCallState() {
  if (!callId) return;
  unCallState?.();
  unCallState = onSnapshot(D("call_state", callId), snap => {
    const d = snap.data();

    // Both peers watch the same call-state document. If either side ends
    // or rejects the call, both sides immediately return to the chat screen.
    if (!d || d.ended || d.status === "rejected" || d.status === "cancelled") {
      if (!callEnded) {
        callEnded = true;
        reset();
      }
      return;
    }

    if (d.connectedAt && !callConnectedAt) {
      startCallTimer(d.connectedAt);
      stopRing();
      $("callAvatarWrap").classList.add("connected");
    }

    // --- ICE restart handshake, riding on this same document ---
    // The caller writes a fresh "restart offer" when the connection drops;
    // the callee answers it here, and the caller applies that answer below.
    if (!amCaller && pc && d.restartOffer && d.restartSeq && d.restartSeq !== lastAppliedRestartSeq) {
      lastAppliedRestartSeq = d.restartSeq;
      (async () => {
        try {
          if (d.restartRelay && !calleeHardened && stream) {
            // The caller escalated to a relay-only reconnect — rebuild this
            // side's connection the same way so both ends agree on a
            // TURN-relayed path instead of retrying the direct/STUN path
            // that already failed.
            calleeHardened = true;
            try { pc.close(); } catch {}
            pc = peer(false, { relayOnly: true });
          }
          await pc.setRemoteDescription(d.restartOffer);
          await addQueuedCandidates();
          const answer = await pc.createAnswer();
          await pc.setLocalDescription(answer);
          await setDoc(D("call_state", callId), {
            restartAnswer: { type: answer.type, sdp: answer.sdp },
            restartAnswerSeq: d.restartSeq
          }, { merge: true });
        } catch (e) {
          console.warn("Applying reconnect offer failed:", e);
        }
      })();
    }
    if (amCaller && pc && d.restartAnswer && d.restartAnswerSeq === mySeq && d.restartAnswerSeq !== lastAppliedAnswerSeq) {
      lastAppliedAnswerSeq = d.restartAnswerSeq;
      pc.setRemoteDescription(d.restartAnswer).catch(e => console.warn("Applying reconnect answer failed:", e));
    }
  }, e => console.warn("Call state listener error:", e));
}

// Tries to heal a call whose network path broke, instead of just letting it
// die. Only the caller side initiates (mirrors the original offer/answer
// roles); the callee reacts to it inside watchCallState above.
async function attemptIceRestart() {
  if (!pc || !callId || callEnded || restartInProgress || !amCaller) return;
  restartInProgress = true;
  try {
    const offer = await pc.createOffer({ iceRestart: true });
    await pc.setLocalDescription(offer);
    mySeq++;
    await setDoc(D("call_state", callId), {
      restartOffer: { type: offer.type, sdp: offer.sdp },
      restartSeq: mySeq
    }, { merge: true });
  } catch (e) {
    console.warn("ICE restart attempt failed:", e);
  } finally {
    restartInProgress = false;
  }
}

// A plain ICE restart re-tries the same (direct/STUN) path and often isn't
// enough on its own when one side is behind a symmetric NAT or a strict
// firewall — the classic "works on the same Wi-Fi, fails a bit further
// away" symptom. This rebuilds the whole peer connection forced to route
// everything through the TURN relay instead, and asks the other side (via
// the same call_state document) to rebuild its side the same way, so both
// ends agree on a relay-only path that gets through almost any network.
async function attemptHardReconnect() {
  if (!pc || !callId || callEnded || !amCaller || hardReconnectDone || !stream) return;
  hardReconnectDone = true;
  try {
    console.log("Escalating to a relay-only (TURN-forced) reconnect…");
    try { pc.close(); } catch {}
    pc = peer(true, { relayOnly: true });
    const offer = await pc.createOffer({
      iceRestart: true,
      offerToReceiveAudio: true,
      offerToReceiveVideo: callStartedVideo
    });
    await pc.setLocalDescription(offer);
    mySeq++;
    await setDoc(D("call_state", callId), {
      restartOffer: { type: offer.type, sdp: offer.sdp },
      restartSeq: mySeq,
      restartRelay: true
    }, { merge: true });
  } catch (e) {
    console.warn("Relay-only reconnect failed:", e);
  }
}

async function finishCall(status = "ended") {
  const id = callId;
  const other = partnerId;
  callEnded = true;

  if (id) {
    await setDoc(D("call_state", id), {
      ended: true,
      status,
      endedBy: myId,
      endedAt: Date.now()
    }, { merge: true }).catch(() => {});

    if (other) {
      await deleteDoc(D("active_calls", other)).catch(() => {});
    }
  }

  // Allow the other peer to receive the state before removing the document.
  setTimeout(() => {
    if (id) deleteDoc(D("call_state", id)).catch(() => {});
  }, 2000);

  reset();
}

async function playRemoteAudio() {
  const remote = $("remote");
  remote.muted = false;
  remote.volume = 1;
  try {
    await remote.play();
  } catch (e) {
    console.warn("Remote media autoplay was blocked:", e);
    $("callState").textContent = "Tap Speaker to enable audio";
  }
}

function formatCallDuration(ms) {
  const total = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(total / 3600);
  const m = Math.floor((total % 3600) / 60);
  const sec = total % 60;
  return h > 0
    ? String(h).padStart(2,"0") + ":" + String(m).padStart(2,"0") + ":" + String(sec).padStart(2,"0")
    : String(m).padStart(2,"0") + ":" + String(sec).padStart(2,"0");
}
function startCallTimer(startAt) {
  callConnectedAt = Number(startAt) || Date.now();
  $("callDuration").classList.remove("hidden");
  clearInterval(callDurationTimer);
  const tick = () => $("callDuration").textContent = "Duration " + formatCallDuration(Date.now() - callConnectedAt);
  tick();
  callDurationTimer = setInterval(tick, 1000);
}
function stopCallTimer() {
  clearInterval(callDurationTimer);
  callDurationTimer = null;
  callConnectedAt = 0;
  $("callDuration").textContent = "";
  $("callDuration").classList.add("hidden");
}

function reset() {
  releaseCallWakeLock();
  stopCallTimer();
  stopRing();
  callEnded = true;
  cleanupCallListeners();
  try { pc?.close(); } catch {}
  try { stream?.getTracks().forEach(t => t.stop()); } catch {}
  pc = null;
  stream = null;
  pending = null;
  queued = [];
  amCaller = false;
  restartInProgress = false;
  clearTimeout(iceFailTimer);
  iceFailTimer = null;
  mySeq = 0;
  lastAppliedRestartSeq = 0;
  lastAppliedAnswerSeq = 0;
  hardReconnectDone = false;
  calleeHardened = false;
  $("remote").srcObject = null;
  $("local").srcObject = null;
  $("mute").querySelector(".callctrl-label").textContent = "Mute";
  $("mute").classList.remove("active");
  $("toggleVideo").querySelector(".callctrl-label").textContent = "Video";
  $("toggleVideo").classList.remove("active");
  $("speaker").querySelector(".callctrl-label").textContent = "Speaker On";
  $("speaker").classList.remove("active");
  $("callAvatarWrap").classList.remove("connected");
  call.classList.remove("swapped");
  localIsSwapped = false;
  speakerOn = true;
  incoming.classList.add("hidden");
  call.classList.add("hidden");
  chat.classList.remove("hidden");
}

function peer(caller, opts = {}) {
  // relayOnly forces every candidate through the TURN relay — used by
  // attemptHardReconnect() when the normal (direct/STUN) path can't get
  // through a symmetric NAT or strict firewall on one side's network.
  const cfg = opts.relayOnly ? { ...rtc, iceTransportPolicy: "relay" } : rtc;
  pc = new RTCPeerConnection(cfg);
  amCaller = !!caller;

  if (stream) {
    stream.getTracks().forEach(t => pc.addTrack(t, stream));
  }

  // On a shaky/long-distance connection, let WebRTC trade resolution for a
  // smoother, less stuttery picture rather than holding resolution and
  // freezing — much more watchable on weak mobile networks. The bitrate cap
  // below adds to that: an uncapped encoder will try to push far more data
  // than a long-distance/relay path can carry, which is what stalls or
  // freezes video calls that go through several network hops. Capping it
  // (lower still on a detected slow connection) keeps the stream smooth
  // instead of fighting the network for bandwidth.
  const videoSender = pc.getSenders().find(s => s.track?.kind === "video");
  if (videoSender) {
    const params = videoSender.getParameters();
    params.degradationPreference = "balanced";
    if (!params.encodings || !params.encodings.length) params.encodings = [{}];
    const conn = navigator.connection || navigator.webkitConnection || navigator.mozConnection;
    const slow = !!conn && ["slow-2g", "2g", "3g"].includes(conn.effectiveType || "");
    params.encodings[0].maxBitrate = slow ? 300000 : opts.relayOnly ? 900000 : 1500000;
    videoSender.setParameters(params).catch(() => {});
  }

  // Audio is far cheaper than video and matters more when bandwidth is
  // tight — if it has to choose, the network should starve the picture
  // before it starts cutting out speech.
  const audioSender = pc.getSenders().find(s => s.track?.kind === "audio");
  if (audioSender) {
    const aparams = audioSender.getParameters();
    if (!aparams.encodings || !aparams.encodings.length) aparams.encodings = [{}];
    aparams.encodings[0].priority = "high";
    aparams.encodings[0].networkPriority = "high";
    audioSender.setParameters(aparams).catch(() => {});
  }

  let remoteStream = null;

  pc.ontrack = async e => {
    if (!remoteStream) remoteStream = e.streams?.[0] || new MediaStream();

    if (!e.streams?.[0]) {
      const exists = remoteStream.getTracks().some(t => t.id === e.track.id);
      if (!exists) remoteStream.addTrack(e.track);
    }

    $("remote").srcObject = remoteStream;
    $("remote").muted = false;
    $("remote").volume = 1;
    $("callState").textContent = "Connected";
    if (!callConnectedAt) startCallTimer(Date.now());

    try {
      await $("remote").play();
    } catch (err) {
      console.warn("Remote media autoplay was blocked:", err);
      $("callState").textContent = "Tap Speaker to enable audio";
    }
  };

  pc.onicecandidate = e => {
    if (!e.candidate || !callId) return;
    // Every ICE candidate needs its own document. Reusing one owner
    // document overwrites earlier candidates and can break audio.
    const owner = myId;
    addDoc(
      collection(db, "artifacts", A, "public", "data", "call_candidates", callId, owner),
      e.candidate.toJSON()
    ).catch(console.warn);
  };

  pc.onconnectionstatechange = () => {
    const state = pc?.connectionState;
    if (state === "connected") {
      $("callState").textContent = "Connected";
      stopRing();
      clearTimeout(iceFailTimer);
      iceFailTimer = null;
      $("callAvatarWrap").classList.add("connected");
      if (!callConnectedAt) {
        startCallTimer(Date.now());
        setDoc(D("call_state", callId), { connectedAt: callConnectedAt }, { merge: true }).catch(console.warn);
      }
    } else if (state === "connecting") $("callState").textContent = "Connecting…";
    else if (state === "disconnected") $("callState").textContent = "Reconnecting…";
    else if (state === "failed") $("callState").textContent = "Reconnecting…";
    else if (state === "closed") $("callState").textContent = "Call ended";
  };

  pc.oniceconnectionstatechange = async () => {
    const state = pc?.iceConnectionState;
    console.log("ICE state:", state);
    if (state === "checking") $("callState").textContent = "Connecting…";
    else if (state === "connected" || state === "completed") {
      $("callState").textContent = "Connected";
      stopRing();
      clearTimeout(iceFailTimer);
      iceFailTimer = null;
      $("callAvatarWrap").classList.add("connected");
      await playRemoteAudio();
    } else if (state === "disconnected") {
      // "disconnected" often self-heals within a few seconds (a brief Wi-Fi
      // blip, a network switch) — give it a moment before actively
      // restarting ICE, and give up on the call only if it never recovers.
      $("callState").textContent = "Reconnecting…";
      clearTimeout(iceFailTimer);
      iceFailTimer = setTimeout(() => {
        if (pc && pc.iceConnectionState !== "connected" && pc.iceConnectionState !== "completed") {
          attemptIceRestart();
        }
      }, 3000);
    } else if (state === "failed") {
      $("callState").textContent = "Reconnecting…";
      attemptIceRestart();
      // If a plain ICE restart hasn't recovered things after a few seconds,
      // escalate once to a relay-only (TURN-forced) reconnect — that's what
      // rescues calls across networks a normal STUN path can't cross
      // (symmetric NAT, strict mobile/office firewalls). Only give up on
      // the call after that has also had a chance to work.
      clearTimeout(iceFailTimer);
      iceFailTimer = setTimeout(() => {
        if (!pc || pc.iceConnectionState === "connected" || pc.iceConnectionState === "completed" || callEnded) return;
        if (amCaller && !hardReconnectDone) {
          attemptHardReconnect();
          clearTimeout(iceFailTimer);
          iceFailTimer = setTimeout(() => {
            if (pc && pc.iceConnectionState !== "connected" && pc.iceConnectionState !== "completed" && !callEnded) {
              $("callState").textContent = "Call failed — check your connection";
              finishCall("failed");
            }
          }, 10000);
        } else if (amCaller) {
          $("callState").textContent = "Call failed — check your connection";
          finishCall("failed");
        }
        // The callee doesn't give up on its own here — it waits for the
        // caller's relay-only offer (applied above in watchCallState) or
        // for the caller to end the call.
      }, 8000);
    }
  };

  return pc;
}

async function addQueuedCandidates() {
  if (!pc?.remoteDescription) return;
  for (const c of queued.splice(0)) {
    try { await pc.addIceCandidate(c); } catch (e) { console.warn("ICE add failed", e); }
  }
}

function watch(owner) {
  unCandidates?.();
  unCandidates = onSnapshot(
    collection(db, "artifacts", A, "public", "data", "call_candidates", callId, owner),
    async s => {
      for (const x of s.docChanges()) {
        if (x.type !== "added" || !pc) continue;
        try {
          const c = new RTCIceCandidate(x.doc.data());
          if (pc.remoteDescription) await pc.addIceCandidate(c);
          else queued.push(c);
        } catch (e) {
          console.warn("Invalid ICE candidate:", e);
        }
      }
    },
    e => console.warn("ICE signaling error:", e)
  );
}

async function mediaStream(video) {
  if (!window.isSecureContext) {
    showCallError("Calls require HTTPS. Open this site over HTTPS.");
    return null;
  }

  if (!window.RTCPeerConnection) {
    showCallError("WebRTC is not available in this browser/WebView.");
    return null;
  }

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showCallError(
      "This browser/WebView does not allow microphone/camera access. " +
      "Please allow microphone/camera permission for this browser or app, then try again."
    );
    return null;
  }

  const audio = {
    echoCancellation: true,
    noiseSuppression: true,
    autoGainControl: true,
    channelCount: 1,
    sampleRate: { ideal: 48000 },
    sampleSize: { ideal: 16 }
  };

  const videoConstraints = {
    facingMode: { ideal: "user" },
    width: { ideal: 1280, max: 1920 },
    height: { ideal: 720, max: 1080 },
    frameRate: { ideal: 30, max: 30 }
  };

  try {
    // Ask for both tracks in one permission request for video calls.
    return await navigator.mediaDevices.getUserMedia({
      audio,
      video: video ? videoConstraints : false
    });
  } catch (e) {
    console.error("getUserMedia failed:", e);

    // Some WebViews fail on video constraints even though the microphone works.
    // For an audio call, retry with the simplest possible audio request.
    if (!video && (e?.name === "OverconstrainedError" || e?.name === "NotReadableError")) {
      try {
        return await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      } catch (e2) {
        e = e2;
      }
    }

    const name = e?.name || "";
    const msg =
      name === "NotAllowedError" || name === "PermissionDeniedError"
        ? "Microphone/Camera permission is blocked. Allow microphone/camera permission for this site in browser/app settings."
        : name === "NotFoundError"
        ? "No microphone/camera was found on this device."
        : name === "NotReadableError"
        ? "The microphone/camera is busy or cannot be opened by this WebView."
        : name === "SecurityError"
        ? "The WebView blocked microphone/camera access for security reasons."
        : name === "AbortError"
        ? "The microphone/camera request was interrupted. Try the call again."
        : "Microphone/Camera permission failed. Please allow camera and microphone access in your browser/app settings.";

    showCallError(msg, e);
    return null;
  }
}

async function start(video) {
  callStartedVideo = !!video;
  // This function must be called directly from the user's tap/click.
  // That is important because mobile browsers/WebViews may only allow
  // getUserMedia after a user gesture.
  if (!uid) {
    alert("Firebase is not connected yet.");
    return;
  }

  if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
    showCallError(
      "This WebView cannot access microphone/camera. " +
      "If the browser or app blocks the permission, JavaScript cannot bypass that restriction. " +
      "Open the same HTTPS page in Chrome for calling."
    );
    return;
  }
  if (!partnerId) {
    alert("Partner ID is missing.");
    return;
  }

  callEnded = false;
  $("callState").textContent = "Requesting permission…";

  stream = await mediaStream(video);
  if (!stream) return;

  // Re-apply browser DSP after permission is granted.
  const audioTrack = stream.getAudioTracks()[0];
  if (audioTrack?.applyConstraints) {
    audioTrack.applyConstraints({
      echoCancellation: { ideal: true },
      noiseSuppression: { ideal: true },
      autoGainControl: { ideal: true }
    }).catch(() => {});
  }

  callId = room + "_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8);

  $("local").srcObject = stream;
  $("local").classList.toggle("hidden", !video);
  $("remote").classList.toggle("hidden", !video);
  $("audioOnly").classList.toggle("hidden", video);
  $("callName").textContent = cap(partnerId);
  $("callState").textContent = "Calling…";
  stopCallTimer();
  $("speaker").querySelector(".callctrl-label").textContent = "Speaker On";
  speakerOn = true;
  setCallAvatar($("callAvatarImg"), $("callAvatarInitial"), partnerId);
  $("callAvatarWrap").classList.remove("connected");
  call.classList.remove("swapped");
  startRing("back");

  chat.classList.add("hidden");
  call.classList.remove("hidden");

  try {
    peer(true);

    const offer = await pc.createOffer({
      offerToReceiveAudio: true,
      offerToReceiveVideo: video
    });
    await pc.setLocalDescription(offer);

    await setDoc(
      D("active_calls", partnerId),
      {
        caller: myId,
        type: video ? "video" : "audio",
        offer: { type: offer.type, sdp: offer.sdp },
        callId,
        timestamp: Date.now()
      }
    );

    await setDoc(D("call_state", callId), {
      status: "ringing",
      caller: myId,
      callee: partnerId,
      createdAt: Date.now()
    }, { merge: true });
    watchCallState();

    // Keep the caller on "Ringing…" until the other side accepts.
    $("callState").textContent = "Ringing…";
    await setDoc(D("call_state", callId), {
      status: "ringing",
      caller: myId,
      callee: partnerId,
      createdAt: Date.now()
    }, { merge: true });
    watchCallState();

    unAnswer = onSnapshot(D("call_answers", callId), async s => {
      const d = s.data();
      if (!d?.answer || !pc || pc.currentRemoteDescription || callEnded) return;

      try {
        await pc.setRemoteDescription(d.answer);
        await addQueuedCandidates();
      } catch (e) {
        showCallError("Could not establish the call.", e);
      }
    });

    watch(partnerId);
  } catch (e) {
    showCallError("Could not start the call.", e);
    reset();
  }
}

async function acceptCall() {
  const d = pending;
  if (!d?.offer || !d?.callId) return;

  callEnded = false;
  callStartedVideo = d.type === "video";
  stream = await mediaStream(d.type === "video");
  if (!stream) return;

  const audioTrack = stream.getAudioTracks()[0];
  if (audioTrack?.applyConstraints) {
    audioTrack.applyConstraints({
      echoCancellation: { ideal: true },
      noiseSuppression: { ideal: true },
      autoGainControl: { ideal: true }
    }).catch(() => {});
  }

  callId = d.callId;
  partnerId = d.caller;

  $("local").srcObject = stream;
  $("local").classList.toggle("hidden", d.type !== "video");
  $("remote").classList.toggle("hidden", d.type !== "video");
  $("audioOnly").classList.toggle("hidden", d.type === "video");
  $("callName").textContent = cap(partnerId);
  $("callState").textContent = "Connecting…";
  stopCallTimer();
  $("speaker").querySelector(".callctrl-label").textContent = "Speaker On";
  speakerOn = true;
  setCallAvatar($("callAvatarImg"), $("callAvatarInitial"), partnerId);
  $("callAvatarWrap").classList.remove("connected");
  call.classList.remove("swapped");
  stopRing();

  incoming.classList.add("hidden");
  chat.classList.add("hidden");
  call.classList.remove("hidden");

  try {
    peer(false);

    await pc.setRemoteDescription(d.offer);
    await addQueuedCandidates();

    const answer = await pc.createAnswer({
      offerToReceiveAudio: true,
      offerToReceiveVideo: d.type === "video"
    });
    await pc.setLocalDescription(answer);

    await setDoc(
      D("call_answers", callId),
      { answer: { type: answer.type, sdp: answer.sdp } }
    );

    await setDoc(D("call_state", callId), { status: "answering" }, { merge: true });
    watchCallState();

    watch(d.caller);

    await deleteDoc(D("active_calls", myId)).catch(() => {});
    pending = null;
  } catch (e) {
    showCallError("Could not accept the call.", e);
    reset();
  }
}

let callTapLocked = false;
let callStartedVideo = false;
let callWakeLock = null;
let callBeforeUnloadGuard = false;


async function acquireCallWakeLock() {
  try {
    if ("wakeLock" in navigator && !callWakeLock) {
      callWakeLock = await navigator.wakeLock.request("screen");
      callWakeLock.addEventListener("release", () => { callWakeLock = null; });
    }
  } catch (e) {
    console.warn("Wake Lock unavailable:", e);
  }
}

async function releaseCallWakeLock() {
  try { await callWakeLock?.release(); } catch {}
  callWakeLock = null;
}

async function enableBackgroundCallMode() {
  if (!callId) return;

  // Keep media tracks enabled while the page is backgrounded.
  stream?.getAudioTracks().forEach(t => { t.enabled = true; });
  if (callStartedVideo) {
    stream?.getVideoTracks().forEach(t => { t.enabled = true; });
  }

  await acquireCallWakeLock();

  // If the browser supports a persistent notification, tell the user
  // that the call is still active when they leave the chat screen.
  if (document.hidden && "Notification" in window && Notification.permission === "granted") {
    try {
      new Notification("Call in progress", {
        body: "Your call is still active. Return to the app to control it.",
        tag: "secure-cloud-active-call",
        renotify: false
      });
    } catch {}
  }
}

function installBackgroundCallHandling() {
  document.addEventListener("visibilitychange", async () => {
    if (!callId || callEnded) return;

    if (document.hidden) {
      await enableBackgroundCallMode();
    } else {
      await acquireCallWakeLock();
      try { await $("remote").play(); } catch {}
    }
  });

  window.addEventListener("pagehide", () => {
    // Do NOT end an active call merely because the page becomes hidden.
    // Browser/WebView policies still decide whether WebRTC can continue.
  });

  window.addEventListener("beforeunload", e => {
    if (callId && !callEnded) {
      // Prevent accidental navigation/reload from silently destroying the call.
      e.preventDefault();
      e.returnValue = "";
    }
  });
}

// Shrinks/compresses a picked photo before it's stored, so it stays small
// enough for a Firestore field (needed to sync it — see below) and loads fast.
function resizeImageDataUrl(dataUrl, maxDim = 256) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      let { width, height } = img;
      if (width > maxDim || height > maxDim) {
        if (width > height) { height = Math.round(height * maxDim / width); width = maxDim; }
        else { width = Math.round(width * maxDim / height); height = maxDim; }
      }
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      canvas.getContext("2d").drawImage(img, 0, 0, width, height);
      resolve(canvas.toDataURL("image/jpeg", 0.82));
    };
    img.onerror = reject;
    img.src = dataUrl;
  });
}

function hexToRgb(hex) {
  hex = (hex || "#efeae2").replace("#", "");
  if (hex.length === 3) hex = hex.split("").map(c => c + c).join("");
  const num = parseInt(hex, 16) || 0;
  return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
}
// Shades a hex color toward black (negative percent) or white (positive percent).
function shade(hex, percent) {
  const { r, g, b } = hexToRgb(hex);
  const t = percent < 0 ? 0 : 255;
  const p = Math.abs(percent);
  const mix = (c) => Math.round((t - c) * p) + c;
  return `rgb(${mix(r)},${mix(g)},${mix(b)})`;
}
function isLightColor(hex) {
  const { r, g, b } = hexToRgb(hex);
  return (0.299 * r + 0.587 * g + 0.114 * b) > 170;
}

function applyTheme(name, customColor = null) {
  const themes = {
    default: "#efeae2",
    blue: "#dbeafe",
    green: "#dcfce7",
    pink: "#fce7f3",
    purple: "#f3e8ff",
    dark: "#1f2937"
  };
  const bg = customColor || themes[name] || themes.default;
  $("chat").style.background = bg;
  $("chat").dataset.theme = name || "custom";
  $("messages").style.color = name === "dark" ? "#fff" : "";

  // Give the message bubbles a premium look that matches the chosen theme,
  // instead of always staying the same fixed green/white pair.
  let bt = BUBBLE_THEMES[name];
  if (!bt) {
    // Custom background: derive a matching sent-bubble gradient from the
    // same hue (a darker and a lighter shade) rather than a hardcoded color.
    const base = customColor || themes.default;
    const light = isLightColor(base);
    bt = {
      sentFrom: shade(base, -0.32),
      sentTo: shade(base, -0.05),
      sentColor: "#ffffff",
      recvBg: light ? "#ffffff" : "#f9fafb",
      recvColor: "#1f2937",
      recvBorder: "rgba(15,23,42,.08)"
    };
  }
  const root = document.documentElement.style;
  root.setProperty("--bubble-sent-bg", `linear-gradient(135deg,${bt.sentFrom},${bt.sentTo})`);
  root.setProperty("--bubble-sent-color", bt.sentColor);
  root.setProperty("--bubble-received-bg", bt.recvBg);
  root.setProperty("--bubble-received-color", bt.recvColor);
  root.setProperty("--bubble-received-border", bt.recvBorder);

  // Header + select-bar gradient, matched to the same theme.
  let ht = HEADER_THEMES[name];
  if (!ht) {
    // Custom background: build a rich header gradient from the same hue —
    // darker for the row, darker still for the multi-select bar.
    const base = customColor || themes.default;
    ht = {
      from: shade(base, -0.62), mid: shade(base, -0.42), to: shade(base, -0.50),
      selFrom: shade(base, -0.75), selMid: shade(base, -0.42), selTo: shade(base, -0.65)
    };
  }
  root.setProperty("--header-from", ht.from);
  root.setProperty("--header-mid", ht.mid);
  root.setProperty("--header-to", ht.to);
  root.setProperty("--select-from", ht.selFrom);
  root.setProperty("--select-mid", ht.selMid);
  root.setProperty("--select-to", ht.selTo);

  // Online status dot, matched to the same theme.
  let st = STATUS_THEMES[name];
  if (!st) {
    // Custom background: a bright, saturated version of the same hue.
    const base = customColor || themes.default;
    const dot = shade(base, 0.35);
    st = { dot, glow: dot.startsWith("rgb") ? dot.replace("rgb(", "rgba(").replace(")", ",.55)") : "rgba(74,222,128,.55)" };
  }
  root.setProperty("--status-online", st.dot);
  root.setProperty("--status-online-glow", st.glow);

  localStorage.setItem("chat-theme", JSON.stringify({ name: name || "custom", color: bg }));
  // A theme sets its own background; drop any older custom wallpaper pick
  // (from the separate "Background color" option) so it can't silently
  // override the theme's background again on the next reload.
  localStorage.removeItem("chat-bg");
}

  updateSendState();
};

$("deleteMe").onclick = async () => { if (selected) await updateDoc(doc(C("chat_" + room), selected.id), { deletedFor: [...(selected.deletedFor || []), myId] }); $("actions").classList.add("hidden"); };
$("deleteAll").onclick = async () => { if (selected) await updateDoc(doc(C("chat_" + room), selected.id), { isDeleted: true, text: "", image: "", replyTo: null }); $("actions").classList.add("hidden"); };

// ShareChat / in-app browser detection.
// JavaScript cannot grant a permission that the host WebView has disabled.
const ua = navigator.userAgent || "";
const inAppBrowser =
  /; wv\)/i.test(ua) ||
  (/Android/i.test(ua) && /Version\/\d+\.\d+/i.test(ua) && /Chrome/i.test(ua));

if (inAppBrowser) {
  console.info("In-app/WebView detected. WebRTC depends on host permission support.");
}

// Basic compatibility check. This does not bypass restrictions imposed by an
// in-app browser; it only gives a useful message instead of failing silently.
if (!window.isSecureContext) {
  $("loginStatus").textContent = "⚠️ HTTPS is required for calls";
}
if (!window.RTCPeerConnection) {
  console.warn("WebRTC RTCPeerConnection is not available in this browser.");
}
if (!navigator.mediaDevices?.getUserMedia) {
  console.warn("getUserMedia is not available in this browser/WebView.");
}

const timer = setTimeout(() => { if (!uid) { $("loginStatus").textContent = "Firebase timeout — check Anonymous Auth"; } }, 12000);

function syncAppToVisualViewport() {
  const vv = window.visualViewport;
  const appEl = document.getElementById("app");
  if (!vv) {
    document.documentElement.style.setProperty("--app-height", `${window.innerHeight}px`);
    if (appEl) appEl.style.top = "0px";
    return;
  }

  // visualViewport.height becomes the visible area above the Android keyboard.
  // Keep the whole chat inside that area so the composer follows the keyboard.
  document.documentElement.style.setProperty("--app-height", `${vv.height}px`);

  // offsetTop is how far the visible area has scrolled down from the top of
  // the page (e.g. while the keyboard is open). Pinning #app's own top to
  // this — instead of leaving #app inside normal page flow — is what keeps
  // no blank strip from ever showing under the composer.
  if (appEl) appEl.style.top = `${vv.offsetTop}px`;

  // Keep the focused input visible after the viewport changes.
  if (document.activeElement === $("message")) {
    requestAnimationFrame(() => {
      $("message").scrollIntoView({ block: "nearest", inline: "nearest" });
    });
  }
}

syncAppToVisualViewport();
window.addEventListener("resize", syncAppToVisualViewport, { passive: true });
window.visualViewport?.addEventListener("resize", syncAppToVisualViewport, { passive: true });
window.visualViewport?.addEventListener("scroll", syncAppToVisualViewport, { passive: true });

signInAnonymously(auth).catch(e => fail("Firebase auth failed", e));
onAuthStateChanged(auth, u => {
  uid = u?.uid || null;
  if (uid) {
    clearTimeout(timer);
    $("connect").classList.remove("is-loading");
    $("connect").textContent = "Start Secure Chat";
    $("loginStatus").textContent = "✅ Connected";
  }
});
</script>
</body>
</html>
