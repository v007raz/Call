<body class="flex items-center justify-center">

<div id="app-container">

<!-- LOGIN -->

  <header class="bg-wa-lightTeal text-white px-3 py-2 flex items-center justify-between shadow-md z-20 shrink-0">

      <div class="ml-1 flex flex-col justify-center min-w-0">
        <h2 id="chat-partner-name" class="font-semibold text-[17px] leading-tight truncate">Partner</h2>
        <p id="chat-status" class="text-[11px] text-wa-bg opacity-90 truncate">Offline</p>
      </div>
    </div>
    <div class="flex items-center gap-1 relative">
      <button id="btn-video-call" class="hover:bg-white/20 p-2 rounded-full"><i class="ph-fill ph-video-camera text-xl"></i></button>
      <button id="btn-audio-call" class="hover:bg-white/20 p-2 rounded-full"><i class="ph-fill ph-phone text-xl"></i></button>
      <button id="btn-chat-menu" class="hover:bg-white/20 p-2 rounded-full"><i class="ph-fill ph-dots-three-vertical text-xl"></i></button>
      <div id="chat-dropdown" class="hidden absolute top-12 right-0 bg-white text-gray-800 shadow-xl rounded-lg w-52 overflow-hidden z-50 border border-gray-100">
        <button id="btn-change-theme" class="w-full text-left px-4 py-3 hover:bg-gray-100 text-[15px] flex items-center gap-3 border-b border-gray-100"><i class="ph ph-palette text-lg"></i>Change Background</button>
        <button id="btn-clear-chat" class="w-full text-left px-4 py-3 hover:bg-gray-100 text-[15px] flex items-center gap-3 text-red-600"><i class="ph ph-broom text-lg"></i>Clear Chat</button>

  <main id="chat-messages" class="flex-1 overflow-y-auto p-3 flex flex-col gap-2 relative z-0 pb-4">

  <div id="reply-preview-box" class="hidden shrink-0 bg-white/95 border-t border-gray-200 px-3 py-2 flex items-center gap-3 relative z-10 w-full rounded-t-xl">

  <div id="input-container" class="shrink-0 bg-[#f0f2f5] px-2 py-2 flex items-end gap-2 z-20 w-full">

<!-- IMAGE VIEWER -->
<div id="image-viewer-modal" class="hidden absolute inset-0 bg-black/95 z-[100] flex flex-col items-center justify-center p-2">

<!-- INCOMING -->

  <div class="w-24 h-24 bg-wa-lightTeal rounded-full flex items-center justify-center animate-pulse"><i class="ph-fill ph-phone-ringing text-5xl text-white"></i></div>
  <h2 class="text-white text-2xl font-bold mt-6 mb-2" id="incoming-caller-id">Caller</h2>

<div id="msg-action-modal" class="hidden absolute inset-0 bg-black/40 z-[60] flex items-center justify-center p-4 backdrop-blur-sm">

    <button id="btn-edit-msg" class="hidden px-5 py-3.5 text-left border-b flex items-center gap-3"><i class="ph ph-pencil-simple text-xl"></i>Edit message</button>
    <button id="btn-delete-me" class="px-5 py-3.5 text-left border-b flex items-center gap-3"><i class="ph ph-trash text-xl"></i>Delete for me</button>
    <button id="btn-delete-everyone" class="hidden px-5 py-3.5 text-left border-b flex items-center gap-3 text-red-500"><i class="ph ph-trash text-xl"></i>Delete for everyone</button>
    <button id="btn-action-cancel" class="px-5 py-3.5 text-center font-medium text-gray-600 bg-gray-50">Cancel</button>

<!-- CLEAR -->
<div id="confirm-modal" class="hidden absolute inset-0 bg-black/40 z-[70] flex items-center justify-center p-4 backdrop-blur-sm">

    <h3 class="text-lg font-bold mb-2">Clear this chat?</h3>
    <p class="text-sm text-gray-600 mb-4">Messages will be hidden for you.</p>
    <div class="flex justify-end gap-3"><button id="btn-confirm-cancel" class="px-4 py-2 text-wa-teal">Cancel</button><button id="btn-confirm-clear" class="px-4 py-2 bg-wa-teal text-white rounded">Clear Chat</button></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import {getAuth,signInAnonymously,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
import {getFirestore,doc,setDoc,getDoc,deleteDoc,onSnapshot,collection,query,updateDoc} from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyDHUttmxneJt1KZCf3d-9lRqrdxLxx76C0",
  authDomain:"myweb-88daa.firebaseapp.com",
  projectId:"myweb-88daa",
  storageBucket:"myweb-88daa.firebasestorage.app",
  messagingSenderId:"297038746284",
  appId:"1:297038746284:web:272d0ecdc8a3cfa3a20509",
  measurementId:"G-3KPXF8W72R"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
const APP_ID="my-whatsapp-clone";

let currentUserUid=null,myId="",partnerId="",currentRoomId="";
let unsubscribeChat=null,unsubscribePresence=null,unsubscribeTyping=null,unsubscribeIncoming=null;
let presenceTimer=null,typingTimer=null;
let localChatStore=[],selectedMsgObj=null,replyingToObj=null,editingMsgObj=null;
let sending=false;

let peerConnection=null,localStream=null;
let callId=null,callType=null,callTimer=null,callSeconds=0;
let callAnswerUnsub=null,callerCandidateUnsub=null,calleeCandidateUnsub=null,pendingCallData=null;

const $=id=>document.getElementById(id);
const ui={
 login:$("login-screen"),chat:$("chat-screen"),messages:$("chat-messages"),status:$("chat-status"),
 dropdown:$("chat-dropdown"),theme:$("theme-modal"),reply:$("reply-preview-box"),
 msgModal:$("msg-action-modal"),confirm:$("confirm-modal"),viewer:$("image-viewer-modal"),
 upload:$("upload-progress-bar"),uploadPercent:$("upload-percent"),call:$("call-screen"),incoming:$("incoming-call-modal")
};
const btn={
 connect:$("connect-btn"),send:$("send-btn"),back:$("btn-back"),menu:$("btn-chat-menu"),
 theme:$("btn-change-theme"),closeTheme:$("btn-close-theme"),clear:$("btn-clear-chat"),
 cancelReply:$("btn-cancel-reply"),cancelAction:$("btn-action-cancel"),reply:$("btn-reply-msg"),
 edit:$("btn-edit-msg"),delMe:$("btn-delete-me"),delAll:$("btn-delete-everyone"),
 confirmClear:$("btn-confirm-clear"),cancelClear:$("btn-confirm-cancel"),closeViewer:$("close-viewer"),
 videoCall:$("btn-video-call"),audioCall:$("btn-audio-call"),accept:$("accept-call-btn"),
 reject:$("reject-call-btn"),end:$("end-call-btn"),mic:$("toggle-mic-btn"),video:$("toggle-video-btn")
};
const inp={my:$("my-id-input"),partner:$("partner-id-input"),msg:$("msg-input"),media:$("media-input")};

inp.my.value=localStorage.getItem("whatsapp_my_id")||"";

function adjustViewport(){
  const h=window.visualViewport?.height||window.innerHeight;
  $("app-container").style.height=h+"px";
}
window.visualViewport?.addEventListener("resize",adjustViewport);
window.addEventListener("resize",adjustViewport);
adjustViewport();

window.setTheme=color=>{
  ui.chat.style.backgroundColor=color;
  localStorage.setItem("wa_chat_bg",color);
  ui.theme.classList.add("hidden");ui.dropdown.classList.add("hidden");
};
const savedBg=localStorage.getItem("wa_chat_bg");
if(savedBg)ui.chat.style.backgroundColor=savedBg;

function showError(title,error){
  console.error(title,error);
  const code=error?.code||"unknown";
  const message=error?.message||String(error);
  alert(title+"\\n\\nCode: "+code+"\\n"+message);
}

async function initAuth(){
  try{
    await signInAnonymously(auth);
    currentUserUid=auth.currentUser?.uid||null;
    if(!currentUserUid)throw new Error("Firebase user UID was not created.");
    $("login-status").textContent="✅ Connected!";
    btn.connect.disabled=false;
    btn.connect.classList.remove("opacity-50");
    btn.connect.innerHTML='Start Secure Chat <i class="ph-bold ph-arrow-right"></i>';
  }catch(error){
    $("login-status").textContent="❌ Firebase Authentication failed";
    showError("Authentication failed",error);
  }
}
onAuthStateChanged(auth,user=>{
  currentUserUid=user?.uid||null;
  if(currentUserUid){
    btn.connect.disabled=false;
    btn.connect.classList.remove("opacity-50");
  }
});
initAuth();

async function setPresence(online){
  if(!currentUserUid||!myId)return;
  try{
    await setDoc(doc(db,"artifacts",APP_ID,"public","data","presence_"+myId),{
      online,lastSeen:Date.now(),uid:currentUserUid
    },{merge:true});
  }catch(e){console.error("Presence error",e);}
}

function stopListeners(){
  if(unsubscribeChat){unsubscribeChat();unsubscribeChat=null}
  if(unsubscribePresence){unsubscribePresence();unsubscribePresence=null}
  if(unsubscribeTyping){unsubscribeTyping();unsubscribeTyping=null}
  if(unsubscribeIncoming){unsubscribeIncoming();unsubscribeIncoming=null}
  if(presenceTimer){clearInterval(presenceTimer);presenceTimer=null}
}

function startPresence(){
  setPresence(true);
  presenceTimer=setInterval(()=>setPresence(true),5000);

  unsubscribePresence=onSnapshot(
    doc(db,"artifacts",APP_ID,"public","data","presence_"+partnerId),
    snap=>{
      if(!snap.exists()){ui.status.textContent="Offline";return}
      const d=snap.data(),online=d.online&&Date.now()-d.lastSeen<15000;
      if(ui.status.dataset.typing!=="true"){
        ui.status.textContent=online?"Online":(d.lastSeen?"Last seen at "+new Date(d.lastSeen).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}):"Offline");
      }
    },
    e=>console.error("Presence listener",e)
  );

  unsubscribeTyping=onSnapshot(
    doc(db,"artifacts",APP_ID,"public","data","typing_"+currentRoomId),
    snap=>{
      const d=snap.exists()?snap.data():{};
      if(d[partnerId]===true){
        ui.status.dataset.typing="true";ui.status.textContent="typing...";
      }else{
        ui.status.dataset.typing="false";
      }
    }
  );
}

function clearMessageDOM(){
  [...ui.messages.children].forEach(el=>{
    if(el.id!=="secure-notice")el.remove();
  });
}

function startChatSync(){
  if(!currentUserUid)return;
  clearMessageDOM();localChatStore=[];
  const ref=collection(db,"artifacts",APP_ID,"public","data","chat_"+currentRoomId);
  unsubscribeChat=onSnapshot(query(ref),snap=>{
    const messages=[];
    snap.forEach(s=>{
      const d=s.data();
      if(!(d.deletedFor||[]).includes(myId))messages.push({id:s.id,...d});
    });
    messages.sort((a,b)=>(a.timestamp||0)-(b.timestamp||0));
    syncMessages(messages);
  },e=>showError("Chat sync failed",e));
}

function syncMessages(messages){
  let scroll=false;
  const incomingIds=new Set(messages.map(m=>m.id));
  for(const old of localChatStore){
    if(!incomingIds.has(old.id))document.getElementById("wrap_"+old.id)?.remove();
  }
  for(const msg of messages){
    const sent=msg.senderId===myId;
    const idx=localChatStore.findIndex(x=>x.id===msg.id);
    if(idx<0){
      localChatStore.push(msg);renderMessage(msg,sent);scroll=true;
      if(!sent&&msg.status!=="read"){
        updateDoc(doc(db,"artifacts",APP_ID,"public","data","chat_"+currentRoomId,msg.id),{status:"read"}).catch(()=>{});
      }
    }else{
      const changed=JSON.stringify(localChatStore[idx])!==JSON.stringify(msg);
      if(changed){localChatStore[idx]=msg;updateMessage(msg,sent)}
    }
  }
  localChatStore.sort((a,b)=>(a.timestamp||0)-(b.timestamp||0));
  if(scroll)setTimeout(()=>ui.messages.scrollTop=ui.messages.scrollHeight,50);
}

function safeText(value){
  return String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}

function activateReply(msg){
  replyingToObj=msg;editingMsgObj=null;ui.reply.classList.remove("hidden");
  $("reply-preview-sender").textContent=msg.senderId===myId?"You":msg.senderId;
  $("reply-preview-text").textContent=msg.text||(msg.media?"Secure Media":"");
  $("send-icon").className="ph-fill ph-paper-plane-right text-xl ml-1";
  inp.msg.focus();
}
function activateEdit(msg){
  editingMsgObj=msg;replyingToObj=null;ui.reply.classList.add("hidden");
  inp.msg.value=msg.text||"";inp.msg.style.height="auto";
  inp.msg.style.height=Math.min(inp.msg.scrollHeight,112)+"px";
  $("send-icon").className="ph-bold ph-check text-xl";
  inp.msg.focus();
}

function addSwipe(bubble,msg){
  let startX=0,currentX=0;
  bubble.addEventListener("touchstart",e=>{startX=e.touches[0].clientX},{passive:true});
  bubble.addEventListener("touchmove",e=>{
    currentX=e.touches[0].clientX-startX;
    if(Math.abs(currentX)<80)bubble.style.transform=`translateX(${currentX}px)`;
  },{passive:true});
  bubble.addEventListener("touchend",()=>{
    bubble.classList.add("swipe-transition");bubble.style.transform="translateX(0)";
    if(Math.abs(currentX)>50)activateReply(msg);
    setTimeout(()=>bubble.classList.remove("swipe-transition"),200);currentX=0;
  });
}

function renderMessage(msg,sent){
  const wrap=document.createElement("div");
  wrap.id="wrap_"+msg.id;
  wrap.className=`flex w-full ${sent?"justify-end":"justify-start"} mb-1 relative`;
  const bubble=document.createElement("div");
  bubble.id="bubble_"+msg.id;
  addSwipe(bubble,msg);
  bubble.addEventListener("click",e=>{
    if(e.target.closest("a,video,.reply-block"))return;
    selectedMsgObj=msg;ui.msgModal.classList.remove("hidden");
    btn.edit.classList.toggle("hidden",!(sent&&!msg.isDeleted&&!msg.media));
    btn.delAll.classList.toggle("hidden",!(sent&&!msg.isDeleted));
  });
  wrap.appendChild(bubble);ui.messages.appendChild(wrap);updateMessage(msg,sent);
}

function updateMessage(msg,sent){
  const bubble=$("bubble_"+msg.id);if(!bubble)return;
  if(msg.isDeleted){
    bubble.className="relative max-w-[80%] px-3 py-2 rounded-lg text-[15px] bg-white border border-gray-200 italic text-gray-500 shadow-sm";
    bubble.innerHTML=`<div><i class="ph ph-prohibit mr-1 text-lg"></i>${sent?"You deleted this message":"This message was deleted"}</div>`;
    return;
  }
  bubble.className=`relative max-w-[80%] px-2 py-1.5 rounded-lg shadow-sm text-[15px] text-gray-800 break-words ${sent?"bg-wa-sent rounded-tr-none bubble-tail-sent":"bg-wa-rcvd rounded-tl-none bubble-tail-rcvd"}`;

  let html="";
  if(msg.replyTo){
    html+=`<div class="bg-black/5 border-l-4 border-l-wa-teal p-1.5 rounded mb-1 text-sm cursor-pointer reply-block">
      <p class="font-bold text-wa-teal text-xs">${safeText(msg.replyTo.sender===myId?"You":msg.replyTo.sender)}</p>
      <p class="text-gray-600 text-xs truncate">${safeText(msg.replyTo.text)}</p></div>`;
  }
  if(msg.media?.data){
    try{
      const url=decodeURIComponent(atob(msg.media.data));
      if(msg.media.type==="image"){
        const id="img_"+msg.id;
        html+=`<div class="mb-1 rounded overflow-hidden cursor-pointer" data-view-image="${id}">
          <img id="${id}" src="${url}" class="max-w-full h-auto max-h-[260px] object-cover rounded" alt="image"></div>`;
      }else if(msg.media.type==="video"){
        html+=`<div class="mb-1 rounded overflow-hidden"><video src="${url}" controls class="max-w-full max-h-[260px] bg-black rounded"></video></div>`;
      }else if(msg.media.type==="audio"){
        html+=`<div class="mb-1"><audio src="${url}" controls class="w-full"></audio></div>`;
      }else{
        html+=`<div class="mb-1 mt-1 bg-black/5 p-2 rounded-lg flex items-center justify-between gap-2">
          <div class="flex items-center gap-2 overflow-hidden"><i class="ph-fill ph-file text-xl text-red-500"></i><span class="text-xs truncate">${safeText(msg.media.name)}</span></div>
          <a href="${url}" download="${safeText(msg.media.name)}" class="p-1 text-gray-600"><i class="ph-bold ph-download-simple text-lg"></i></a></div>`;
      }
    }catch(e){html+=`<div class="text-xs text-red-500 italic">File could not be displayed.</div>`}
  }
  const text=msg.text?safeText(msg.text).replace(/\n/g,"<br>"):"";
  if(text)html+=`<div class="pb-3 px-1">${text}</div>`;
  if(!text&&!msg.media)html+=`<div class="pb-3"></div>`;
  let ticks="";
  if(sent){
    if(msg.status==="read")ticks='<i class="ph-bold ph-checks text-blue-500 text-[14px]"></i>';
    else if(msg.status==="delivered")ticks='<i class="ph-bold ph-checks text-gray-400 text-[14px]"></i>';
    else ticks='<i class="ph-bold ph-check text-gray-400 text-[14px]"></i>';
  }
  const time=new Date(msg.timestamp||Date.now()).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
  html+=`<div class="absolute bottom-1 right-2 flex items-center gap-1 opacity-90 z-10">
    ${msg.isEdited?'<span class="text-[10px] text-gray-400 italic">edited</span>':""}
    <span class="text-[10px] text-gray-500">${time}</span>${ticks}</div>`;
  bubble.innerHTML=html;

  bubble.querySelector(".reply-block")?.addEventListener("click",e=>{
    e.stopPropagation();document.getElementById("wrap_"+msg.replyTo.id)?.scrollIntoView({behavior:"smooth",block:"center"});
  });
  bubble.querySelector("[data-view-image]")?.addEventListener("click",e=>{
    e.stopPropagation();openImageViewer(bubble.querySelector("img")?.src||"");
  });
}

function openImageViewer(url){
  if(!url)return;
  $("viewer-img").src=url;$("viewer-download-btn").href=url;ui.viewer.classList.remove("hidden");
}

async function sendMessage(){
  if(sending)return;
  if(!currentUserUid){alert("Firebase is not connected yet. Please wait a moment.");return}
  const text=inp.msg.value.trim();
  if(!text)return;
  sending=true;btn.send.disabled=true;
  try{
    await setDoc(doc(db,"artifacts",APP_ID,"public","data","typing_"+currentRoomId),{[myId]:false},{merge:true});
    if(editingMsgObj){
      await updateDoc(doc(db,"artifacts",APP_ID,"public","data","chat_"+currentRoomId,editingMsgObj.id),{text,isEdited:true});
      editingMsgObj=null;
    }else{
      const data={
        text,media:null,senderId:myId,timestamp:Date.now(),status:"sent",
        isDeleted:false,deletedFor:[],isEdited:false
      };
      if(replyingToObj){
        data.replyTo={id:replyingToObj.id,text:replyingToObj.text||"Media",sender:replyingToObj.senderId};
        replyingToObj=null;ui.reply.classList.add("hidden");
      }
      const id="msg_"+Date.now()+"_"+Math.random().toString(36).slice(2,8);
      await setDoc(doc(db,"artifacts",APP_ID,"public","data","chat_"+currentRoomId,id),data);
    }
    inp.msg.value="";inp.msg.style.height="auto";
  }catch(e){showError("Message send failed",e)}
  finally{sending=false;btn.send.disabled=false;inp.msg.focus()}
}

async function sendMedia(file){
  if(!currentUserUid){alert("Firebase is not connected yet.");return}
  if(file.size>450*1024){alert("File 450KB से छोटा रखें. Firestore में बड़ी files भेजना reliable नहीं है.");return}
  const reader=new FileReader();
  reader.onload=async()=>{
    try{
      const dataUrl=reader.result;
      const encoded=btoa(encodeURIComponent(dataUrl));
      const type=file.type.startsWith("image/")?"image":file.type.startsWith("video/")?"video":file.type.startsWith("audio/")?"audio":"document";
      const id="msg_"+Date.now()+"_"+Math.random().toString(36).slice(2,8);
      await setDoc(doc(db,"artifacts",APP_ID,"public","data","chat_"+currentRoomId,id),{
        text:"",media:{data:encoded,name:file.name,type,size:file.size},senderId:myId,
        timestamp:Date.now(),status:"sent",isDeleted:false,deletedFor:[],isEdited:false
      });
    }catch(e){showError("Media send failed",e)}
    finally{ui.upload.classList.add("hidden");inp.media.value=""}
  };
  reader.onerror=()=>{ui.upload.classList.add("hidden");alert("File read failed.")};
  ui.upload.classList.remove("hidden");ui.uploadPercent.textContent="0%";
  reader.onprogress=e=>{if(e.lengthComputable)ui.uploadPercent.textContent=Math.round(e.loaded/e.total*100)+"%"};
  reader.readAsDataURL(file);
}

function setupChat(){
  myId=inp.my.value.trim().toLowerCase();
  partnerId=inp.partner.value.trim().toLowerCase();
  if(!/^[a-z0-9_-]{2,40}$/.test(myId)||!/^[a-z0-9_-]{2,40}$/.test(partnerId)){
    alert("ID में केवल a-z, 0-9, _ या - रखें और कम से कम 2 characters रखें.");return;
  }
  if(myId===partnerId){alert("Your ID और Partner ID अलग रखें.");return}
  localStorage.setItem("whatsapp_my_id",myId);
  currentRoomId=[myId,partnerId].sort().join("_");
  $("chat-partner-name").textContent=partnerId.charAt(0).toUpperCase()+partnerId.slice(1);
  ui.login.classList.add("hidden");ui.chat.classList.remove("hidden");
  btn.send.disabled=false;
  startChatSync();startPresence();listenIncomingCalls();
}

btn.connect.addEventListener("click",setupChat);
inp.msg.addEventListener("input",()=>{
  inp.msg.style.height="auto";
  if(inp.msg.value)inp.msg.style.height=Math.min(inp.msg.scrollHeight,112)+"px";
  if(currentUserUid&&currentRoomId){
    setDoc(doc(db,"artifacts",APP_ID,"public","data","typing_"+currentRoomId),{[myId]:true},{merge:true}).catch(()=>{});
    clearTimeout(typingTimer);
    typingTimer=setTimeout(()=>setDoc(doc(db,"artifacts",APP_ID,"public","data","typing_"+currentRoomId),{[myId]:false},{merge:true}).catch(()=>{}),1500);
  }
});
inp.msg.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage()}
});
btn.send.addEventListener("click",e=>{e.preventDefault();sendMessage()});
inp.media.addEventListener("change",e=>{const f=e.target.files?.[0];if(f)sendMedia(f)});

btn.back.addEventListener("click",async()=>{
  stopListeners();await setPresence(false);
  ui.chat.classList.add("hidden");ui.login.classList.remove("hidden");
});
btn.menu.addEventListener("click",()=>ui.dropdown.classList.toggle("hidden"));
btn.theme.addEventListener("click",()=>{ui.dropdown.classList.add("hidden");ui.theme.classList.remove("hidden")});
btn.closeTheme.addEventListener("click",()=>ui.theme.classList.add("hidden"));
btn.closeViewer.addEventListener("click",()=>ui.viewer.classList.add("hidden"));

btn.cancelReply.addEventListener("click",()=>{replyingToObj=null;ui.reply.classList.add("hidden");inp.msg.focus()});
btn.cancelAction.addEventListener("click",()=>{ui.msgModal.classList.add("hidden");selectedMsgObj=null});
btn.reply.addEventListener("click",()=>{ui.msgModal.classList.add("hidden");if(selectedMsgObj)activateReply(selectedMsgObj)});
btn.edit.addEventListener("click",()=>{ui.msgModal.classList.add("hidden");if(selectedMsgObj)activateEdit(selectedMsgObj)});

btn.delMe.addEventListener("click",async()=>{
  if(!selectedMsgObj)return;
  ui.msgModal.classList.add("hidden");
  try{
    const old=selectedMsgObj.deletedFor||[];
    if(!old.includes(myId))await updateDoc(doc(db,"artifacts",APP_ID,"public","data","chat_"+currentRoomId,selectedMsgObj.id),{deletedFor:[...old,myId]});
  }catch(e){showError("Delete failed",e)}
  selectedMsgObj=null;
});
btn.delAll.addEventListener("click",async()=>{
  if(!selectedMsgObj)return;
  ui.msgModal.classList.add("hidden");
  try{await updateDoc(doc(db,"artifacts",APP_ID,"public","data","chat_"+currentRoomId,selectedMsgObj.id),{isDeleted:true,text:"",media:null})}
  catch(e){showError("Delete for everyone failed",e)}
  selectedMsgObj=null;
});

btn.clear.addEventListener("click",()=>{ui.dropdown.classList.add("hidden");ui.confirm.classList.remove("hidden")});
btn.cancelClear.addEventListener("click",()=>ui.confirm.classList.add("hidden"));
btn.confirmClear.addEventListener("click",async()=>{
  ui.confirm.classList.add("hidden");
  try{
    await Promise.all(localChatStore.map(async m=>{
      const old=m.deletedFor||[];
      if(!old.includes(myId))return updateDoc(doc(db,"artifacts",APP_ID,"public","data","chat_"+currentRoomId,m.id),{deletedFor:[...old,myId]});
    }));
  }catch(e){showError("Clear chat failed",e)}
});

async function getMedia(withVideo){
  try{
    return await navigator.mediaDevices.getUserMedia({
      video:withVideo?{width:{ideal:640},height:{ideal:480}}:false,audio:true
    });
  }catch(e){showError("Camera/Microphone access failed",e);return null}
}

const rtcConfig={iceServers:[
  {urls:"stun:stun.l.google.com:19302"},
  {urls:"stun:global.stun.twilio.com:3478"}
]};

function cleanupCallListeners(){
  if(callAnswerUnsub){callAnswerUnsub();callAnswerUnsub=null}
  if(callerCandidateUnsub){callerCandidateUnsub();callerCandidateUnsub=null}
  if(calleeCandidateUnsub){calleeCandidateUnsub();calleeCandidateUnsub=null}
}

function cleanupCall(){
  clearInterval(callTimer);callTimer=null;callSeconds=0;
  cleanupCallListeners();
  if(peerConnection){peerConnection.ontrack=null;peerConnection.onicecandidate=null;peerConnection.close();peerConnection=null}
  if(localStream){localStream.getTracks().forEach(t=>t.stop());localStream=null}
  $("remote-video").srcObject=null;$("local-video").srcObject=null;
  ui.call.classList.add("hidden");ui.chat.classList.remove("hidden");
  $("call-duration").textContent="Call Ended";
  callId=null;callType=null;pendingCallData=null;
}

function startTimer(){
  clearInterval(callTimer);callSeconds=0;
  callTimer=setInterval(()=>{
    callSeconds++;
    $("call-duration").textContent=String(Math.floor(callSeconds/60)).padStart(2,"0")+":"+String(callSeconds%60).padStart(2,"0");
  },1000);
}

function makePeer(isCaller){
  peerConnection=new RTCPeerConnection(rtcConfig);
  localStream.getTracks().forEach(t=>peerConnection.addTrack(t,localStream));
  peerConnection.ontrack=e=>{
    $("remote-video").srcObject=e.streams[0];startTimer();
  };
  peerConnection.onconnectionstatechange=()=>{
    if(["failed","closed","disconnected"].includes(peerConnection.connectionState)){
      if(peerConnection.connectionState==="failed")cleanupCall();
    }
  };
  peerConnection.onicecandidate=async e=>{
    if(!e.candidate||!callId)return;
    const owner=isCaller?myId:partnerId;
    const id="cand_"+Date.now()+"_"+Math.random().toString(36).slice(2,7);
    try{await setDoc(doc(db,"artifacts",APP_ID,"public","data","call_"+callId+"_candidates_"+owner,id),e.candidate.toJSON())}
    catch(err){console.error("ICE write",err)}
  };
  return peerConnection;
}

function watchCandidates(owner){
  return onSnapshot(
    collection(db,"artifacts",APP_ID,"public","data","call_"+callId+"_candidates_"+owner),
    snap=>snap.docChanges().forEach(async ch=>{
      if(ch.type==="added"&&peerConnection){
        try{await peerConnection.addIceCandidate(new RTCIceCandidate(ch.doc.data()))}catch(e){console.warn("ICE add",e)}
      }
    })
  );
}

async function initiateCall(withVideo){
  if(!partnerId||!currentUserUid)return;
  localStream=await getMedia(withVideo);if(!localStream)return;
  callType=withVideo?"video":"audio";callId=currentRoomId;
  $("local-video").srcObject=localStream;
  $("local-video-container").classList.toggle("hidden",!withVideo);
  $("remote-video").classList.toggle("hidden",!withVideo);
  $("audio-call-placeholder").classList.toggle("hidden",withVideo);
  $("call-partner-display").textContent="Calling "+partnerId+"...";
  $("call-duration").textContent="Ringing...";
  ui.chat.classList.add("hidden");ui.call.classList.remove("hidden");
  peerConnection=makePeer(true);
  const offer=await peerConnection.createOffer();
  await peerConnection.setLocalDescription(offer);
  try{
    await setDoc(doc(db,"artifacts",APP_ID,"public","data","active_call_"+partnerId),{
      caller:myId,type:callType,offer:{type:offer.type,sdp:offer.sdp},callId,timestamp:Date.now()
    });
    callAnswerUnsub=onSnapshot(doc(db,"artifacts",APP_ID,"public","data","call_answer_"+myId),async snap=>{
      if(!snap.exists()||!peerConnection)return;
      const d=snap.data();
      if(d.callId===callId&&d.answer&&!peerConnection.currentRemoteDescription){
        await peerConnection.setRemoteDescription(new RTCSessionDescription(d.answer));
      }
    });
    callerCandidateUnsub=watchCandidates(partnerId);
  }catch(e){showError("Call setup failed",e);cleanupCall()}
}

btn.videoCall.addEventListener("click",()=>initiateCall(true));
btn.audioCall.addEventListener("click",()=>initiateCall(false));

function listenIncomingCalls(){
  if(unsubscribeIncoming)unsubscribeIncoming();
  unsubscribeIncoming=onSnapshot(doc(db,"artifacts",APP_ID,"public","data","active_call_"+myId),snap=>{
    if(!snap.exists())return;
    const d=snap.data();
    if(d.caller&&d.caller!==myId&&Date.now()-d.timestamp<30000){
      pendingCallData=d;
      $("incoming-caller-id").textContent=d.caller;
      ui.incoming.classList.remove("hidden");
    }
  });
}

btn.accept.addEventListener("click",async()=>{
  const d=pendingCallData;if(!d)return;
  localStream=await getMedia(d.type==="video");if(!localStream)return;
  callId=d.callId;callType=d.type;
  $("local-video").srcObject=localStream;
  $("local-video-container").classList.toggle("hidden",d.type!=="video");
  $("remote-video").classList.toggle("hidden",d.type!=="video");
  $("audio-call-placeholder").classList.toggle("hidden",d.type==="video");
  $("call-partner-display").textContent=d.caller;
  $("call-duration").textContent="Connecting...";
  ui.incoming.classList.add("hidden");ui.chat.classList.add("hidden");ui.call.classList.remove("hidden");
  try{
    peerConnection=makePeer(false);
    await peerConnection.setRemoteDescription(new RTCSessionDescription(d.offer));
    const answer=await peerConnection.createAnswer();
    await peerConnection.setLocalDescription(answer);
    await setDoc(doc(db,"artifacts",APP_ID,"public","data","call_answer_"+d.caller),{
      callId,answer:{type:answer.type,sdp:answer.sdp},timestamp:Date.now()
    });
    calleeCandidateUnsub=watchCandidates(d.caller);
    await deleteDoc(doc(db,"artifacts",APP_ID,"public","data","active_call_"+myId)).catch(()=>{});
    pendingCallData=null;
  }catch(e){showError("Accept call failed",e);cleanupCall()}
});

btn.reject.addEventListener("click",async()=>{
  ui.incoming.classList.add("hidden");
  if(pendingCallData)await deleteDoc(doc(db,"artifacts",APP_ID,"public","data","active_call_"+myId)).catch(()=>{});
  pendingCallData=null;
});

btn.end.addEventListener(async()=>{
  if(myId&&partnerId){
    await setDoc(doc(db,"artifacts",APP_ID,"public","data","call_end_"+partnerId),{callId:callId,timestamp:Date.now()},{merge:true}).catch(()=>{});
  }
  if(callId)await deleteDoc(doc(db,"artifacts",APP_ID,"public","data","active_call_"+myId)).catch(()=>{});
  cleanupCall();
});

btn.mic.addEventListener("click",()=>{
  const t=localStream?.getAudioTracks()?.[0];if(!t)return;
  t.enabled=!t.enabled;$("mic-icon").className=t.enabled?"ph-fill ph-microphone text-2xl":"ph-fill ph-microphone-slash text-2xl";
});
btn.video.addEventListener("click",()=>{
  const t=localStream?.getVideoTracks()?.[0];if(!t)return;
  t.enabled=!t.enabled;$("video-icon").className=t.enabled?"ph-fill ph-video-camera text-2xl":"ph-fill ph-video-camera-slash text-2xl";
});

console.log("Secure Cloud loaded. Firebase project:",firebaseConfig.projectId);
</script>
